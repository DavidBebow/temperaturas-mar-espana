name: Municipios 2050 (generación · reanudable)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generar municipios.json (hasta 5 h, reanudable)
        env:
          SRC: scripts/municipios_fuente.csv
          OUT: docs/municipios.json
          MAXSECONDS: "18000"
        run: python scripts/gen_municipios_2050.py

      - name: Publicar avance
        if: always()
        run: |
          git config user.name  "GitHub Actions Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A docs/ scripts/
          git commit -m "Municipios 2050: avance $(date -u +'%F %H:%M')" || { echo "sin cambios"; exit 0; }
          git pull --rebase --autostash origin main
          git push origin main
