name: Municipios 2050 (generación · reanudable)

on:
  workflow_dispatch:          # se lanza a mano desde la pestaña Actions

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350       # tope de GitHub (6 h); paramos antes con MAXSECONDS
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generar municipios.json (hasta 5 h, reanudable)
        env:
          SRC: scripts/municipios_fuente.csv     # el CSV que subes una vez
          OUT: docs/municipios.json              # salida (la lee el mapa)
          MAXSECONDS: "18000"                    # 5 h y para, guardando el avance
        run: python scripts/gen_municipios_2050.py

      - name: Publicar avance
        if: always()
        run: |
          git config user.name  "GitHub Actions Bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/municipios.json
          git commit -m "Municipios 2050: avance $(date -u +'%F %H:%M')" || { echo "sin cambios"; exit 0; }
          git pull --rebase --autostash origin main
          git push origin main
