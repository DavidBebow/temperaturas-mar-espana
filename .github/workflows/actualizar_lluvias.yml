name: Actualizar lluvias

on:
  schedule:
    # Todos los días a las 07:00 UTC (09:00 en España)
    - cron: '0 7 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  actualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests

      - name: Ejecutar script
        run: python scripts/obtener_lluvias.py

      - name: Guardar cambios
        run: |
          git config --local user.email "accion@github.com"
          git config --local user.name "GitHub Actions Bot"
          git add docs/lluvias_nacional.json
          git diff --staged --quiet || (git commit -m "Lluvias actualizadas: $(date +'%d/%m/%Y %H:%M')" && git pull --rebase && git push)
