name: Actualizar lluvias

on:
  schedule:
    # Todos los días a las 06:19 UTC (08:19 en España). Minuto raro a proposito:
    # a las 07:00 en punto GitHub la lanzaba con cinco y seis horas de retraso.
    - cron: '19 6 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  actualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests

      - name: Ejecutar script
        run: python scripts/obtener_lluvias.py

      - name: Guardar cambios
        run: |
          git config --local user.email "accion@github.com"
          git config --local user.name "GitHub Actions Bot"
          git add docs/lluvias_nacional.json
          git diff --staged --quiet && exit 0
          git commit -m "Lluvias actualizadas: $(date +'%d/%m/%Y %H:%M')"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash -X theirs origin main && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i*7))
          done
          exit 1
