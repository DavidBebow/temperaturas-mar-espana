name: Actualizar deshielo de los polos

on:
  schedule:
    - cron: "40 9 * * *"   # a diario, 09:40 UTC (el NSIDC publica el día anterior por la mañana)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deshielo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Núcleo desde el repo privado (mismo patrón que avisos / boyas).
      # Si aún no has migrado los scripts, borra estos dos pasos: usará scripts/ de este repo.
      - name: Descargar scripts privados
        uses: actions/checkout@v4
        with:
          repository: DavidBebow/clima-scripts
          token: ${{ secrets.SCRIPTS_TOKEN }}
          path: scripts

      - name: Aislar scripts del control de versiones
        run: rm -rf scripts/.git

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generar deshielo.json
        run: python scripts/deshielo_generar.py

      - name: Publicar cambios
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/deshielo.json
          git diff --cached --quiet || git commit -m "Deshielo de los polos $(date -u +'%F %H:%M')"
          git push
