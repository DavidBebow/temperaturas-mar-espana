name: Actualizar días de más de 32 grados (estaciones AEMET)
# Va en el repo PUBLICO (temperaturas-mar-espana). El script vive en clima-scripts.
# Cuenta los días de más de 32 °C en la estación de AEMET de cada capital, año a
# año desde 1961, y escribe docs/dias32_estaciones.json, que lee el agregador
# provincial. Cada pasada rehace primero el año en curso de las 52 estaciones y
# después completa el archivo histórico por partes: la pasada de día tiene 15
# minutos (no compite por el cupo de AEMET con las demás herramientas) y la de
# la noche, 150. Con el archivo completo, las dos solo rehacen el año en curso.

on:
  schedule:
    - cron: "40 12 * * *"   # 14:40 peninsular en verano, después de las noches tropicales
    - cron: "40 0 * * *"    # segunda pasada nocturna mientras se completa el archivo
  workflow_dispatch:

concurrency:
  group: dias32-estaciones
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
    steps:
      - name: Descargar repo publico (este)
        uses: actions/checkout@v4

      - name: Descargar scripts privados (clima-scripts)
        uses: actions/checkout@v4
        with:
          repository: DavidBebow/clima-scripts
          token: ${{ secrets.SCRIPTS_TOKEN }}
          path: clima-scripts

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generar dias32_estaciones.json
        env:
          AEMET_API_KEY: ${{ secrets.AEMET_API_KEY }}
          CG_MINUTOS: ${{ github.event.schedule == '40 12 * * *' && '15' || '150' }}
        run: python clima-scripts/dias32_estaciones.py

      - name: Guardar cambios
        run: |
          git config --local user.email "accion@github.com"
          git config --local user.name "GitHub Actions Bot"
          git add docs/dias32_estaciones.json
          if git diff --staged --quiet; then
            echo "No hay cambios que guardar"
            exit 0
          fi
          git commit -m "Días de más de 32 °C en las estaciones de AEMET: $(date -u +'%F %H:%M')"
          for intento in 1 2 3 4 5 6; do
            git pull --rebase --autostash && git push && exit 0
            echo "Push fallido. Reintento $intento/6 en 15 s..."
            sleep 15
          done
          echo "No se pudo guardar tras 6 intentos"
          exit 1
