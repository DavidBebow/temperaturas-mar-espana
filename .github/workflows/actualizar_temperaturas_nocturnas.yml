name: Actualizar temperaturas nocturnas

on:
  schedule:
    # 11:00 UTC = 13:00 en España peninsular en verano, 12:00 en invierno.
    # Lo hacemos más tarde para dar tiempo a que AEMET publique el dato diario de ayer.
    - cron: "0 11 * * *"
  workflow_dispatch:

jobs:
  actualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install requests

      - name: Ejecutar script
        env:
          AEMET_API_KEY: ${{ secrets.AEMET_API_KEY }}
        run: python scripts/obtener_temperaturas_nocturnas.py

      - name: Guardar cambios
        run: |
          git config --local user.email "accion@github.com"
          git config --local user.name "GitHub Actions Bot"
          git add docs/temperaturas_nocturnas.json docs/noches_tropicales.html
          git diff --staged --quiet || git commit -m "Actualiza temperaturas nocturnas"
          git pull --rebase
          git push
