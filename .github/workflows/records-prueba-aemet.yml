name: Récords · prueba del endpoint de valores extremos (diagnóstico)

# Una sola estación: enseña qué contesta AEMET OpenData al endpoint de valores
# extremos, con varias formas de pedirlo. Solo para diagnosticar; no escribe nada.

on:
  workflow_dispatch:
    inputs:
      idema:
        description: "Indicativo de la estación"
        required: false
        default: "9434"

permissions:
  contents: read

jobs:
  prueba:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install requests

      - name: Preguntar a AEMET
        env:
          AEMET_API_KEY: ${{ secrets.AEMET_API_KEY }}
          IDEMA: ${{ github.event.inputs.idema }}
        run: |
          python - <<'EOF'
          import json, os, time, requests
          key = os.environ.get("AEMET_API_KEY", "")
          idema = (os.environ.get("IDEMA") or "9434").strip()
          base = "https://opendata.aemet.es/opendata/api"
          print("clave definida:", bool(key), "· longitud", len(key), "· estación", idema)

          def muestra(nombre, url, headers=None, params=None):
              print("\n==", nombre)
              print("   GET", url, "params" if params else "", list((params or {}).keys()))
              try:
                  r = requests.get(url, headers=headers or {}, params=params, timeout=40)
              except Exception as e:
                  print("   excepción:", e)
                  return None
              print("   http", r.status_code, "·", r.headers.get("Content-Type"))
              txt = r.text
              print("   cuerpo:", txt[:700].replace("\n", " "))
              try:
                  body = r.json()
              except Exception:
                  return None
              if isinstance(body, dict) and body.get("datos"):
                  time.sleep(1.2)
                  r2 = requests.get(body["datos"], timeout=60)
                  print("   datos: http", r2.status_code, "·", r2.headers.get("Content-Type"), "·", len(r2.content), "bytes")
                  print("   datos (inicio):", r2.text[:900].replace("\n", " "))
                  try:
                      d = r2.json()
                      if isinstance(d, list):
                          print("   filas:", len(d), "· claves:", sorted(d[0].keys()) if d and isinstance(d[0], dict) else "-")
                  except Exception as e:
                      print("   datos no son JSON:", e)
              return body

          H = {"api_key": key, "Accept": "application/json"}
          muestra("1 · extremos T, clave en cabecera (lo que hace records_baseline.py)",
                  f"{base}/valores/climatologicos/valoresextremos/parametro/T/estacion/{idema}", headers=H)
          time.sleep(1.6)
          muestra("2 · extremos T, clave como parámetro de la URL",
                  f"{base}/valores/climatologicos/valoresextremos/parametro/T/estacion/{idema}", params={"api_key": key})
          time.sleep(1.6)
          muestra("3 · extremos P (precipitación), clave en cabecera",
                  f"{base}/valores/climatologicos/valoresextremos/parametro/P/estacion/{idema}", headers=H)
          time.sleep(1.6)
          muestra("4 · normales de la estación (otro endpoint del mismo grupo)",
                  f"{base}/valores/climatologicos/normales/estacion/{idema}", headers=H)
          time.sleep(1.6)
          muestra("5 · inventario (el que ya funciona)",
                  f"{base}/valores/climatologicos/inventarioestaciones/todasestaciones", headers=H)
          EOF
