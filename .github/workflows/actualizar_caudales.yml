name: Actualizar caudales

on:
  schedule:
    - cron: "20 6 * * *"        # cada día a las 06:20 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      # 1) Este repo público
      - name: Checkout público
        uses: actions/checkout@v4

      # 2) Repo privado con el cerebro (no se publica, solo se usa para ejecutar)
      - name: Checkout privado
        uses: actions/checkout@v4
        with:
          repository: DavidBebow/clima-scripts
          token: ${{ secrets.SCRIPTS_TOKEN }}
          path: privado

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install requests

      # 3) Ejecuta el script privado y escribe los datos en docs/data de este repo
      - name: Generar caudales
        env:
          OUTPUT_DIR: ${{ github.workspace }}/docs/data
        run: python privado/generar_caudales.py

      # 4) Commit de los datos en este repo público
      - name: Publicar
        run: |
          git config user.name  "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add docs/data/estaciones.geojson docs/data/meta.json
          if git diff --staged --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Caudales actualizados: $(date -u +'%d/%m/%Y %H:%M')"
            git push
          fi
