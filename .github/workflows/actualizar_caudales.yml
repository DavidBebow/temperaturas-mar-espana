name: Actualizar caudales

on:
  schedule:
    - cron: "35 7 * * *"         # GloFAS publica la previsión del día de madrugada
    - cron: "35 14 * * *"        # segunda pasada por si la primera llegó antes que los datos
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: caudales-glofas
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout público
        uses: actions/checkout@v4

      - name: Checkout privado
        uses: actions/checkout@v4
        with:
          repository: DavidBebow/clima-scripts
          token: ${{ secrets.SCRIPTS_TOKEN }}
          path: privado

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install numpy netCDF4 cdsapi

      - name: Generar caudales (GloFAS)
        env:
          OUTPUT_DIR: ${{ github.workspace }}/docs/caudal
          DATA_DIR: ${{ github.workspace }}/datos_caudal
          EWDS_TOKEN: ${{ secrets.EWDS_TOKEN }}
          GLOFAS_VARIANTE: "0"
        run: python privado/caudal_diario.py

      - name: Resumen de servidor en WordPress
        # El bloque que lee Google en /caudal-rios-espana-mapa/ se rehace con el
        # dato del dia. Va antes de publicar porque ese paso borra privado/.
        continue-on-error: true
        env:
          CG_DOCS: ${{ github.workspace }}/docs
          WP_URL: https://calentamientoglobal.es
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_AGOSTO }}
        run: |
          pip install -q requests
          python privado/publicar_resumenes_wp.py --solo caudal

      - name: Publicar
        run: |
          rm -rf privado
          git config user.name  "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add -A docs/caudal
          if [ -d datos_caudal ]; then git add -A datos_caudal; fi
          if git diff --staged --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Caudales actualizados: $(date -u +'%d/%m/%Y %H:%M')"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash -X theirs origin main && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i*7))
          done
          exit 1
