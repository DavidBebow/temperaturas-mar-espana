name: Actualizar aforos medidos (caudal)

on:
  schedule:
    - cron: "17 */3 * * *"       # cada 3 horas
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: caudales-aforos
  cancel-in-progress: false

jobs:
  aforos:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout público
        uses: actions/checkout@v4

      - name: Checkout privado
        uses: actions/checkout@v4
        with:
          repository: DavidBebow/clima-scripts
          token: ${{ secrets.SCRIPTS_TOKEN }}
          path: privado

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install requests

      - name: Leer aforos
        env:
          OUTPUT_DIR: ${{ github.workspace }}/docs/caudal
          DATA_DIR: ${{ github.workspace }}/datos_caudal
        run: python privado/caudal_aforos.py

      - name: Publicar
        run: |
          rm -rf privado
          git config user.name  "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add docs/caudal/aforos.json
          if [ -d datos_caudal ]; then git add -A datos_caudal; fi
          if git diff --staged --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Aforos medidos: $(date -u +'%d/%m/%Y %H:%M')"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash -X theirs origin main && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i*7))
          done
          exit 1
