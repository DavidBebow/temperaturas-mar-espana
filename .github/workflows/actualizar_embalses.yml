#!/usr/bin/env python3
# -*- coding: utf-8 -*-
"""
embalses_generar.py — Estado de los embalses de España por provincia
=====================================================================
Repo: clima-scripts (privado). Se ejecuta desde el workflow del repo público
(temperaturas-mar-espana/.github/workflows/actualizar_embalses.yml).

FUENTE PRIMARIA (oficial y estable):
  Boletín Hidrológico Semanal — MITECO, base de datos histórica completa
  (todos los embalses peninsulares > 5 hm³, semanal desde 1988):
    https://www.miteco.gob.es/content/dam/miteco/es/agua/temas/
      evaluacion-de-los-recursos-hidricos/boletin-hidrologico/
      Historico-de-embalses/BD-Embalses.zip
  Contiene BD-embalses.mdb (Access). Se lee con mdbtools (apt).
  Tabla "T_Datos Embalses 1988-20XX" con campos:
    AMBITO_NOMBRE, EMBALSE_NOMBRE, FECHA, AGUA_TOTAL (capacidad, hm³),
    AGUA_ACTUAL (reserva, hm³), ELECTRICO_FLAG (0 consuntivo / 1 hidroeléctrico)

FUENTE DE RESPALDO (también oficial, MITECO — alimenta su dashboard ArcGIS
del Boletín): FeatureServers "Embalses_Mapa" (semana actual) y
"Embalses_Total" (histórico completo). Solo se usa si el ZIP falla.

Si AMBAS fuentes fallan, el script sale con error SIN escribir nada:
los JSON publicados conservan la última semana buena. NUNCA se inventan datos.

MAPEO EMBALSE → PROVINCIA:
  datos/embalses_maestro.json (este repo). Construido el 18/08/2026 a partir
  de las coordenadas oficiales del MITECO cruzadas con los límites
  provinciales, y verificado embalse a embalse en los casos fronterizos.
  Un embalse nuevo del boletín que no esté en el maestro NO se pierde:
  aparece en docs/embalses/diagnostico.json (clave "sin_maestro").

SALIDAS (en $SALIDA_DIR, por defecto docs/ del repo público):
  docs/embalses.json                JSON nacional nuevo (mapa)
  docs/embalses_nacional.json       compatibilidad con el widget antiguo
  docs/embalses/{provincia}.json    detalle por provincia (46 provincias)
  docs/embalses/{provincia}.html    copia del widget provincia.html
  docs/embalses/diagnostico.json    salud del proceso (revisar si hay avisos)
  docs/embalses/_ping_urls.txt      URLs de WordPress a notificar a IndexNow

Dependencias en GitHub Actions:
  sudo apt-get install -y mdbtools
  pip install requests
"""

import csv
import io
import json
import os
import re
import shutil
import subprocess
import sys
import tempfile
import unicodedata
import zipfile
from datetime import datetime, timedelta, timezone

import requests

# ─────────────────────────────────────────────────────────────────────────────
# Configuración
# ─────────────────────────────────────────────────────────────────────────────
AQUI = os.path.dirname(os.path.abspath(__file__))
MAESTRO_PATH = os.path.join(AQUI, "datos", "embalses_maestro.json")
SALIDA_DIR = os.environ.get("SALIDA_DIR", "docs")

ZIP_URL = ("https://www.miteco.gob.es/content/dam/miteco/es/agua/temas/"
           "evaluacion-de-los-recursos-hidricos/boletin-hidrologico/"
           "Historico-de-embalses/BD-Embalses.zip")

# Respaldo: servicios ArcGIS oficiales del MITECO (dashboard del Boletín).
ARCGIS_ACTUAL = ("https://services-eu1.arcgis.com/RvnYk1PBUJ9rrAuT/arcgis/"
                 "rest/services/Embalses_Mapa/FeatureServer/0")
ARCGIS_HIST = ("https://services-eu1.arcgis.com/RvnYk1PBUJ9rrAuT/arcgis/"
               "rest/services/Embalses_Total/FeatureServer/0")
# Si el MITECO reorganiza su ArcGIS, estos item-ids permiten re-resolver la URL:
ARCGIS_ITEM_ACTUAL = "acb3c0e776ab4628b9a61926cce387b8"
ARCGIS_ITEM_HIST = "c7d398ac62ec407bafc8d0ca94711a87"

CABECERA = {"User-Agent": "Mozilla/5.0 (compatible; calentamientoglobal.es; observatorio climático)"}

WEB_BASE = "https://calentamientoglobal.es"
# Candidatas para la página nacional (se comprueba cuál existe realmente):
CANDIDATAS_NACIONAL = ["/embalses-espana/", "/estado-embalses/", "/embalses-en-espana/", "/embalses/"]
# Slugs de WordPress que no siguen el patrón /embalses-{provincia}/:
WP_EXCEPCIONES = {"cordoba": "/embalses-de-cordoba/"}

MIN_EMBALSES_OK = 300      # si el boletín trae menos, algo va mal: no publicar
SEMANAS_SERIE = 104        # dos años de serie provincial
TOL_DIAS = 12              # tolerancia al buscar la semana equivalente de otros años

UMBRALES = [(20, "#CC2200", "Crítico"), (40, "#FF8822", "Bajo"),
            (60, "#FFCC44", "Moderado"), (80, "#44AA66", "Bueno"),
            (10**9, "#0077DD", "Muy bueno")]


def color_etiqueta(pct):
    if pct is None:
        return "#8E8E93", "Sin datos"
    for lim, col, et in UMBRALES:
        if pct < lim:
            return col, et
    return UMBRALES[-1][1], UMBRALES[-1][2]


def norm_clave(nombre):
    """Normaliza EMBALSE_NOMBRE para casar boletín ↔ maestro."""
    s = "".join(c for c in unicodedata.normalize("NFD", nombre.upper())
                if unicodedata.category(c) != "Mn")
    return " ".join(s.replace("-", " ").replace(".", "").replace(",", "").split())


def r1(x):
    return None if x is None else round(x, 1)


# ─────────────────────────────────────────────────────────────────────────────
# Fuente primaria: BD-Embalses.zip (mdb) → historial completo
# ─────────────────────────────────────────────────────────────────────────────
def leer_mdb():
    """Devuelve dict clave_normalizada -> lista [(fecha, cap, vol)] ordenada."""
    print("Descargando BD-Embalses.zip del MITECO…")
    r = requests.get(ZIP_URL, headers=CABECERA, timeout=300)
    r.raise_for_status()
    tmp = tempfile.mkdtemp(prefix="embalses_")
    zpath = os.path.join(tmp, "bd.zip")
    with open(zpath, "wb") as f:
        f.write(r.content)
    with zipfile.ZipFile(zpath) as z:
        mdb_name = next(n for n in z.namelist() if n.lower().endswith(".mdb"))
        z.extract(mdb_name, tmp)
    mdb = os.path.join(tmp, mdb_name)

    tablas = subprocess.run(["mdb-tables", "-1", mdb], capture_output=True,
                            text=True, check=True).stdout.strip().split("\n")
    tabla = next(t for t in tablas if "datos" in t.lower() and "embalse" in t.lower())
    print(f"  Tabla: {tabla}")
    exp = subprocess.run(["mdb-export", "-D", "%Y-%m-%d", mdb, tabla],
                         capture_output=True, text=True, check=True).stdout

    series = {}
    nombres_originales = {}
    for fila in csv.DictReader(io.StringIO(exp)):
        try:
            nombre = fila["EMBALSE_NOMBRE"].strip()
            fecha = fila["FECHA"].strip()[:10]
            cap = float(fila["AGUA_TOTAL"]) if fila["AGUA_TOTAL"] else None
            vol = float(fila["AGUA_ACTUAL"]) if fila["AGUA_ACTUAL"] else 0.0
            datetime.strptime(fecha, "%Y-%m-%d")
        except (KeyError, ValueError):
            continue
        if not nombre or cap is None or cap <= 0:
            continue
        k = norm_clave(nombre)
        series.setdefault(k, []).append((fecha, cap, vol))
        nombres_originales[k] = nombre
    for k in series:
        series[k].sort()
    total = sum(len(v) for v in series.values())
    print(f"  {len(series)} embalses, {total} registros semanales")
    if total < 100000:
        raise RuntimeError(f"El mdb parece incompleto ({total} registros)")
    return series, nombres_originales


def metricas_desde_series(series):
    """Calcula actual / hace 1 año / media 10 años y series provinciales."""
    fecha_max = max(v[-1][0] for v in series.values())
    d_max = datetime.strptime(fecha_max, "%Y-%m-%d")

    # parsear cada fecha una sola vez (763k filas: evita re-parsear en cada búsqueda)
    parseadas = {k: [(datetime.strptime(f, "%Y-%m-%d"), cap, vol) for f, cap, vol in v]
                 for k, v in series.items()}

    def buscar(vals_p, objetivo, tol=TOL_DIAS):
        """Valor (cap, vol) más cercano a la fecha objetivo dentro de ±tol días."""
        mejor, mejor_d = None, tol + 1
        for dt, cap, vol in vals_p:
            d = abs((dt - objetivo).days)
            if d < mejor_d:
                mejor, mejor_d = (cap, vol), d
        return mejor

    datos = {}
    for k, vals in series.items():
        vals_p = parseadas[k]
        f_ult, cap, vol = vals[-1]
        if (d_max - vals_p[-1][0]).days > 21:
            # sin dato reciente: se publica como "sin datos", jamás inventado
            datos[k] = {"cap": cap, "vol": None, "v1": None, "v10": None,
                        "c1": None, "pct10": None}
            continue
        e1 = buscar(vals_p, d_max - timedelta(days=364))
        pcts, vols10 = [], []
        for y in range(1, 11):
            ey = buscar(vals_p, d_max - timedelta(days=364 * y))
            if ey and ey[0] > 0:
                pcts.append(ey[1] / ey[0] * 100.0)
                vols10.append(ey[1])
        datos[k] = {
            "cap": cap, "vol": vol,
            "v1": e1[1] if e1 else None,
            "c1": e1[0] if e1 else None,
            "v10": (sum(vols10) / len(vols10)) if len(vols10) >= 6 else None,
            "pct10": (sum(pcts) / len(pcts)) if len(pcts) >= 6 else None,
        }

    # fechas semanales globales (para las series provinciales)
    fechas = sorted({f for v in series.values() for f, _, _ in v})[-SEMANAS_SERIE:]
    return datos, fecha_max, fechas


def series_provinciales(series, maestro, fechas):
    """% agregado por provincia para cada fecha (solo embalses con dato)."""
    por_prov = {}
    for k, vals in series.items():
        info = maestro.get(k)
        if not info:
            continue
        idx = {f: (cap, vol) for f, cap, vol in vals}
        por_prov.setdefault(info["provincia_slug"], []).append(idx)
    out = {}
    for slug, lista in por_prov.items():
        serie = []
        for f in fechas:
            cap_s = vol_s = 0.0
            for idx in lista:
                if f in idx:
                    cap_s += idx[f][0]
                    vol_s += idx[f][1]
            if cap_s > 0:
                serie.append({"fecha": f, "pct": round(vol_s / cap_s * 100, 1)})
        out[slug] = serie
    return out


# ─────────────────────────────────────────────────────────────────────────────
# Fuente de respaldo: ArcGIS oficial del MITECO
# ─────────────────────────────────────────────────────────────────────────────
def _resolver_arcgis(url_fija, item_id):
    try:
        r = requests.get(url_fija + "?f=json", headers=CABECERA, timeout=30)
        if r.status_code == 200 and "fields" in r.json():
            return url_fija
    except Exception:
        pass
    r = requests.get(f"https://www.arcgis.com/sharing/rest/content/items/{item_id}?f=json",
                     headers=CABECERA, timeout=30)
    return r.json()["url"].rstrip("/") + "/0"


def leer_arcgis():
    """Respaldo: semana actual + comparativas desde el histórico ArcGIS."""
    print("⚠️ ZIP no disponible. Usando el servicio ArcGIS oficial del MITECO…")
    u_act = _resolver_arcgis(ARCGIS_ACTUAL, ARCGIS_ITEM_ACTUAL)
    u_his = _resolver_arcgis(ARCGIS_HIST, ARCGIS_ITEM_HIST)

    r = requests.get(u_act + "/query", params={
        "where": "1=1", "outFields": "embalse_nombre,agua_total,agua_actual,fecha,boletin_num",
        "resultRecordCount": 2000, "f": "json"}, headers=CABECERA, timeout=60).json()
    feats = r["features"]
    num = feats[0]["attributes"]["boletin_num"]
    fecha_max = datetime.fromtimestamp(
        feats[0]["attributes"]["fecha"] / 1000, tz=timezone.utc).strftime("%Y-%m-%d")
    anyo = int(fecha_max[:4])

    def stats(where):
        q = {"where": where, "groupByFieldsForStatistics": "embalse_nombre",
             "outStatistics": json.dumps([{"statisticType": "avg",
                                           "onStatisticField": "agua_actual",
                                           "outStatisticFieldName": "v"}]),
             "f": "json"}
        d = requests.get(u_his + "/query", params=q, headers=CABECERA, timeout=120).json()
        return {f["attributes"]["embalse_nombre"]: f["attributes"]["v"]
                for f in d["features"]}

    y1 = stats(f"boletin_anyo={anyo - 1} AND boletin_num={num}")
    y10 = stats(f"boletin_anyo>={anyo - 10} AND boletin_anyo<={anyo - 1} AND boletin_num={num}")

    datos, nombres = {}, {}
    for f in feats:
        a = f["attributes"]
        n = a["embalse_nombre"].strip()
        k = norm_clave(n)
        nombres[k] = n
        cap = a["agua_total"]
        if not cap or cap <= 0:
            continue
        v10 = y10.get(n)
        datos[k] = {"cap": float(cap), "vol": float(a["agua_actual"] or 0),
                    "v1": y1.get(n), "c1": None,
                    "v10": v10, "pct10": (v10 / cap * 100.0) if v10 is not None else None}
    print(f"  {len(datos)} embalses desde ArcGIS (boletín {num}/{anyo})")
    return datos, nombres, fecha_max


# ─────────────────────────────────────────────────────────────────────────────
# Detección de páginas de WordPress (para enlaces del mapa e IndexNow)
# ─────────────────────────────────────────────────────────────────────────────
def detectar_paginas_wp(slugs, previo):
    """Comprueba qué páginas /embalses-*/ existen ya en calentamientoglobal.es.
    Si la red falla, conserva lo detectado en la ejecución anterior."""
    urls = {}
    for slug in slugs:
        candidatas = []
        if slug in WP_EXCEPCIONES:
            candidatas.append(WP_EXCEPCIONES[slug])
        candidatas.append("/embalses-" + slug.replace("_", "-").replace("ñ", "n") + "/")
        url_previa = (previo.get(slug) or {}).get("url_web")
        encontrada = None
        for c in candidatas:
            try:
                resp = requests.head(WEB_BASE + c, headers=CABECERA,
                                     timeout=10, allow_redirects=True)
                if resp.status_code == 200:
                    encontrada = WEB_BASE + c
                    break
            except requests.RequestException:
                encontrada = url_previa
                break
        urls[slug] = encontrada
    nacional = previo.get("_nacional")
    for c in CANDIDATAS_NACIONAL:
        try:
            resp = requests.head(WEB_BASE + c, headers=CABECERA, timeout=10,
                                 allow_redirects=True)
            if resp.status_code == 200:
                nacional = WEB_BASE + c
                break
        except requests.RequestException:
            break
    urls["_nacional"] = nacional
    return urls


# ─────────────────────────────────────────────────────────────────────────────
# Principal
# ─────────────────────────────────────────────────────────────────────────────
def main():
    with open(MAESTRO_PATH, encoding="utf-8") as f:
        maestro = json.load(f)

    origen = "Boletín Hidrológico Semanal — MITECO (BD-Embalses)"
    series = None
    try:
        series, nombres = leer_mdb()
        datos, fecha_max, fechas_serie = metricas_desde_series(series)
        series_prov = series_provinciales(series, maestro, fechas_serie)
    except Exception as e:
        print(f"Fuente primaria falló: {e}")
        try:
            datos, nombres, fecha_max = leer_arcgis()
            series_prov = {}
            origen = "Boletín Hidrológico Semanal — MITECO (servicio ArcGIS)"
        except Exception as e2:
            print(f"❌ También falló el respaldo ArcGIS: {e2}")
            print("No se escribe nada: se conservan los últimos datos publicados.")
            sys.exit(1)

    con_dato = [k for k, d in datos.items() if d["vol"] is not None]
    cap_total = sum(datos[k]["cap"] for k in con_dato)
    if not 40000 < cap_total < 80000:
        print(f"❌ Capacidad total sospechosa ({cap_total:.0f} hm³; esperado ~56.000). "
              "¿Cambio de unidades o de formato en la fuente? No se publica.")
        sys.exit(1)
    if len(con_dato) < MIN_EMBALSES_OK:
        print(f"❌ Solo {len(con_dato)} embalses con dato (<{MIN_EMBALSES_OK}). No se publica.")
        sys.exit(1)

    d_max = datetime.strptime(fecha_max, "%Y-%m-%d")
    fecha_legible = d_max.strftime("%d/%m/%Y")
    ahora = datetime.now(timezone.utc).isoformat(timespec="seconds")

    # ── agregación por provincia ────────────────────────────────────────────
    provincias = {}
    sin_maestro, sin_datos = [], []
    for k, d in datos.items():
        info = maestro.get(k)
        if not info:
            sin_maestro.append(nombres.get(k, k))
            continue
        slug = info["provincia_slug"]
        p = provincias.setdefault(slug, {
            "slug": slug, "provincia": info["provincia"], "comunidad": info["comunidad"],
            "embalses": [], "cap": 0.0, "vol": 0.0, "cap1": 0.0, "vol1": 0.0,
            "cap10": 0.0, "vol10": 0.0})
        pct = (d["vol"] / d["cap"] * 100.0) if d["vol"] is not None else None
        cap1 = d["c1"] if d["c1"] else d["cap"]
        pct1 = (d["v1"] / cap1 * 100.0) if d["v1"] is not None else None
        col, et = color_etiqueta(pct)
        if d["vol"] is None:
            sin_datos.append(info["nombre"])
        p["embalses"].append({
            "nombre": info["nombre"], "cuenca": info["cuenca"],
            "electrico": info["electrico"], "lat": info["lat"], "lon": info["lon"],
            "capacidad_hm3": r1(d["cap"]),
            "volumen_hm3": r1(d["vol"]),
            "pct": r1(pct), "color": col, "etiqueta": et,
            "vol_hace_1a": r1(d["v1"]), "pct_hace_1a": r1(pct1),
            "vol_media_10a": r1(d["v10"]), "pct_media_10a": r1(d["pct10"]),
        })
        if d["vol"] is not None:
            p["cap"] += d["cap"]; p["vol"] += d["vol"]
            if d["v1"] is not None:
                p["cap1"] += cap1; p["vol1"] += d["v1"]
            if d["v10"] is not None and d["pct10"] is not None:
                p["cap10"] += d["cap"]; p["vol10"] += d["v10"]

    # embalses del maestro que ya no vienen en el boletín
    for k, info in maestro.items():
        if k not in datos:
            sin_datos.append(info["nombre"] + " (no aparece en el boletín)")

    # ── URLs de WordPress ───────────────────────────────────────────────────
    previo = {}
    try:
        with open(os.path.join(SALIDA_DIR, "embalses.json"), encoding="utf-8") as f:
            ant = json.load(f)
            previo = {p["slug"]: p for p in ant.get("provincias", [])}
            previo["_nacional"] = ant.get("url_web_nacional")
    except Exception:
        pass
    urls_wp = detectar_paginas_wp(sorted(provincias), previo)

    # ── escritura ───────────────────────────────────────────────────────────
    dir_prov = os.path.join(SALIDA_DIR, "embalses")
    os.makedirs(dir_prov, exist_ok=True)

    resumen, cap_n = [], {"cap": 0.0, "vol": 0.0, "cap1": 0.0, "vol1": 0.0,
                          "cap10": 0.0, "vol10": 0.0}
    for slug in sorted(provincias):
        p = provincias[slug]
        for kk in cap_n:
            cap_n[kk] += p[kk]
        pct = (p["vol"] / p["cap"] * 100.0) if p["cap"] else None
        pct1 = (p["vol1"] / p["cap1"] * 100.0) if p["cap1"] else None
        pct10 = (p["vol10"] / p["cap10"] * 100.0) if p["cap10"] else None
        col, et = color_etiqueta(pct)
        p["embalses"].sort(key=lambda e: -(e["capacidad_hm3"] or 0))
        serie = series_prov.get(slug, [])
        detalle = {
            # ── formato nuevo ──
            "actualizado": ahora,
            "boletin_fecha": fecha_max,
            "fuente": origen,
            "slug": slug,
            "url_web": urls_wp.get(slug),
            "pct_hace_1a": r1(pct1),
            "pct_media_10a": r1(pct10),
            "vol_hace_1a_hm3": r1(p["vol1"] if p["cap1"] else None),
            "vol_media_10a_hm3": r1(p["vol10"] if p["cap10"] else None),
            "serie": serie,
            "embalses": p["embalses"],
            # ── compatibilidad con los widgets/páginas antiguos ──
            "ultima_actualizacion": ahora,
            "fecha_legible": fecha_legible,
            "provincia": p["provincia"],
            "comunidad": p["comunidad"],
            "total_embalses": len(p["embalses"]),
            "capacidad_total_hm3": r1(p["cap"]),
            "volumen_total_hm3": r1(p["vol"]),
            "pct_media": r1(pct),
            "color": col,
            "etiqueta": et,
        }
        with open(os.path.join(dir_prov, f"{slug}.json"), "w", encoding="utf-8") as f:
            json.dump(detalle, f, ensure_ascii=False, indent=1)
        resumen.append({
            "slug": slug, "id": slug, "nombre": p["provincia"],
            "provincia": p["provincia"], "comunidad": p["comunidad"],
            "pct": r1(pct), "pct_hace_1a": r1(pct1), "pct_media_10a": r1(pct10),
            "color": col, "etiqueta": et,
            "capacidad_total_hm3": r1(p["cap"]), "volumen_total_hm3": r1(p["vol"]),
            "total_embalses": len(p["embalses"]),
            "url_web": urls_wp.get(slug),
            "url_detalle": f"embalses/provincia.html?p={slug}",
            "datos_disponibles": True,
        })

    pct_n = cap_n["vol"] / cap_n["cap"] * 100.0
    pct1_n = cap_n["vol1"] / cap_n["cap1"] * 100.0 if cap_n["cap1"] else None
    pct10_n = cap_n["vol10"] / cap_n["cap10"] * 100.0 if cap_n["cap10"] else None
    col_n, et_n = color_etiqueta(pct_n)
    nacional = {
        "actualizado": ahora,
        "ultima_actualizacion": ahora,
        "fecha_legible": fecha_legible,
        "boletin_fecha": fecha_max,
        "fuente": origen,
        "url_web_nacional": urls_wp.get("_nacional"),
        "nacional": {
            "pct": r1(pct_n), "pct_hace_1a": r1(pct1_n), "pct_media_10a": r1(pct10_n),
            "capacidad_total_hm3": r1(cap_n["cap"]), "volumen_total_hm3": r1(cap_n["vol"]),
            "total_embalses": len(con_dato), "color": col_n, "etiqueta": et_n,
        },
        "provincias": resumen,
    }
    with open(os.path.join(SALIDA_DIR, "embalses.json"), "w", encoding="utf-8") as f:
        json.dump(nacional, f, ensure_ascii=False, indent=1)
    # compat: mismo contenido bajo el nombre antiguo
    with open(os.path.join(SALIDA_DIR, "embalses_nacional.json"), "w", encoding="utf-8") as f:
        json.dump(nacional, f, ensure_ascii=False, indent=1)

    # copia del widget de provincia con el nombre {slug}.html
    # (las páginas de WordPress antiguas apuntan a embalses/{slug}.html)
    plantilla = os.path.join(dir_prov, "provincia.html")
    if os.path.exists(plantilla):
        html = open(plantilla, encoding="utf-8").read()
        for slug in provincias:
            destino = os.path.join(dir_prov, f"{slug}.html")
            if not os.path.exists(destino) or open(destino, encoding="utf-8").read() != html:
                shutil.copyfile(plantilla, destino)

    # diagnóstico e IndexNow
    with open(os.path.join(dir_prov, "diagnostico.json"), "w", encoding="utf-8") as f:
        json.dump({"ejecucion": ahora, "origen": origen, "boletin_fecha": fecha_max,
                   "embalses_con_dato": len(con_dato),
                   "sin_maestro": sorted(sin_maestro),
                   "sin_datos": sorted(sin_datos)}, f, ensure_ascii=False, indent=1)
    with open(os.path.join(dir_prov, "_ping_urls.txt"), "w", encoding="utf-8") as f:
        if urls_wp.get("_nacional"):
            f.write(urls_wp["_nacional"] + "\n")
        for slug in sorted(provincias):
            if urls_wp.get(slug):
                f.write(urls_wp[slug] + "\n")

    print(f"✓ {len(con_dato)} embalses · {len(provincias)} provincias · boletín {fecha_legible}")
    print(f"✓ España: {pct_n:.1f}% (hace 1 año {pct1_n and round(pct1_n,1)}%, "
          f"media 10 años {pct10_n and round(pct10_n,1)}%)")
    if sin_maestro:
        print(f"⚠️ Sin provincia asignada (añadir al maestro): {sorted(sin_maestro)}")


if __name__ == "__main__":
    main()
