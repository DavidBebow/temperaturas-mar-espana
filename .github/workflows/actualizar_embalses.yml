name: Actualizar embalses

on:
  schedule:
    - cron: '0 10 * * 3'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  actualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests openpyxl

      - name: Ejecutar script de embalses
        run: python scripts/obtener_embalses.py

      - name: Guardar cambios en GitHub
        run: |
          git config --local user.email "accion@github.com"
          git config --local user.name "GitHub Actions Bot"
          git add docs/embalses_nacional.json docs/embalses/
          git diff --staged --quiet || (
            git commit -m "Embalses actualizados: $(date +'%d/%m/%Y %H:%M')" &&
            git pull --rebase &&
            git push
          )
