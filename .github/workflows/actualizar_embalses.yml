name: Actualizar Embalses

on:
  # Cada martes a las 12:00 UTC — después de actualizar DATOS_EMBALSES en el script
  schedule:
    - cron: '0 12 * * 2'
  # También se puede lanzar manualmente tras cada actualización de datos
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  actualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # No hay dependencias externas — solo librería estándar de Python

      - name: Generar JSONs de embalses
        run: python scripts/obtener_embalses.py

      - name: Publicar cambios
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions Bot"
          git add docs/embalses_nacional.json docs/embalses/
          git diff --staged --quiet && echo "Sin cambios." || (
            git commit -m "Embalses actualizados: $(date +'%d/%m/%Y') — MITECO" &&
            git pull --rebase &&
            git push
          )
