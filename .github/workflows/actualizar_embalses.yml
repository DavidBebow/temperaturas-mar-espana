name: Actualizar embalses
# Va en el repo PUBLICO (temperaturas-mar-espana): .github/workflows/
# Ejecuta desde el publico, trae el script del repo privado (clima-scripts)
# y commitea los JSON en el propio repo publico (GitHub Pages).
#
# Fuente: Boletin Hidrologico Semanal del MITECO (BD-Embalses.zip, Access).
# Se lee con mdbtools. Si el ZIP falla, el script usa el servicio ArcGIS
# oficial del MITECO como respaldo. Si todo falla, no toca los JSON
# publicados (se queda la ultima semana buena).
#
# El boletin se publica los martes a mediodia. Se ejecuta el martes por la
# tarde y de nuevo el miercoles por la manana por si el boletin se retrasa
# (solo commitea si hay cambios).
on:
  schedule:
    - cron: '30 15 * * 2'   # martes 17:30 hora peninsular (verano)
    - cron: '30 5 * * 3'    # miercoles 07:30 hora peninsular (verano)
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/actualizar_embalses.yml'
concurrency:
  group: actualizar-embalses
  cancel-in-progress: false
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  actualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Descargar repo publico (este)
        uses: actions/checkout@v4

      - name: Descargar scripts privados (clima-scripts)
        uses: actions/checkout@v4
        with:
          repository: DavidBebow/clima-scripts
          token: ${{ secrets.SCRIPTS_TOKEN }}
          path: clima-scripts

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias (mdbtools para leer el .mdb del MITECO)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mdbtools
          pip install requests

      - name: Generar JSON de embalses
        env:
          SALIDA_DIR: ${{ github.workspace }}/docs
        run: python clima-scripts/embalses_generar.py

      - name: Guardar cambios
        id: guardar
        run: |
          git config --local user.email "accion@github.com"
          git config --local user.name "GitHub Actions Bot"
          git pull --rebase --autostash
          git add docs/embalses.json docs/embalses_nacional.json docs/embalses/
          if git diff --staged --quiet; then
            echo "Sin cambios"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Embalses actualizados: $(date +'%d/%m/%Y %H:%M')"
            for intento in 1 2 3 4 5; do
              git push && break
              echo "Push fallo. Reintento $intento/5 en 15s..."
              sleep 15
              git pull --rebase --autostash
            done
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Solo si el JSON publico cambio. continue-on-error para que un fallo
      # aqui nunca tumbe el job (el dato ya esta publicado).
      - name: Notificar a IndexNow (Bing/IA)
        if: steps.guardar.outputs.changed == 'true'
        continue-on-error: true
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          INDEXNOW_HOST: calentamientoglobal.es
        run: |
          if [ -s docs/embalses/_ping_urls.txt ]; then
            python indexnow_ping.py --file docs/embalses/_ping_urls.txt
          fi
