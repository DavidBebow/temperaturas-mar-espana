name: Lluvia diaria de todas las estaciones

# Baja de AEMET la lluvia diaria validada de TODAS las estaciones, de 1991 a ayer, y la deja en
# archivo/lluvia_diaria/<anio>.json.gz (scripts/lluvia_diaria_crudo.py). La primera vez son unos 700
# trozos de 15 dias (los otonos ya bajados se siembran sin pedirlos): dos o tres pasadas de 50 minutos,
# del ano mas reciente al mas antiguo, guardando al final de cada una. Despues, cada pasada solo vuelve
# a pedir los trozos de los ultimos 40 dias (como mucho cada 6 horas), que AEMET va validando.
# Lo lee scripts/lluvia_fichas_extra.py (flujo "Lluvia: bloques extra de las fichas").

on:
  schedule:
    - cron: '41 * * * *'
  workflow_dispatch:

concurrency:
  group: lluvia-diaria-crudo
  cancel-in-progress: false

jobs:
  bajar:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    permissions:
      contents: write
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bajar la lluvia diaria
        env:
          AEMET_API_KEY: ${{ secrets.AEMET_API_KEY }}
          LLUVIA_TOPE_MIN: '50'
          LLUVIA_PAUSA: '3.0'
        run: python scripts/lluvia_diaria_crudo.py

      # Siempre, aunque el paso anterior falle o se corte: lo bajado se guarda.
      - name: Guardar cambios
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add archivo/lluvia_diaria
          if git diff --staged --quiet; then
            echo "Sin cambios."
            exit 0
          fi
          git commit -m "Lluvia diaria de AEMET: $(date -u +'%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3 4 5 6 7 8; do
            git pull --rebase --autostash origin main && git push && exit 0
            echo "Push fallido. Reintento $i/8..."
            sleep $((i*10))
          done
          exit 1
