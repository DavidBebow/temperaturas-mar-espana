name: Actualizar días de más de 32 grados

on:
  schedule:
    - cron: "30 4 1 * *"   # día 1 de cada mes, 04:30 UTC (el histórico cambia despacio)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dias32:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Núcleo desde el repo privado (mismo patrón que avisos / boyas / deshielo).
      # Si aún no has migrado los scripts, borra estos dos pasos: usará scripts/ de este repo.
      - name: Descargar scripts privados
        uses: actions/checkout@v4
        with:
          repository: DavidBebow/clima-scripts
          token: ${{ secrets.SCRIPTS_TOKEN }}
          path: scripts

      - name: Aislar scripts del control de versiones
        run: rm -rf scripts/.git

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generar dias32.json
        run: python scripts/dias32_generar.py

      - name: Publicar cambios
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/dias32.json
          git diff --cached --quiet || git commit -m "Días >32 °C por provincia $(date -u +'%F %H:%M')"
          git push
