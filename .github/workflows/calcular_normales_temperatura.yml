name: Calcular normales de temperatura (una vez)
# Va en el repo PUBLICO (temperaturas-mar-espana): .github/workflows/
#
# SOLO A MANO (Actions -> este flujo -> Run workflow). Descarga los diarios de
# AEMET de 1991-2020 de todas las estaciones, en trozos de 15 dias (~730 trozos,
# 1-2 horas), y escribe normales_temperatura.json en la raiz: la maxima y la
# minima normales de cada dia del año para cada municipio con ficha, con su
# estacion. Lo lee prediccion_municipios.py. No hace falta repetirlo salvo que
# cambie la lista de municipios.
#
# 17-11-2026: por defecto solo calcula las normales CORTAS (2006-2025) de los
# municipios sin normal 1991-2020 y es REANUDABLE: a los tope_min minutos guarda
# lo bajado en normales_temperatura_estado.json.gz y para; al volver a lanzarlo
# sigue donde se quedo. Hasta que termina no toca normales_temperatura.json.

on:
  workflow_dispatch:
    inputs:
      tope_min:
        description: 'Minutos de descarga antes de guardar y parar. Si no termina, se vuelve a lanzar y sigue donde se quedo.'
        required: false
        default: '290'

concurrency:
  group: normales-temperatura
  cancel-in-progress: false

jobs:
  calcular:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      contents: write
    steps:
      - name: Descargar repo publico (este)
        uses: actions/checkout@v4

      - name: Descargar scripts privados (clima-scripts)
        uses: actions/checkout@v4
        with:
          repository: DavidBebow/clima-scripts
          token: ${{ secrets.SCRIPTS_TOKEN }}
          path: privado

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Calcular normales
        env:
          # Clave propia (la de la prediccion ya no se usa: va por XML). Asi no compite con
          # los flujos horarios que comparten AEMET_API_KEY.
          AEMET_API_KEY: ${{ secrets.AEMET_API_KEY_PREDICCION || secrets.AEMET_API_KEY }}
          CG_TOPE_MIN: ${{ inputs.tope_min || '290' }}
          # 27-11-2026 (script 2.3): baja 1991-2025 para los municipios NUEVOS y conserva tal cual las normales
          # 1991-2020 ya publicadas. Donde la estacion no tenga 1991-2020, normal corta (2006-2025). ~850 trozos, ~70-75 min.
          CG_SOLO_CORTAS: '0'
          CG_CONSERVAR: '1'
          CG_BASE: privado/municipios_base.json
          CG_MAPA: docs/municipios_mapa.json
          CG_SALIDA: normales_temperatura.json
        run: python privado/normales_temperatura.py

      - name: Publicar
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash
          git add normales_temperatura.json
          # Estado de la descarga (para reanudar si no ha cabido en una ejecucion).
          if [ -f normales_temperatura_estado.json.gz ]; then git add -f normales_temperatura_estado.json.gz; fi
          if git diff --staged --quiet; then
            echo "Sin cambios."
          else
            git commit -m "Normales de temperatura por municipio (estaciones AEMET)"
            for i in 1 2 3 4 5; do
              git push && break
              git pull --rebase --autostash -X theirs origin main || { git rebase --abort; true; }
              sleep $((i*5))
            done
          fi
