name: Temporales en directo

on:
  workflow_run:
    workflows: ["Actualizar avisos meteorológicos"]
    types: [completed]
  schedule:
    - cron: "7,37 * * * *"   # respaldo por si el anterior no dispara
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: temporal-directo
  cancel-in-progress: false

jobs:
  directo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Traer los scripts privados
        uses: actions/checkout@v4
        with:
          repository: DavidBebow/clima-scripts
          token: ${{ secrets.SCRIPTS_TOKEN }}
          path: clima-scripts

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet requests feedparser

      - name: Actualizar directos
        env:
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          git pull --rebase --autostash || true   # trae el avisos.json recién publicado
          # Abre y cierra directos según los avisos naranja/rojo (nunca frena el paso)
          python clima-scripts/temporal_detector.py \
            --config estado/temporales.json \
            --docs docs || echo "El detector falló; se siguen los directos"
          python clima-scripts/temporal_directo.py \
            --config estado/temporales.json \
            --estado estado/temporal_directo \
            --docs docs

      - name: Guardar estado
        if: always()
        run: |
          git config user.name  "clima-directo-bot"
          git config user.email "bot@users.noreply.github.com"
          git add estado
          if git diff --staged --quiet; then
            echo "Sin cambios de estado."
            exit 0
          fi
          git commit -m "Temporales en directo: estado [skip ci]"
          # 9-10-2026. Fallaba 1 de cada 3 pasadas con «cannot lock ref
          # refs/heads/main». No era de los temporales: entre el pull y el push
          # caben los 3 segundos que tarda otro de los ~50 flujos del repo en
          # adelantarse, y GitHub rechaza el empujon. El pull tiene que ir DENTRO
          # del bucle; fuera, solo sirve para el primer intento.
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash && git push && exit 0
            sleep $((i*5))
          done
          # Y si se agotan, el paso FALLA. Un bucle que se traga el fallo deja
          # pasadas en verde que no han publicado nada, que cuesta mas caro que
          # un correo de aviso.
          echo "No se pudo empujar el estado tras 5 intentos."
          exit 1
