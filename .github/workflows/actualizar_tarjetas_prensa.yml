name: Actualizar tarjetas de prensa
# Va en el repo PUBLICO (temperaturas-mar-espana): .github/workflows/
# Mismo patron que actualizar_embalses.yml: se ejecuta desde el publico, trae el
# script del repo privado (clima-scripts) y commitea el resultado en docs/.
#
# Que produce:
#   docs/prensa/img/embalses-{slug}-{fecha}.png   tarjeta fechada (historico)
#   docs/prensa/img/embalses-{slug}.png           alias estable (la ultima)
#   docs/prensa/img/calor-{slug}-{fecha}.png
#   docs/prensa/img/calor-{slug}.png
#   docs/prensa/titulares.json                    indice que consulta el plugin de WP
#
# IMPORTANTE: parte_prensa.py NO va aqui. Ese lleva correos de periodistas
# (contactos.json) y se ejecuta en tu maquina. Aqui solo lo publico.
on:
  schedule:
    - cron: '0 5 * * *'     # todos los dias, 07:00 hora peninsular (verano)
  # Ademas, en cuanto termina el de embalses (martes/miercoles): asi la tarjeta
  # de agua sale con el boletin del MITECO del dia, no con el de la semana pasada.
  workflow_run:
    workflows: ["Actualizar embalses"]
    types: [completed]
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/actualizar_tarjetas_prensa.yml'
concurrency:
  group: actualizar-tarjetas-prensa
  cancel-in-progress: false
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  tarjetas:
    runs-on: ubuntu-latest
    # Si lo dispara workflow_run, solo cuando el de embalses acabo bien.
    if: >
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Descargar repo publico (este)
        uses: actions/checkout@v4

      - name: Descargar scripts privados (clima-scripts)
        uses: actions/checkout@v4
        with:
          repository: DavidBebow/clima-scripts
          token: ${{ secrets.SCRIPTS_TOKEN }}
          path: clima-scripts

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Pillow
        timeout-minutes: 5
        run: pip install --quiet Pillow

      # --local docs es lo que importa: los JSON del repo ya estan actualizados,
      # pero GitHub Pages todavia sirve los de la ejecucion anterior. Sin esto,
      # las tarjetas de hoy saldrian con los datos de ayer.
      - name: Generar las tarjetas
        timeout-minutes: 12
        run: |
          set -euo pipefail
          python clima-scripts/generar_tarjetas_prensa.py \
            --local docs \
            --salida docs/prensa

      # Las tarjetas fechadas se acumulan (2 por provincia y dia = ~38.000 al
      # ano). Se conservan 60 dias, que es mas que de sobra para que un medio
      # recupere la imagen de una pieza reciente. Los alias sin fecha nunca se
      # borran: son los que enlaza el plugin.
      - name: Limpiar tarjetas de mas de 60 dias
        run: |
          find docs/prensa/img -name '*-20*.png' -type f -mtime +60 -delete || true

      - name: Guardar cambios
        id: guardar
        run: |
          git config --local user.email "accion@github.com"
          git config --local user.name "GitHub Actions Bot"
          git pull --rebase --autostash
          git add -A docs/prensa/
          if git diff --staged --quiet; then
            echo "Sin cambios"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Tarjetas de prensa: $(date +'%d/%m/%Y %H:%M')"
            for intento in 1 2 3 4 5; do
              git push && break
              echo "Push fallo. Reintento $intento/5 en 15s..."
              sleep 15
              git pull --rebase --autostash
            done
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Avisa a Bing y a los buscadores con IA de que las salas de prensa de
      # WordPress tienen datos nuevos. Nunca tumba el job: el dato ya esta
      # publicado aunque el ping falle.
      # Avisa a Bing y a los buscadores con IA de que las salas de prensa de
      # WordPress tienen datos nuevos.
      #
      # Solo se envian las URLs que responden 200. Mientras no hayas creado las
      # paginas en WordPress, todas dan 404 y no se manda ninguna: anunciar a
      # Bing paginas que no existen no sirve de nada y ensucia el dominio.
      #
      # El paso nunca tumba el job ni deja un rojo enganoso: si el ping falla,
      # avisa y sigue. El dato ya esta publicado aunque Bing no se entere hoy.
      - name: Notificar a IndexNow (Bing/IA)
        if: steps.guardar.outputs.changed == 'true'
        continue-on-error: true
        timeout-minutes: 6
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          INDEXNOW_HOST: calentamientoglobal.es
        run: |
          python - <<'PY'
          import json, pathlib, urllib.request, urllib.error
          d = json.loads(pathlib.Path("docs/prensa/titulares.json").read_text("utf-8"))
          urls = ["https://calentamientoglobal.es/prensa/"]
          urls += [f"https://calentamientoglobal.es/prensa/{s}/" for s in d.get("provincias", {})]

          def viva(u):
              req = urllib.request.Request(u, method="HEAD",
                                           headers={"User-Agent": "calentamientoglobal.es/ci"})
              try:
                  with urllib.request.urlopen(req, timeout=15) as r:
                      return r.status == 200
              except Exception:
                  return False

          # Si el indice no existe, las 52 tampoco: no hace falta comprobarlas una a una.
          vivas = [u for u in urls if viva(u)] if viva(urls[0]) else []
          pathlib.Path("docs/prensa/_ping_urls.txt").write_text("\n".join(vivas), "utf-8")
          if not vivas:
              print("::warning::Las salas de prensa aun no existen en WordPress "
                    "(/prensa/ da 404). No se envia nada a IndexNow. "
                    "Crea las paginas con ?cgsp_crear_paginas=1 y relanza.")
          else:
              print(f"{len(vivas)} de {len(urls)} URLs vivas para IndexNow")
          PY
          if [ -s docs/prensa/_ping_urls.txt ]; then
            python indexnow_ping.py --file docs/prensa/_ping_urls.txt \
              || echo "::warning::IndexNow rechazo el envio. Comprueba que \
          https://calentamientoglobal.es/\$INDEXNOW_KEY.txt devuelve la clave en \
          texto plano. No afecta a las tarjetas, que ya estan publicadas."
          fi
