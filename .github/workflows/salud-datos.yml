name: Salud de los datos

# Vigilante del observatorio: comprueba cada herramienta (frescura, contenido,
# último run de su workflow), escribe docs/salud/estado.json y avisa por Telegram
# cuando algo se rompe o se recupera. No toca ningún otro archivo.

on:
  workflow_dispatch:
  schedule:
    - cron: "55 * * * *"   # cada hora, a y 55, después de la mayoría de pasadas

permissions:
  contents: write
  actions: read

concurrency:
  group: salud-datos
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  vigilar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Comprobar la salud de los datos
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/salud_datos.py

      - name: Guardar el estado
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/salud/estado.json docs/salud/historial.json docs/salud/incidencias.json
          if git diff --cached --quiet; then
            echo "Sin cambios."
            exit 0
          fi
          git commit -m "salud: estado de los datos $(date -u +'%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3 4 5 6; do
            git pull --rebase --autostash && git push && exit 0
            echo "Push rechazado (intento $i), reintento en $((i*5)) s"
            sleep $((i*5))
          done
          echo "No se pudo publicar el estado tras 6 intentos"
          exit 1
