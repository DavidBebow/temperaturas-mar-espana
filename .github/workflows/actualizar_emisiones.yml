name: Actualizar emisiones CO2

on:
  schedule:
    # Una vez al día a las 8:00 Madrid (datos CO2 no cambian cada hora)
    - cron: '0 7 * * *'
    - cron: '0 8 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  actualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests

      - name: Ejecutar script
        run: python scripts/obtener_emisiones_co2.py

      - name: Guardar cambios
        run: |
          git config --local user.email "accion@github.com"
          git config --local user.name "GitHub Actions Bot"
          git add docs/emisiones_co2.json
          git diff --staged --quiet || (git commit -m "Emisiones CO2 actualizadas: $(date +'%d/%m/%Y %H:%M')" && git pull --rebase && git push)
