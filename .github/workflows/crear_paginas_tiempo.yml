name: Crear paginas El tiempo
# Va en el repo PUBLICO (temperaturas-mar-espana): .github/workflows/
#
# Crea o pone al dia en WordPress las paginas /el-tiempo/<provincia>/<municipio>/
# de los municipios con ficha de lluvia, por orden de poblacion (Padron del INE),
# mas sus provincias y el hub /el-tiempo/. Solo a mano: cada tanda se decide.
# El script vive en clima-scripts (privado): crear_paginas_tiempo.py.

on:
  workflow_dispatch:
    inputs:
      top:
        description: 'Cuantos municipios, los mas poblados (las paginas ya creadas se conservan)'
        required: true
        default: '250'
      seco:
        description: 'Ensayo sin escribir nada (1 = si, 0 = publicar)'
        required: true
        default: '1'

concurrency:
  group: paginas-tiempo
  cancel-in-progress: false

jobs:
  crear:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Descargar repo publico (este)
        uses: actions/checkout@v4

      - name: Descargar scripts privados (clima-scripts)
        uses: actions/checkout@v4
        with:
          repository: DavidBebow/clima-scripts
          token: ${{ secrets.SCRIPTS_TOKEN }}
          path: privado

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Crear paginas
        env:
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_AGOSTO }}
          CG_MAPA: docs/municipios_mapa.json
          CG_TOP: ${{ github.event.inputs.top }}
          CG_SECO: ${{ github.event.inputs.seco }}
        run: python privado/crear_paginas_tiempo.py
