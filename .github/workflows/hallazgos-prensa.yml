name: Hallazgos de prensa

# Detector de noticias: recorre las series profundas del observatorio (capitales
# desde 1940, Mediterráneo desde 1981, días >32 °C desde 1961, embalses, caudal…)
# y escribe docs/prensa/hallazgos.json + los dossiers (md, png, csv) de los más
# fuertes; después, partes_prensa.py escribe el parte diario de cada provincia
# (docs/prensa/partes/). Corre después de que se hayan actualizado las series que lee.

on:
  workflow_dispatch:
  schedule:
    - cron: "15 9 * * *"    # tras archivo de capitales (07:41) y Mediterráneo (08:41)
    - cron: "15 21 * * *"   # tras la pasada de la tarde

permissions:
  contents: write

concurrency:
  group: hallazgos-prensa
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  detectar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install matplotlib

      - name: Detectar hallazgos y generar dossiers
        run: |
          rm -rf docs/prensa/dossier
          python scripts/hallazgos_prensa.py --dossiers 12

      - name: Partes de prensa provinciales (5 ángulos × 52 provincias)
        run: python scripts/partes_prensa.py

      - name: Guardar
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A docs/prensa/hallazgos.json docs/prensa/hallazgos_historial.json docs/prensa/envivo.json docs/prensa/dossier docs/prensa/partes
          if git diff --cached --quiet; then
            echo "Sin cambios."
            exit 0
          fi
          git commit -m "prensa: hallazgos $(date -u +'%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3 4 5 6; do
            git pull --rebase --autostash && git push && exit 0
            echo "Push rechazado (intento $i), reintento en $((i*5)) s"
            sleep $((i*5))
          done
          echo "No se pudo publicar tras 6 intentos"
          exit 1
