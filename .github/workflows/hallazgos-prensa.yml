name: Hallazgos de prensa

# Detector de noticias: recorre las series profundas del observatorio (capitales
# desde 1940, Mediterráneo desde 1981, días >32 °C desde 1961, embalses, caudal…)
# y escribe docs/prensa/hallazgos.json + los dossiers (md, png, csv) de los más
# fuertes; después, partes_prensa.py escribe el parte diario de cada provincia
# (docs/prensa/partes/). Corre cada hora para que la sala de prensa abra con lo de hoy.
#
# 18-10-2026: antes del detector corre records_detectar.py (clima-scripts, privado):
# lee la observación horaria de toda la red de AEMET y detecta el mismo día los
# récords de temperatura de cada estación contra su tabla oficial de valores
# extremos (docs/records/baseline.json, que mantiene records-baseline.yml). Deja
# docs/records/hallazgos_estaciones.json, que hallazgos_prensa.py mete en la cola
# con citabilidad alta, y docs/records/hoy.json para el mapa de /records-de-temperatura/.

on:
  workflow_dispatch:
  # El cron de GitHub no sale en este repo (18-10-2026: ni una pasada a :47 en dos horas; lo mismo vio el de
  # lluvia el 2-10). Lo puntual es la cadena avisos (disparo externo a :00 y :30) → lluvia por municipio
  # (:01 y :31): este flujo sale al terminar ese, con la lluvia recién contada. El cron queda de red.
  workflow_run:
    workflows: ["Actualizar lluvia diaria por municipio"]
    types: [completed]
  schedule:
    # Cada hora (18-10-2026): la lluvia de AEMET por estación y los avisos se rehacen a :01 y :31; a :47 el
    # parte ya lleva la hora cerrada más reciente. Las series lentas (capitales, Mediterráneo, embalses) entran
    # en la primera pasada después de actualizarse.
    - cron: "47 * * * *"

permissions:
  contents: write

concurrency:
  group: hallazgos-prensa
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  detectar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Descargar scripts privados (clima-scripts)
        # Si el token falla, la sala de prensa sigue sin el paso de récords (no debe depender del privado).
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: DavidBebow/clima-scripts
          token: ${{ secrets.SCRIPTS_TOKEN }}
          path: privado

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install matplotlib requests

      # Récords de temperatura en las estaciones de AEMET, el mismo día. Si AEMET no
      # responde o falta la base, el paso no tumba la sala de prensa: el resto sigue
      # con los hallazgos de la pasada anterior (docs/records/ ya está en el repo).
      - name: Récords en las estaciones de AEMET (observación de hoy + verificación)
        continue-on-error: true
        env:
          AEMET_API_KEY: ${{ secrets.AEMET_API_KEY }}
          CG_DOCS: docs
        run: |
          if [ -f privado/records_detectar.py ]; then
            python privado/records_detectar.py
          else
            echo "Sin scripts privados (checkout fallido): se omite el paso de récords"
          fi

      - name: Detectar hallazgos y generar dossiers
        run: |
          rm -rf docs/prensa/dossier
          python scripts/hallazgos_prensa.py --dossiers 12

      - name: Partes de prensa provinciales (5 ángulos × 52 provincias)
        run: python scripts/partes_prensa.py

      # Redacción (18-10-2026): convierte los datos en historias con versión nacional y provincial. Coste cero: solo IA
      # con capa gratuita y sin tarjeta (Gemini de Google AI Studio y/o Groq); un verificador rechaza cualquier cifra,
      # hora o nombre que no esté en los hechos comprobados y, si no pasa o no hay clave, sale el texto de plantilla.
      - name: Redacción de la sala de prensa (historias del día)
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python scripts/redaccion_prensa.py

      - name: Guardar
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A docs/prensa/hallazgos.json docs/prensa/hallazgos_historial.json docs/prensa/envivo.json docs/prensa/dossier docs/prensa/partes docs/prensa/noticias docs/records
          if git diff --cached --quiet; then
            echo "Sin cambios."
            exit 0
          fi
          git commit -m "prensa: hallazgos $(date -u +'%Y-%m-%d %H:%M UTC')"
          # 19-10-2026: con la incidencia de GitHub dos pasadas se solaparon y el rebase chocó en 370 ficheros generados
          # (run #119). Lo de esta pasada es más reciente: en caso de conflicto gana lo nuestro (-X theirs dentro de un
          # rebase = el commit que se reaplica). Si aun así se para, se aborta antes de reintentar.
          for i in 1 2 3 4 5 6; do
            if git pull --rebase -X theirs --autostash; then
              git push && exit 0
            else
              git rebase --abort 2>/dev/null || true
            fi
            echo "Push rechazado (intento $i), reintento en $((i*5)) s"
            sleep $((i*5))
          done
          echo "No se pudo publicar tras 6 intentos"
          exit 1
