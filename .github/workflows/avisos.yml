name: Actualizar avisos meteorológicos

on:
  schedule:
    - cron: "20,50 * * * *"   # cada 30 minutos (minutos 20 y 50)
  workflow_dispatch:

permissions:
  contents: write

# Sin esto, dos pasadas de avisos pueden solaparse entre ellas y pelearse por
# el mismo fichero ademas de con el resto del repo.
concurrency:
  group: avisos
  cancel-in-progress: false

jobs:
  avisos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Scripts desde el repo privado (patrón de GUIA-PRIVATIZAR-SCRIPTS.md).
      # Si aún no has hecho la migración, borra estos dos pasos: usará scripts/ del propio repo.
      - name: Descargar scripts privados
        uses: actions/checkout@v4
        with:
          repository: DavidBebow/clima-scripts
          token: ${{ secrets.SCRIPTS_TOKEN }}
          path: scripts

      - name: Aislar scripts del control de versiones
        run: rm -rf scripts/.git

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Recopilar avisos vigentes
        run: python scripts/avisos_recopilar.py

      - name: Publicar cambios
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/avisos.json docs/avisos_historico.json
          git diff --cached --quiet || git commit -m "Avisos meteorológicos $(date -u +'%F %H:%M')"
          # 3-10-2026: dos pasadas fallaron porque otro flujo empujo a la vez.
          # Si el push se rechaza, se rebasa (gana esta pasada) y se reintenta.
          #
          # 9-10-2026: el reintento no reintentaba. Le faltaba --autostash: el
          # paso «Descargar scripts privados» sobrescribe scripts/, que esta
          # versionado, asi que el arbol tiene cambios sin confirmar y el rebase
          # se niega en seco («cannot pull with rebase: You have unstaged
          # changes»). Moria en el primer intento con exit 128.
          for i in 1 2 3 4 5; do
            git push && exit 0
            git pull --rebase --autostash origin main || git rebase --abort || true
            sleep $((i*5))
          done
          echo "No se pudo empujar tras 5 intentos."
          exit 1
