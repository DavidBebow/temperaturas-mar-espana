name: Actualizar avisos meteorológicos

on:
  schedule:
    - cron: "20 * * * *"   # cada hora, al minuto 20
  workflow_dispatch:

permissions:
  contents: write

jobs:
  avisos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Scripts desde el repo privado (patrón de GUIA-PRIVATIZAR-SCRIPTS.md).
      # Si aún no has hecho la migración, borra estos dos pasos: usará scripts/ del propio repo.
      - name: Descargar scripts privados
        uses: actions/checkout@v4
        with:
          repository: DavidBebow/clima-scripts
          token: ${{ secrets.SCRIPTS_TOKEN }}
          path: scripts

      - name: Aislar scripts del control de versiones
        run: rm -rf scripts/.git

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Recopilar avisos vigentes
        run: python scripts/avisos_recopilar.py

      - name: Publicar cambios
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/avisos.json docs/avisos_historico.json
          git diff --cached --quiet || git commit -m "Avisos meteorológicos $(date -u +'%F %H:%M')"
          git push
