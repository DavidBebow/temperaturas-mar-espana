name: Actualizar nivel del mar

on:
  schedule:
    - cron: '0 8 * * *'    # 5-11-2026: una vez al día (el dato de Copernicus es diario)
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  actualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install copernicusmarine numpy

      - name: Ejecutar script
        env:
          COPERNICUS_USER: ${{ secrets.COPERNICUS_USER }}
          COPERNICUS_PASSWORD: ${{ secrets.COPERNICUS_PASSWORD }}
        run: python scripts/obtener_nivel_mar.py

      - name: Guardar cambios
        run: |
          git config --local user.email "accion@github.com"
          git config --local user.name "GitHub Actions Bot"
          git add docs/nivel_mar.json docs/historial_nivel_mar.json
          git diff --staged --quiet || (git commit -m "Nivel del mar actualizado: $(date +'%d/%m/%Y %H:%M')" && git pull --rebase && git push)
