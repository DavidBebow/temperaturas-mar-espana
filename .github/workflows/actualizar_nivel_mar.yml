name: Actualizar nivel del mar

on:
  schedule:
    - cron: '0 7 * * *'
    - cron: '0 13 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  actualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias
        run: pip install requests
      - name: Ejecutar script
        run: python scripts/obtener_nivel_mar.py
      - name: Guardar cambios
        run: |
          git config --local user.email "accion@github.com"
          git config --local user.name "GitHub Actions Bot"
          git add docs/nivel_mar.json
          git diff --staged --quiet || git commit -m "Nivel del mar actualizado: $(date +'%d/%m/%Y %H:%M')"
          git push
