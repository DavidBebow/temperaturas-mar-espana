name: Actualizar temperaturas del mar

on:
  schedule:
    - cron: '0 12 * * *'
      timezone: "Europe/Madrid"
    - cron: '0 21 * * *'
      timezone: "Europe/Madrid"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: actualizar-temperaturas-mar
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 18-10-2026: el script ya no usa requests (NOAA OISST por ERDDAP con urllib).
      - name: Ejecutar script de temperaturas
        run: python scripts/obtener_temperaturas.py

      - name: Guardar cambios en el repositorio
        run: |
          git config --local user.email "accion@github.com"
          git config --local user.name "GitHub Actions Bot"
          git add docs/datos.json docs/historial_temperaturas.json
          if [ -f docs/mar_climatologia.json ]; then git add docs/mar_climatologia.json; fi
          if git diff --staged --quiet; then
            echo "No hay cambios que guardar"
            exit 0
          fi
          git commit -m "Temperaturas actualizadas: $(date +'%d/%m/%Y %H:%M')"
          for intento in 1 2 3 4 5 6; do
            git pull --rebase --autostash && git push && exit 0
            echo "Push fallido. Reintento $intento/6 en 15 s..."
            sleep 15
          done
          echo "No se pudo guardar tras 6 intentos"
          exit 1
