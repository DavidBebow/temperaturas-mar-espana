name: Actualizar temperaturas del mar

on:
  schedule:
    - cron: '1 22 * * *'
    - cron: '1 23 * * *'
    - cron: '0 7 * * *'
    - cron: '0 8 * * *'
    - cron: '0 12 * * *'
    - cron: '0 13 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  actualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests

      - name: Ejecutar script de temperaturas
        run: python scripts/obtener_temperaturas.py

      - name: Guardar cambios en el repositorio
        run: |
          git config --local user.email "accion@github.com"
          git config --local user.name "GitHub Actions Bot"
          git add docs/datos.json docs/historial_temperaturas.json
          git diff --staged --quiet || (git commit -m "Temperaturas actualizadas: $(date +'%d/%m/%Y %H:%M')" && git pull --rebase && git push)
