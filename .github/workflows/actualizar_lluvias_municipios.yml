name: Actualizar lluvia diaria por municipio
# Va en el repo PUBLICO (temperaturas-mar-espana): .github/workflows/
#
# El script y el fichero base viven en clima-scripts (privado): la asignacion
# municipio -> estacion es el trabajo, no el resultado. Aqui solo se ejecuta y
# se commitean las salidas, que si son publicas porque las sirve la web.

on:
  schedule:
    # CINCO pasadas al dia: 01:00, 06:00, 11:00, 15:00 y 19:00 UTC.
    #
    # Varias y no una a proposito. La observacion de AEMET es una ventana movil
    # de 24 horas, asi que un dia natural se completa entre varias ejecuciones.
    # Con una sola al dia, si falla la del martes el lunes se queda incompleto
    # PARA SIEMPRE: esas horas ya no vuelven. Con cinco, cada hora se ve cuatro o
    # cinco veces y una pasada perdida no deja hueco. El script ignora las horas
    # repetidas, asi que las pasadas de mas no inflan nada.
    #
    # LA DE LA 01:00 ES LA QUE CIERRA EL DIA, y se añadio despues de descubrir
    # que en dos dias no se habia publicado NADA. Con solo 07:00 y 19:00, la
    # ultima hora del dia local no llegaba nunca: en verano peninsular la hora
    # local 23 se registra con marca de las 22:00 UTC, tres horas despues de la
    # pasada de la tarde, y el retraso con el que GitHub lanza las tareas
    # programadas (esa noche, 21:26 en vez de 19:00) se comia el margen de la
    # ventana movil. Medido: la hora 23 faltaba en el 100 % de las 833
    # estaciones. A la 01:00 UTC el dia local ya ha terminado en peninsula y en
    # Canarias, en verano y en invierno, y la ventana de 24 h todavia lo alcanza.
    #
    # LAS OTRAS CUATRO SON PARA LA CIFRA DE HOY, que es lo que la gente busca
    # cuando esta lloviendo. Reparten el dia: en invierno caen a las 07:00,
    # 12:00, 16:00 y 20:00 hora peninsular; en verano, a las 08:00, 13:00, 17:00
    # y 21:00. El hueco mas largo son las seis horas de madrugada, que es cuando
    # nadie mira y ademas lo cubre la pasada que cierra el dia.
    #
    # Coste: unos 20 segundos por pasada en un repositorio publico, o sea gratis,
    # y una sola llamada a AEMET cada vez.
    - cron: '0 1 * * *'
    - cron: '0 6 * * *'
    - cron: '0 11 * * *'
    - cron: '0 15 * * *'
    - cron: '0 19 * * *'

  workflow_dispatch:

concurrency:
  group: lluvia-municipios
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Descargar repo publico (este)
        uses: actions/checkout@v4

      - name: Descargar scripts privados (clima-scripts)
        uses: actions/checkout@v4
        with:
          repository: DavidBebow/clima-scripts
          token: ${{ secrets.SCRIPTS_TOKEN }}
          path: privado

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Ejecutar script
        env:
          AEMET_API_KEY: ${{ secrets.AEMET_API_KEY }}
          # El base viaja con el script, en el privado. El historico y la salida
          # se quedan aqui, que es quien los sirve por GitHub Pages.
          CG_BASE: privado/municipios_base.json
          CG_HIST: historico_estaciones.json
          CG_SALIDA: docs/lluvias_municipios.json
        run: python privado/lluvia_municipios_diaria.py

      - name: Publicar cambios
        # SIEMPRE, aunque el script haya salido con error. El runner es efimero:
        # si el paso anterior falla y este se salta, las 10.000 filas horarias
        # que acaba de descargar se van con el. El script guarda el historico
        # antes de fallar precisamente para que este paso lo recoja; sin
        # `always()` ese cuidado no serviria de nada.
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash
          git add historico_estaciones.json
          # docs/lluvias_municipios.json puede no existir todavia: mientras no
          # haya ningun dia natural cerrado el script guarda historico pero no
          # publica salida, y un `git add` de un fichero inexistente tumbaria el
          # paso y con el el commit del historico que si tenemos.
          [ -f docs/lluvias_municipios.json ] && git add docs/lluvias_municipios.json || true
          # Sin cambios no se commitea: si AEMET no trae nada nuevo, no tiene
          # sentido ensuciar el historial con un commit vacio cada doce horas.
          if git diff --staged --quiet; then
            echo "Sin cambios."
          else
            git commit -m "Lluvia diaria por municipio: $(date -u +%Y-%m-%d\ %H:%M) UTC"
            git push
          fi
