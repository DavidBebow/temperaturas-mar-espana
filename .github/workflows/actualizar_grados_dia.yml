name: Actualizar grados-día

on:
  workflow_dispatch:          # botón "Run workflow" manual
  schedule:
    - cron: "0 6 15 1 *"      # cada 15 de enero (recalcula el año recién terminado)

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install requests

      - name: Calcular grados-día
        run: python scripts/obtener_grados_dia.py

      - name: Commit y push si hay cambios
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/grados-dia.json
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos."
          else
            git pull --rebase
            git commit -m "Actualiza grados-día ($(date +%Y-%m-%d))"
            git push
          fi
