name: Sondeo caudales (temporal)

on:
  workflow_dispatch: {}

jobs:
  sondeo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout privado
        uses: actions/checkout@v4
        with:
          repository: DavidBebow/clima-scripts
          token: ${{ secrets.SCRIPTS_TOKEN }}
          path: privado
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pyshp numpy netCDF4
      - run: python privado/sondeo_caudal.py
