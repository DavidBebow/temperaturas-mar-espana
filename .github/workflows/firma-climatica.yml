name: firma-climatica-diaria

# Dos veces al día: 05:30 UTC (con la previsión de la mañana)
# y 17:30 UTC (con la máxima del día ya casi consolidada).
# También a mano (Run workflow) cuando quieras regenerarlo.
on:
  schedule:
    - cron: "30 5 * * *"
    - cron: "30 17 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  calcular:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      # Los scripts viven en el repo privado. Antes este workflow usaba la copia
      # de scripts/ del repo publico, que se quedaba atras cada vez que se
      # tocaba clima-scripts.
      - name: Descargar scripts privados (clima-scripts)
        uses: actions/checkout@v4
        with:
          repository: DavidBebow/clima-scripts
          token: ${{ secrets.SCRIPTS_TOKEN }}
          path: clima-scripts

      - name: Aislar los scripts del control de versiones
        run: rm -rf clima-scripts/.git

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Calcular la Firma Climática del día
        run: python clima-scripts/firma_diaria.py

      - name: Guardar los datos del día
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/firma_climatica.json docs/firma_historico.json
          git commit -m "Firma Climática actualizada" || echo "Sin cambios que guardar"
          git push
