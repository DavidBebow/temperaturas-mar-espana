name: firma-climatica-diaria

# Dos veces al día: 05:30 UTC (con la previsión de la mañana)
# y 17:30 UTC (con la máxima del día ya casi consolidada).
# También a mano (Run workflow) cuando quieras regenerarlo.
on:
  schedule:
    - cron: "30 5 * * *"
    - cron: "30 17 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  calcular:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Calcular la Firma Climática del día
        run: python scripts/firma_diaria.py

      - name: Guardar los datos del día
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/firma_climatica.json docs/firma_historico.json
          git commit -m "Firma Climática actualizada" || echo "Sin cambios que guardar"
          git push
