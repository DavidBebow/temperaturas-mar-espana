name: Actualizar modelos por municipio
# Va en el repo PUBLICO (temperaturas-mar-espana): .github/workflows/
#
# "Que dicen los modelos": baja la ultima pasada de ECMWF (Centro Europeo),
# ICON-EU (DWD, Alemania), ARPEGE (Meteo-France) y GFS (NOAA), todos datos
# abiertos con uso comercial permitido citando la fuente, y deja en
# docs/modelos/<cod>.json, uno por provincia, la maxima, la minima y los litros
# de cada dia para cada municipio con ficha. El plugin cg-lluvia-municipal lo lee
# EN SERVIDOR para pintar el bloque de modelos en /el-tiempo/<prov>/<muni>/.
# El script vive en clima-scripts (privado), como el resto.
#
# Para una prueba, lanzarlo a mano con "ines" (INE separados por comas) y/o
# "modelos" (ecmwf,icon,arpege,gfs).

on:
  schedule:
    # Dos pasadas al dia: 10:23 y 22:23 peninsulares de verano. Para entonces
    # ya esta publicada la pasada de 00Z (o 12Z) de los cuatro modelos, la de
    # ECMWF incluida, que es la que mas tarda en salir en abierto.
    - cron: '23 8,20 * * *'
  workflow_dispatch:
    inputs:
      ines:
        description: 'INE separados por comas (vacio = las 999 fichas)'
        required: false
        default: ''
      modelos:
        description: 'Modelos separados por comas'
        required: false
        default: 'ecmwf,icon,arpege,gfs'

concurrency:
  group: modelos-municipios
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Descargar repo publico (este)
        uses: actions/checkout@v4

      - name: Descargar scripts privados (clima-scripts)
        uses: actions/checkout@v4
        with:
          repository: DavidBebow/clima-scripts
          token: ${{ secrets.SCRIPTS_TOKEN }}
          path: privado

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar librerias GRIB
        run: pip install --quiet eccodes ecmwf-opendata numpy

      - name: Ejecutar script
        env:
          CG_MAPA: docs/municipios_mapa.json
          CG_SALIDA: docs/modelos
          CG_TMP: ${{ runner.temp }}/modelos
          CG_INES: ${{ github.event.inputs.ines }}
          CG_MODELOS: ${{ github.event.inputs.modelos || 'ecmwf,icon,arpege,gfs' }}
        run: python privado/modelos_municipios.py

      - name: Publicar cambios
        # SIEMPRE: si un modelo falla, lo que haya salido de los otros se publica.
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash
          [ -d docs/modelos ] && git add docs/modelos || true
          if git diff --staged --quiet; then
            echo "Sin cambios."
          else
            git commit -m "Modelos por municipio: $(date -u +%Y-%m-%d\ %H:%M) UTC"
            for i in 1 2 3 4 5; do
              git push && break
              git pull --rebase --autostash -X theirs origin main || { git rebase --abort; true; }
              sleep $((i*5))
            done
          fi
