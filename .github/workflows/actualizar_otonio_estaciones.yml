name: Actualizar otono por pluviometro
# Va en el repo PUBLICO (temperaturas-mar-espana): .github/workflows/
#
# Publica docs/otonio_municipios.json con la lluvia del otono AL DIA: lo que
# lleva cada pluviometro de AEMET desde el 1 de septiembre hasta la ultima hora
# medida, frente a la normal 1991-2020 de ese mismo pluviometro. Ver la cabecera
# de otonio_estaciones.py (clima-scripts).
#
# CUANDO: justo despues de cada pasada de "Actualizar lluvia diaria por
# municipio", que es quien trae las horas nuevas al historico. Asi el otono y la
# cabecera "Lluvia hoy" de la ficha salen de las mismas horas y no pueden
# contradecirse. El cron de abajo es solo una red por si esa cadena se cae.
#
# Cuesta poco: la mayoria de las pasadas no llaman a AEMET (los diarios
# validados se refrescan como mucho cada 3 horas) y tardan unos 20 segundos.

on:
  workflow_run:
    workflows: ["Actualizar lluvia diaria por municipio"]
    types: [completed]
  schedule:
    - cron: '52 * * * *'
  workflow_dispatch:

concurrency:
  group: otonio-estaciones
  cancel-in-progress: true

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Descargar repo publico (este)
        uses: actions/checkout@v4

      - name: Descargar scripts privados (clima-scripts)
        uses: actions/checkout@v4
        with:
          repository: DavidBebow/clima-scripts
          token: ${{ secrets.SCRIPTS_TOKEN }}
          path: privado

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Ejecutar
        env:
          AEMET_API_KEY: ${{ secrets.AEMET_API_KEY }}
          CG_BASE: privado/municipios_base.json
        run: python privado/otonio_estaciones.py

      - name: Publicar cambios
        # SIEMPRE: la cache de diarios cuesta llamadas a AEMET y no hay que
        # perderla con el runner aunque el calculo falle.
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if grep -l '^<<<<<<< ' docs/otonio_municipios.json 2>/dev/null; then
            echo "Marcas de conflicto en el JSON: no se publica"; exit 1
          fi
          git add archivo/otonio/ 2>/dev/null || true
          [ -f docs/otonio_municipios.json ] && git add docs/otonio_municipios.json || true
          if git diff --staged --quiet; then
            echo "Sin cambios."
          else
            git commit -m "Otono por pluviometro: $(date -u +%Y-%m-%d\ %H:%M) UTC"
            for i in 1 2 3 4 5; do
              git push && break
              git pull --rebase --autostash -X theirs origin main || { git rebase --abort; true; }
              sleep $((i*5))
            done
          fi
