name: "Avisos: relleno histórico AEMET (reanudable)"

on:
  workflow_dispatch:
    inputs:
      desde:
        description: "Fecha inicial (YYYY-MM-DD)"
        default: "2018-06-01"
      hasta:
        description: "Fecha final (YYYY-MM-DD, vacío = anteayer)"
        default: ""

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      # Scripts desde el repo privado (patrón de GUIA-PRIVATIZAR-SCRIPTS.md).
      # Si aún no migraste, borra estos dos pasos.
      - name: Descargar scripts privados
        uses: actions/checkout@v4
        with:
          repository: DavidBebow/clima-scripts
          token: ${{ secrets.SCRIPTS_TOKEN }}
          path: scripts

      - name: Aislar scripts del control de versiones
        run: rm -rf scripts/.git

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rellenar histórico (hasta ~5 h; relanzar si queda parcial)
        env:
          AEMET_API_KEY: ${{ secrets.AEMET_API_KEY }}
          DESDE: ${{ inputs.desde }}
          HASTA: ${{ inputs.hasta }}
          MAXSECONDS: "18000"
        run: |
          if [ -z "$HASTA" ]; then unset HASTA; fi
          python scripts/avisos_backfill.py

      - name: Publicar progreso
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git pull --rebase || true
          git add docs/avisos_historico.json docs/avisos_backfill_estado.json
          git diff --cached --quiet || git commit -m "Backfill avisos AEMET $(date -u +'%F %H:%M')"
          git push
