name: Actualizar incendios
on:
  schedule:
    # 6 actualizaciones al día · horas en UTC (verano peninsular = UTC+2)
    - cron: '0 5 * * *'    # 07:00 hora peninsular
    - cron: '0 9 * * *'    # 11:00 hora peninsular
    - cron: '0 12 * * *'   # 14:00 hora peninsular
    - cron: '0 15 * * *'   # 17:00 hora peninsular
    - cron: '0 19 * * *'   # 21:00 hora peninsular
    - cron: '30 22 * * *'  # 00:30 hora peninsular (día siguiente)
  workflow_dispatch:
concurrency:
  group: actualizar-incendios
  cancel-in-progress: false
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  actualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias
        run: pip install requests
      - name: Ejecutar script
        env:
          NASA_FIRMS_KEY: ${{ secrets.NASA_FIRMS_KEY }}
        run: python scripts/obtener_incendios.py
      - name: Guardar cambios
        run: |
          git config --local user.email "accion@github.com"
          git config --local user.name "GitHub Actions Bot"
          git pull --rebase --autostash
          git add docs/incendios.json docs/historial_incendios.json
          if git diff --staged --quiet; then
            echo "No hay cambios que guardar"
          else
            git commit -m "Incendios actualizados: $(date +'%d/%m/%Y %H:%M')"
            for intento in 1 2 3 4 5; do
              git push && exit 0
              echo "Push falló. Reintentando en 15 segundos... intento $intento/5"
              sleep 15
            done
            echo "No se pudo hacer push después de 5 intentos"
            exit 1
          fi
