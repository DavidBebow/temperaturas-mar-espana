<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Incendios en España — Detecciones recientes por comunidad</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    font-family:'DM Sans',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:#0a0806;display:flex;flex-direction:column;overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  /* ---------- CABECERA ---------- */
  #cabecera{
    position:relative;z-index:500;
    background:linear-gradient(180deg,#1b0c05 0%,#130804 100%);
    color:#fff;padding:13px 20px;display:flex;justify-content:space-between;
    align-items:center;flex-wrap:wrap;gap:8px;border-bottom:1px solid #3a1a0a;
  }
  #cabecera h2{
    font-size:15px;font-weight:600;letter-spacing:-.01em;color:#fff3e8;
    display:flex;align-items:center;gap:9px;
  }
  #cabecera h2 .dot{
    width:9px;height:9px;border-radius:50%;background:#ff5a1f;flex-shrink:0;
    box-shadow:0 0 0 0 rgba(255,90,31,.6);animation:pulso 2.2s infinite;
  }
  @keyframes pulso{
    0%{box-shadow:0 0 0 0 rgba(255,90,31,.55)}
    70%{box-shadow:0 0 0 9px rgba(255,90,31,0)}
    100%{box-shadow:0 0 0 0 rgba(255,90,31,0)}
  }
  #info-derecha{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
  #resumen-nacional{font-size:12px;color:#a87a5c}
  #resumen-nacional span{color:#ff7a3c;font-weight:700}
  #ultima-actualizacion{font-size:11px;color:#7a5444}
  #ultima-actualizacion.cache{color:#caa12a}
  /* ---------- LEYENDA ---------- */
  #leyenda{
    position:relative;z-index:500;
    background:#100704;padding:9px 20px;display:flex;flex-wrap:wrap;gap:8px;
    align-items:center;border-bottom:1px solid #3a1a0a;font-size:11.5px;color:#a8897a;
  }
  #leyenda strong{color:#d6a888;font-weight:600;margin-right:2px}
  .leyenda-item{
    display:flex;align-items:center;gap:6px;color:#bca08c;
    background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.06);
    border-radius:999px;padding:4px 10px;
  }
  .leyenda-cuadrado{width:11px;height:11px;border-radius:3px;border:1px solid rgba(255,255,255,.18);flex-shrink:0}
  #leyenda .sep{color:#5a3a2a}
  #leyenda .ayuda{margin-left:auto;font-size:10.5px;color:#7a5444;border:none;background:none;padding:0}
  /* ---------- MAPA ---------- */
  #mapa{flex:1;min-height:0;width:100%;background:#0a0806}
  /* ---------- TARJETA SUPERIOR (incendio más intenso) ---------- */
  #banner-top{
    position:absolute;top:12px;left:50%;transform:translateX(-50%);
    z-index:600;max-width:min(94%,420px);text-align:center;pointer-events:auto;
    background:linear-gradient(180deg,rgba(40,10,4,.97),rgba(24,8,4,.97));
    border:1px solid #6a2a10;border-radius:14px;padding:11px 18px 12px;
    box-shadow:0 12px 38px rgba(0,0,0,.72);display:none;
  }
  #banner-top .bt-x{
    position:absolute;top:4px;right:7px;background:none;border:none;
    color:#9a6a55;font-size:20px;line-height:1;cursor:pointer;padding:2px 6px;font-family:inherit;
  }
  #banner-top .bt-x:hover{color:#fff3e8}
  #banner-top .bt-tit{font-size:11px;font-weight:700;letter-spacing:.02em;color:#ffb787;text-transform:uppercase;padding:0 14px}
  #banner-top .bt-sub{font-size:13px;color:#fff3e8;margin-top:4px}
  #banner-top .bt-sub b{color:#ffd0a8}
  #banner-top .bt-frp{color:#ff8a4c;font-weight:700}
  #banner-top .bt-go{
    margin-top:10px;display:inline-block;background:#ff5a1f;color:#1a0a04;
    border:none;border-radius:9px;padding:7px 16px;font-size:12px;font-weight:700;
    cursor:pointer;font-family:inherit;transition:background .12s ease;
  }
  #banner-top .bt-go:hover{background:#ff7a3c}
  #banner-top.ok{border-color:#2d5a36;background:linear-gradient(180deg,rgba(20,40,24,.96),rgba(12,26,16,.96))}
  #banner-top.ok .bt-tit{color:#8fdc8f}
  @media(max-width:600px){
    #banner-top{padding:9px 14px 11px;max-width:92%}
    #banner-top .bt-tit{font-size:10px}
    #banner-top .bt-sub{font-size:12px}
  }
  /* ---------- PANEL IZQUIERDO: GRANDES INCENDIOS (EFFIS) ---------- */
  #panel-grandes{
    position:absolute;top:14px;left:12px;z-index:550;width:238px;max-width:44%;
    display:flex;flex-direction:column;gap:8px;pointer-events:auto;
    max-height:calc(100% - 28px);overflow-y:auto;overflow-x:hidden;
    scrollbar-width:thin;scrollbar-color:#5a2410 transparent;
  }
  #panel-grandes::-webkit-scrollbar{width:6px}
  #panel-grandes::-webkit-scrollbar-thumb{background:#5a2410;border-radius:3px}
  #panel-grandes .pg-cab{
    font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
    color:#ffb787;background:rgba(20,8,4,.93);border:1px solid #5a2410;
    border-radius:10px;padding:6px 11px;
  }
  #panel-grandes .pg-cab small{display:block;color:#8a6a5a;font-weight:500;text-transform:none;letter-spacing:0;margin-top:1px;font-size:10px}
  .pg-card{
    background:linear-gradient(180deg,rgba(32,12,6,.95),rgba(22,8,4,.95));
    border:1px solid #5a2410;border-radius:12px;padding:9px 11px;cursor:pointer;
    transition:transform .12s ease,border-color .12s ease;
  }
  .pg-card:hover{transform:translateX(2px);border-color:#a8521f}
  .pg-card .pg-zona{font-size:12.5px;font-weight:700;color:#fff3e8;line-height:1.15}
  .pg-card .pg-prov{font-size:10.5px;color:#8a6a5a;margin-bottom:5px}
  .pg-card .pg-ha{font-size:18px;font-weight:700;color:#ff7a3c;line-height:1}
  .pg-card .pg-ha span{font-size:11px;color:#a8897a;font-weight:500}
  .pg-card .pg-meta{font-size:10.5px;color:#a8897a;margin-top:5px;display:flex;flex-wrap:wrap;gap:3px 8px}
  .pg-card .pg-ir{font-size:10.5px;color:#ffb787;margin-top:6px;font-weight:600}
  /* Fichas con datos FIRMS: intensidad + mini-gráfica + botón */
  .pg-card .pg-frp{font-size:15px;font-weight:700;color:#ff7a3c;line-height:1;margin-top:1px}
  .pg-card .pg-frp span{font-size:10px;color:#a8897a;font-weight:500}
  .pg-card .pg-graf{height:48px;position:relative;margin-top:7px}
  .pg-card .pg-graf-nota{font-size:9.5px;color:#86604c;margin-top:3px;text-align:center}
  .pg-card .pg-go{
    margin-top:8px;width:100%;background:#3a1a0a;color:#ffd0a0;border:1px solid #7a4a2a;
    border-radius:8px;padding:6px 8px;font-size:11px;font-weight:700;cursor:pointer;
    font-family:inherit;transition:background .12s ease;
  }
  .pg-card .pg-go:hover{background:#552a12}
  /* En móvil: las fichas van DEBAJO del mapa, en un carril con scroll horizontal.
     Así no tapan el mapa ni los popups. Al abrir una ficha de foco se ocultan
     temporalmente para que el mapa crezca y el popup se vea entero. */
  @media(max-width:760px){
    #panel-grandes{
      position:static;flex:0 0 auto;width:auto;max-width:none;max-height:none;
      flex-direction:row;gap:8px;overflow-x:auto;overflow-y:hidden;
      padding:8px 10px 10px;-webkit-overflow-scrolling:touch;
      background:#0d0704;border-top:1px solid #3a1a0a;
    }
    #panel-grandes .pg-cab{flex:0 0 auto;display:flex;flex-direction:column;justify-content:center;max-width:150px}
    .pg-card{flex:0 0 auto;min-width:198px}
    /* Con una ficha (popup) abierta, el carril se oculta y el mapa ocupa su hueco */
    body.popup-abierta #panel-grandes{display:none}
    /* Si la ficha no cabe en la pantalla, se puede hacer scroll dentro de ella */
    .leaflet-popup-content{max-height:56vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
  }
  /* ---------- POPUPS ---------- */
  .leaflet-popup-content-wrapper{
    background:#1a0a04 !important;border:1px solid #4a2010 !important;
    border-radius:16px !important;box-shadow:0 14px 44px rgba(0,0,0,.85) !important;
    color:#f0e0d0 !important;
  }
  .leaflet-popup-content{margin:15px 17px !important}
  .leaflet-popup-tip{background:#1a0a04 !important;border:1px solid #4a2010 !important}
  .leaflet-popup-close-button{color:#7a4a3a !important;font-size:20px !important;padding:8px 9px 0 0 !important}
  .leaflet-popup-close-button:hover{color:#f0e0d0 !important}
  .popup-titulo{font-weight:700;font-size:15.5px;margin-bottom:3px;color:#fff3e8;letter-spacing:-.01em}
  .popup-subtitulo{font-size:11.5px;color:#8a6a5a;margin-bottom:11px}
  .popup-dato{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid #2a1008;font-size:12.5px;color:#a8897a}
  .popup-dato:last-of-type{border-bottom:none}
  .popup-dato span:last-child{font-weight:600;color:#e8d0b0;text-align:right}
  .popup-separador{font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#8a4a3a;padding:9px 0 5px;border-bottom:1px solid #2a1008}
  .popup-tag{display:inline-block;margin-top:11px;padding:4px 13px;border-radius:999px;font-size:10px;font-weight:700;color:#fff;letter-spacing:.02em}
  .fuego-val{color:#ff7a3c}
  .ok-val{color:#88cc88}
  /* ---------- MINI-GRÁFICA FRP EN EL POPUP ---------- */
  .frp-mini{margin-top:7px}
  .frp-mini .frp-box{height:96px;position:relative}
  .frp-nota{font-size:10px;color:#7a5444;margin-top:4px;line-height:1.3}
  /* ---------- MARCADORES DE FOCO ---------- */
  .foco-icon{background:transparent !important;border:0 !important}
  .foco-dot{
    display:block;border-radius:50%;cursor:pointer;
    background:radial-gradient(circle at 50% 32%, #fff 0%, var(--c) 50%, var(--c) 100%);
    border:1px solid rgba(0,0,0,.4);
    transition:transform .12s ease;
  }
  .foco-dot:hover{transform:scale(1.22)}
  .foco-dot.pulsa{position:relative}
  .foco-dot.pulsa::after{
    content:'';position:absolute;inset:-2px;border-radius:50%;
    box-shadow:0 0 0 0 var(--gc);animation:focoPulso 1.9s ease-out infinite;
  }
  @keyframes focoPulso{
    0%{box-shadow:0 0 0 0 var(--gc)}
    70%{box-shadow:0 0 0 14px rgba(0,0,0,0)}
    100%{box-shadow:0 0 0 0 rgba(0,0,0,0)}
  }
  /* Foco de MAYOR intensidad: anillo blanco distintivo, siempre visible */
  .foco-max-wrap{position:relative;display:flex;align-items:center;justify-content:center}
  .foco-max-wrap .anillo{
    position:absolute;border-radius:50%;border:2px solid #fff;
    box-shadow:0 0 9px 2px rgba(255,255,255,.5);
    animation:anilloMax 1.8s ease-out infinite;
  }
  @keyframes anilloMax{
    0%{transform:scale(.65);opacity:.95}
    70%{transform:scale(1.45);opacity:0}
    100%{transform:scale(1.45);opacity:0}
  }
  /* Resalte temporal al pulsar "Ir al foco" */
  .foco-destacado .foco-dot{animation:focoSalto .55s ease 3}
  @keyframes focoSalto{
    0%,100%{transform:translateY(0)}
    35%{transform:translateY(-9px) scale(1.1)}
    60%{transform:translateY(0)}
  }
  .foco-leyenda{
    display:inline-block;width:11px;height:11px;border-radius:50%;
    background:radial-gradient(circle at 50% 35%, #fff 0%, #ff5a1f 62%);
    box-shadow:0 0 5px 1px rgba(255,90,25,.7);flex-shrink:0;
  }
  /* ---------- CONTROLES ---------- */
  .leaflet-control-zoom{border:none !important;box-shadow:0 4px 16px rgba(0,0,0,.5) !important;border-radius:12px !important;overflow:hidden}
  .leaflet-control-zoom a{background:#1a0a04 !important;color:#bca08c !important;border-color:#3a1a0a !important;width:34px !important;height:34px !important;line-height:34px !important;font-size:18px !important}
  .leaflet-control-zoom a:hover{background:#2a1008 !important;color:#fff3e8 !important}
  .leaflet-bar a:first-child{border-top-left-radius:12px !important;border-top-right-radius:12px !important}
  .leaflet-bar a:last-child{border-bottom-left-radius:12px !important;border-bottom-right-radius:12px !important}
  .leaflet-control-attribution{background:rgba(16,7,4,.82) !important;color:#7a5444 !important;font-size:10px !important;border-radius:8px 0 0 0 !important;padding:2px 8px !important}
  .leaflet-control-attribution a{color:#b88a6a !important}
  @media(max-width:600px){
    #cabecera h2{font-size:13px}
    #leyenda{font-size:10.5px;padding:8px 12px;gap:6px}
    .leyenda-item{padding:3px 8px}
    #leyenda .ayuda{display:none}
  }
</style>
</head>
<body>
<div id="cabecera">
  <h2><span class="dot"></span>Incendios forestales en España — detecciones recientes</h2>
  <div id="info-derecha">
    <span id="resumen-nacional">Cargando datos…</span>
    <span id="ultima-actualizacion"></span>
  </div>
</div>
<div id="leyenda">
  <strong>Comunidades:</strong>
  <div class="leyenda-item"><div class="leyenda-cuadrado" style="background:#1f3a26"></div> Sin detecciones</div>
  <div class="leyenda-item"><div class="leyenda-cuadrado" style="background:#caa12a"></div> 1-5 focos</div>
  <div class="leyenda-item"><div class="leyenda-cuadrado" style="background:#e07b1e"></div> 6-20 focos</div>
  <div class="leyenda-item"><div class="leyenda-cuadrado" style="background:#d83a14"></div> 21-50 focos</div>
  <div class="leyenda-item"><div class="leyenda-cuadrado" style="background:#e8160a"></div> +50 focos</div>
  <span class="sep">|</span>
  <div class="leyenda-item" style="gap:7px">
    <span style="color:#bca08c">Intensidad foco:</span>
    <span class="foco-leyenda" style="width:8px;height:8px;background:radial-gradient(circle at 50% 35%,#fff 0%,#ffd24d 60%)"></span>
    <span class="foco-leyenda" style="width:13px;height:13px;background:radial-gradient(circle at 50% 35%,#fff 0%,#ff5a1f 58%)"></span>
    <span class="foco-leyenda" style="width:19px;height:19px;background:radial-gradient(circle at 50% 35%,#fff 0%,#ff2310 56%)"></span>
    <span style="color:#8a6a5a;font-size:10.5px">menor → mayor FRP</span>
  </div>
  <span class="ayuda">Clic en comunidad o foco para detalles</span>
</div>
<div id="mapa"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
const JSON_URL = 'https://davidbebow.github.io/temperaturas-mar-espana/incendios.json';
// El geojson de límites se intenta primero desde tu propio dominio (súbelo una
// vez a docs/) y, si no estuviera, desde la fuente externa de respaldo.
const GEOJSON_URLS = [
  'https://davidbebow.github.io/temperaturas-mar-espana/spain-communities.geojson',
  'https://raw.githubusercontent.com/codeforgermany/click_that_hood/main/public/data/spain-communities.geojson'
];
const CACHE_INCENDIOS = 'cache_incendios_v1';
const CACHE_GEOJSON = 'cache_geojson_v1';
const FRP_URL = 'https://davidbebow.github.io/temperaturas-mar-espana/historial_frp.json';
const CACHE_FRP = 'cache_frp_v1';
let historialFrp = {};

// ---------------------------------------------------------------------------
//  MEDICIÓN EN GOOGLE ANALYTICS (GA4)
//  Funciona tanto si el mapa está en un <iframe> como si está pegado directo:
//   · En iframe  -> envía el evento al WordPress padre por postMessage
//                   (necesita el pequeño snippet del archivo wordpress-tracking-incendios).
//   · Directo    -> llama a gtag / dataLayer que ya hay en WordPress.
//  Cada evento lleva 'engagement_time_msec' = tiempo real de interacción,
//  de modo que GA4 cuenta el tiempo aunque el usuario no cambie de página.
// ---------------------------------------------------------------------------
let _tUltimoEvento = Date.now();
let _primeraInteraccion = true;
function track(evento, params) {
  params = params || {};
  const ahora = Date.now();
  params.engagement_time_msec = Math.max(1, ahora - _tUltimoEvento);
  _tUltimoEvento = ahora;
  if (window.self !== window.top) {
    try { window.parent.postMessage({ source: 'mapa-incendios', evento: evento, params: params }, '*'); } catch (e) {}
  } else if (typeof window.gtag === 'function') {
    window.gtag('event', evento, params);
  } else {
    window.dataLayer = window.dataLayer || [];
    window.dataLayer.push(Object.assign({ event: evento }, params));
  }
}
// La primera interacción marca la sesión como activa (deja de ser rebote).
function registrarInteraccion(evento, params) {
  if (_primeraInteraccion) {
    _primeraInteraccion = false;
    track('mapa_interaccion', { etiqueta: 'primera_interaccion' });
  }
  track(evento, params);
}

const mapa = L.map('mapa', {
  center: [39.6, -3.5], zoom: 6, zoomControl: true,
  minZoom: 5, maxZoom: 16, worldCopyJump: false, maxBoundsViscosity: 1.0,
  preferCanvas: true, zoomSnap: 1, zoomDelta: 1, wheelDebounceTime: 30, wheelPxPerZoomLevel: 90
});
// En móvil, mientras haya una ficha (popup) abierta se oculta la franja
// inferior de "incendios más intensos" para que no la tape; al cerrar, vuelve.
mapa.on('popupopen', function(e) {
  document.body.classList.add('popup-abierta');
  // El carril inferior se oculta -> el mapa crece: recalcular tamaño y recolocar el popup.
  setTimeout(function() {
    mapa.invalidateSize();
    if (e.popup && e.popup.update) e.popup.update();
  }, 60);
});
mapa.on('popupclose', function() {
  document.body.classList.remove('popup-abierta');
  setTimeout(function() { mapa.invalidateSize(); }, 60);
});
// ¿Estamos en pantalla de móvil? (mismo umbral que el CSS)
function esMovil() { return window.matchMedia('(max-width:760px)').matches; }
// En móvil el panel se inserta como bloque DEBAJO del mapa; en escritorio, flotando sobre él.
function colocarPanel(panel) {
  if (esMovil()) document.body.appendChild(panel);
  else mapa.getContainer().appendChild(panel);
  setTimeout(function() { mapa.invalidateSize(); }, 60);
}
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
  attribution: '© Esri | Datos: NASA FIRMS VIIRS', maxZoom: 16, noWrap: true
}).addTo(mapa);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}', {
  attribution: '', maxZoom: 16, opacity: 0.5, noWrap: true
}).addTo(mapa);
const NOMBRE_A_ID = {
  'Andalucía': 'andalucia', 'Andalucia': 'andalucia', 'Aragón': 'aragon', 'Aragon': 'aragon',
  'Asturias': 'asturias', 'Principado de Asturias': 'asturias', 'Islas Baleares': 'baleares', 'Illes Balears': 'baleares',
  'Canarias': 'canarias', 'Cantabria': 'cantabria', 'Castilla-La Mancha': 'castilla_mancha', 'Castilla - La Mancha': 'castilla_mancha',
  'Castilla y León': 'castilla_leon', 'Castilla y Leon': 'castilla_leon', 'Cataluña': 'cataluna', 'Catalunya': 'cataluna', 'Catalonia': 'cataluna',
  'Comunidad Valenciana': 'c_valenciana', 'País Valencià': 'c_valenciana', 'Extremadura': 'extremadura', 'Galicia': 'galicia',
  'La Rioja': 'la_rioja', 'Comunidad de Madrid': 'madrid', 'Madrid': 'madrid', 'Región de Murcia': 'murcia', 'Murcia': 'murcia',
  'Navarra': 'navarra', 'Comunidad Foral de Navarra': 'navarra', 'País Vasco': 'pais_vasco', 'Euskadi': 'pais_vasco',
  'Ceuta': 'ceuta', 'Melilla': 'melilla'
};
function colorFondo(focos) {
  if (focos === 0) return '#1f3a26';
  if (focos <= 5) return '#caa12a';
  if (focos <= 20) return '#e07b1e';
  if (focos <= 50) return '#d83a14';
  return '#e8160a';
}
function colorBorde(focos) {
  if (focos === 0) return '#356b45';
  if (focos <= 5) return '#e6c14d';
  if (focos <= 20) return '#ff9d4a';
  if (focos <= 50) return '#ff6a3a';
  return '#ff5252';
}
function formatDias(n) {
  if (!n) return '0 días';
  return `${n} día${n === 1 ? '' : 's'}`;
}
function formatFechaDeteccion(iso) {
  if (!iso) return 'No disponible';
  return new Intl.DateTimeFormat('es-ES', {
    day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit', timeZone: 'Europe/Madrid'
  }).format(new Date(iso));
}
function etiquetaConfianza(confianza) {
  const valor = String(confianza || '').toLowerCase();
  if (valor === 'h' || valor === 'high') return 'Alta';
  if (valor === 'n' || valor === 'nominal') return 'Nominal';
  if (valor === 'l' || valor === 'low') return 'Baja';
  return confianza || 'No disponible';
}
function popupComunidad(c, horas) {
  return `
    <div style="min-width:240px">
      <div class="popup-titulo">${c.tiene_fuego ? '🔥' : '✅'} ${c.nombre}</div>

function crearIconoFoco(frp, esMax) {
  // 4 niveles de intensidad bien diferenciados por tamaño Y color.
  const tier   = frp >= 100 ? 3 : frp >= 30 ? 2 : frp >= 10 ? 1 : 0;
  const size   = [12, 17, 23, 30][tier];
  const core   = ['#ffd24d', '#ff9430', '#ff5a1f', '#ff2310'][tier];
  const glow   = ['rgba(255,205,80,.85)', 'rgba(255,148,48,.88)', 'rgba(255,90,31,.9)', 'rgba(255,40,16,.95)'][tier];
  const blur   = [8, 12, 16, 20][tier];
  const spread = [1, 2, 3, 5][tier];
  const pulsa  = (tier >= 3 && !esMax) ? ' pulsa' : '';
  const dot = `<span class="foco-dot${pulsa}" style="width:${size}px;height:${size}px;--c:${core};--gc:${glow};box-shadow:0 0 ${blur}px ${spread}px ${glow}, 0 1px 2px rgba(0,0,0,.5)"></span>`;
  if (esMax) {
    const r = size + 14;
    const html = `<span class="foco-max-wrap" style="width:${r}px;height:${r}px">`
      + `<span class="anillo" style="width:${r}px;height:${r}px"></span>` + dot + `</span>`;
    return L.divIcon({ html, className: 'foco-icon', iconSize: [r, r], iconAnchor: [r / 2, r / 2], popupAnchor: [0, -r / 2 - 2] });
  }
  return L.divIcon({ html: dot, className: 'foco-icon', iconSize: [size, size], iconAnchor: [size / 2, size / 2], popupAnchor: [0, -size / 2 - 3] });
}
// --- Comunidad real de cada foco por geometría (point-in-polygon) ---
function puntoEnAnillo(lat, lng, anillo) {
  let dentro = false;
  for (let i = 0, j = anillo.length - 1; i < anillo.length; j = i++) {
    const xi = anillo[i][0], yi = anillo[i][1];
    const xj = anillo[j][0], yj = anillo[j][1];
    const corta = ((yi > lat) !== (yj > lat)) && (lng < (xj - xi) * (lat - yi) / (yj - yi) + xi);
    if (corta) dentro = !dentro;
  }
  return dentro;
}
function puntoEnGeometria(lat, lng, geom) {
  if (!geom) return false;
  const poligonos = geom.type === 'Polygon' ? [geom.coordinates] : geom.type === 'MultiPolygon' ? geom.coordinates : [];
  for (const poly of poligonos) {
    if (!puntoEnAnillo(lat, lng, poly[0])) continue;
    let enHueco = false;
    for (let k = 1; k < poly.length; k++) { if (puntoEnAnillo(lat, lng, poly[k])) { enHueco = true; break; } }
    if (!enHueco) return true;
  }
  return false;
}
function comunidadDePunto(lat, lng, geojson) {
  for (const feat of geojson.features) {
    if (puntoEnGeometria(lat, lng, feat.geometry)) {
      return feat.properties.name || feat.properties.NAME || null;
    }
  }
  return null;
}

// ---------------------------------------------------------------------------
//  CARGA RESILIENTE: timeout + reintentos + caché en el navegador.
//  Si la descarga falla, se usa la última copia buena guardada localmente,
//  de modo que el visitante SIEMPRE ve datos (aunque sean algo antiguos).
// ---------------------------------------------------------------------------
function leerCache(clave) {
  try {
    const txt = localStorage.getItem(clave);
    return txt ? JSON.parse(txt) : null;
  } catch (e) { return null; }
}
function guardarCache(clave, data) {
  try { localStorage.setItem(clave, JSON.stringify(data)); } catch (e) {}
}
async function fetchConTimeout(url, ms) {
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), ms);
  try {
    const r = await fetch(url, { signal: ctrl.signal, cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return await r.json();
  } finally {
    clearTimeout(t);
  }
}
// Intenta varias URLs en orden, con un reintento cada una. Devuelve null si todas fallan.
async function cargarRemoto(urls, { reintentos = 2, timeout = 12000 } = {}) {
  for (const url of urls) {
    for (let i = 0; i < reintentos; i++) {
      try {
        return await fetchConTimeout(url, timeout);
      } catch (e) {
        console.warn('Fallo al cargar', url, '(intento', i + 1, ')', e.message);
      }
    }
  }
  return null;
}

async function inicializar() {
  // 1) Datos de incendios: remoto -> caché.
  let data = await cargarRemoto([JSON_URL + '?t=' + Date.now()], { reintentos: 2 });
  let datosDesdeCache = false;
  if (data && Array.isArray(data.comunidades)) {
    guardarCache(CACHE_INCENDIOS, data);
  } else {
    data = leerCache(CACHE_INCENDIOS);
    datosDesdeCache = !!data;
  }

  // 2) Límites de comunidades: propio -> externo -> caché.
  let geojson = await cargarRemoto(GEOJSON_URLS, { reintentos: 2 });
  if (geojson && Array.isArray(geojson.features)) {
    guardarCache(CACHE_GEOJSON, geojson);
  } else {
    geojson = leerCache(CACHE_GEOJSON);
  }

  // Sin límites no se puede dibujar el mapa de comunidades.
  if (!geojson) {
    document.getElementById('resumen-nacional').textContent = 'No se pudo cargar el mapa. Reintentando…';
    setTimeout(inicializar, 20000); // reintento automático en segundo plano
    return;
  }
  // Si no hay datos de incendios, pintamos el mapa vacío (todo "sin detecciones")
  // en vez de dejar la pantalla en blanco.
  if (!data || !Array.isArray(data.comunidades)) {
    data = { comunidades: [], focos_individuales: [], total_focos_espana: 0, comunidades_con_fuego: 0, ventana_activa_horas: 48, fecha_legible: '' };
    datosDesdeCache = false;
  }

  // Histórico de FRP por celda (para la gráfica del popup). No bloquea el mapa.
  const frp = await cargarRemoto([FRP_URL + '?t=' + Date.now()], { reintentos: 1, timeout: 12000 });
  if (frp && typeof frp === 'object' && !Array.isArray(frp)) {
    historialFrp = frp;
    guardarCache(CACHE_FRP, frp);
  } else {
    const cacheado = leerCache(CACHE_FRP);
    if (cacheado) historialFrp = cacheado;
  }

  renderizar(data, geojson, datosDesdeCache);
}

// Dibuja la línea de FRP en el tiempo en cualquier canvas (popup o ficha lateral).
function dibujarGraficoFrp(canvas, nota, f, compacto) {
  if (!canvas) return;
  let serie = (f.celda && historialFrp && historialFrp[f.celda]) ? historialFrp[f.celda].slice() : [];
  if (f.deteccion_utc && !serie.some(p => p.t === f.deteccion_utc)) {
    serie.push({ t: f.deteccion_utc, frp: f.frp });
  }
  serie.sort((a, b) => (a.t < b.t ? -1 : 1));

  if (typeof Chart === 'undefined') { if (nota) nota.textContent = ''; return; }
  if (serie.length < 2) {
    canvas.style.display = 'none';
    if (nota) nota.textContent = compacto ? 'Sin histórico aún' : 'Aún no hay histórico suficiente en esta zona; la curva se irá formando con las próximas pasadas del satélite.';
    return;
  }
  canvas.style.display = '';

  const etiquetas = serie.map(p => new Intl.DateTimeFormat('es-ES', {
    day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit', timeZone: 'Europe/Madrid'
  }).format(new Date(p.t)));
  const valores = serie.map(p => p.frp);
  const ultimo = valores[valores.length - 1], previo = valores[valores.length - 2];
  let tendencia = 'estable';
  if (ultimo > previo * 1.15) tendencia = 'subiendo';
  else if (ultimo < previo * 0.85) tendencia = 'bajando';

  if (canvas._chart) { try { canvas._chart.destroy(); } catch (e) {} }
  canvas._chart = new Chart(canvas, {
    type: 'line',
    data: { labels: etiquetas, datasets: [{
      data: valores, borderColor: '#ff7a3c', backgroundColor: 'rgba(255,122,60,.18)',
      borderWidth: 2, fill: true, tension: 0.25, pointRadius: compacto ? 0 : 2, pointBackgroundColor: '#ffd0a0'
    }] },
    options: {
      responsive: true, maintainAspectRatio: false, animation: false,
      plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => c.parsed.y + ' MW' } } },
      scales: {
        x: { display: !compacto, ticks: { color: '#8a6a5a', font: { size: 9 }, maxTicksLimit: 4, maxRotation: 0 }, grid: { color: 'rgba(255,255,255,.05)' } },
        y: { ticks: { color: '#8a6a5a', font: { size: 9 }, maxTicksLimit: compacto ? 3 : 4 }, grid: { color: 'rgba(255,255,255,.06)' }, beginAtZero: true }
      }
    }
  });
  if (nota) nota.textContent = compacto
    ? 'Tendencia: ' + tendencia
    : serie.length + ' detecciones · tendencia reciente: ' + tendencia + ' · MW (potencia radiativa).';
}

function renderFrpChart(marcador, f) {
  const popup = marcador.getPopup && marcador.getPopup();
  const cont = popup && popup.getElement ? popup.getElement() : null;
  if (!cont) return;
  dibujarGraficoFrp(cont.querySelector('canvas.frp-canvas'), cont.querySelector('.frp-nota'), f, false);
}

function renderizar(data, geojson, datosDesdeCache) {
  const datosMap = {};
  data.comunidades.forEach(c => { datosMap[c.id] = c; });
  const totalFocos = data.total_focos_espana || 0;
  const conFuego = data.comunidades_con_fuego || 0;
  const horas = data.ventana_activa_horas || 48;

  document.getElementById('resumen-nacional').innerHTML = conFuego > 0
    ? `<span>${conFuego} comunidades</span> con detecciones · <span>${totalFocos} focos</span> en ${horas} h`
    : `✓ Sin detecciones recientes en España`;

  const elFecha = document.getElementById('ultima-actualizacion');
  if (data.fecha_legible) {
    elFecha.textContent = (datosDesdeCache ? '⚠ Última copia guardada: ' : 'Actualizado: ') + data.fecha_legible;
  } else {
    elFecha.textContent = '';
  }
  elFecha.classList.toggle('cache', datosDesdeCache);

  let primerLayer = null;
  const capaGeojson = L.geoJSON(geojson, {
    style: function(feature) {
      const nombre = feature.properties.name || feature.properties.NAME || '';
      const c = datosMap[NOMBRE_A_ID[nombre]];
      const focos = c ? c.focos_activos : 0;
      return { fillColor: colorFondo(focos), fillOpacity: 0.55, color: colorBorde(focos), weight: 1, opacity: 0.95 };
    },
    onEachFeature: function(feature, layer) {
      const nombre = feature.properties.name || feature.properties.NAME || '';
      const c = datosMap[NOMBRE_A_ID[nombre]];
      if (!c) return;
      layer.bindPopup(popupComunidad(c, horas), { maxWidth: 280, autoPanPadding: L.point(16, 24) });
      layer.on('popupopen', function() {
        registrarInteraccion('comunidad_click', { comunidad: c.nombre, focos_activos: c.focos_activos });
      });
      layer.on('mouseover', function() { layer.setStyle({ fillOpacity: 0.78, weight: 2 }); });
      layer.on('mouseout', function() { capaGeojson.resetStyle(layer); });
      if (c.tiene_fuego && !primerLayer) primerLayer = layer;
    }
  }).addTo(mapa);

  // Encuadre inicial en España (incluye Canarias y Baleares). Dejamos margen
  // amplio para poder desplazar y ver las fichas: límites holgados (sin rebote)
  // y sin bloquear el zoom mínimo, que era lo que hacía "volver al soltar".
  const limites = capaGeojson.getBounds();
  if (limites.isValid()) {
    mapa.fitBounds(limites, { padding: [24, 24] });
    mapa.setMaxBounds(limites.pad(0.8));
  }

  // Une detecciones casi solapadas (mismo fuego en distintas pasadas/sensores):
  // se conserva la de MAYOR FRP en cada punto, para que el marcador visible sea
  // siempre el más intenso y no quede uno débil tapando al fuerte.
  function dedupeFocos(focos) {
    const ordenados = focos.slice().sort((a, b) => (Number(b.frp) || 0) - (Number(a.frp) || 0));
    const elegidos = [];
    const UMBRAL = 0.015; // grados ≈ 1,5 km
    for (const f of ordenados) {
      const solapa = elegidos.some(g => Math.abs(g.lat - f.lat) < UMBRAL && Math.abs(g.lon - f.lon) < UMBRAL);
      if (!solapa) elegidos.push(f);
    }
    return elegidos;
  }

  let marcadorTop = null, focoTop = null;
  const marcadores = [];
  dedupeFocos(data.focos_individuales || []).forEach(f => {
    f.frp = Number(f.frp) || 0;
    const comunidadReal = comunidadDePunto(f.lat, f.lon, geojson);
    if (comunidadReal) f.comunidad = comunidadReal;
    const marcador = L.marker([f.lat, f.lon], {
      icon: crearIconoFoco(f.frp),
      zIndexOffset: Math.round(f.frp * 10), // los más intensos, dibujados por encima
      riseOnHover: true
    }).addTo(mapa).bindPopup(popupFoco(f), { maxWidth: 270, autoPanPadding: L.point(16, 24) });
    marcador.on('popupopen', function() {
      registrarInteraccion('foco_click', {
        comunidad: f.comunidad || 'Desconocida',
        frp: f.frp,
        intensidad: f.intensidad || '',
        sensor: f.sensor || 'VIIRS'
      });
      renderFrpChart(marcador, f);
    });
    marcadores.push({ f: f, marcador: marcador });
    if (!focoTop || f.frp > focoTop.frp) { focoTop = f; marcadorTop = marcador; }
  });

  // El foco MÁS intenso: anillo blanco distintivo y siempre por encima del resto.
  if (marcadorTop) {
    marcadorTop.setIcon(crearIconoFoco(focoTop.frp, true));
    marcadorTop.setZIndexOffset(100000);
  }

  // Tarjeta superior: una sola, con info del foco más intenso, su X y un botón "Ir al foco".
  // (Sin abrir popups automáticos: nada de doble popup ni exceso de información al entrar.)
  let banner = document.getElementById('banner-top');
  if (!banner) {
    banner = document.createElement('div');
    banner.id = 'banner-top';
    mapa.getContainer().appendChild(banner);
  }
  if (focoTop && marcadorTop) {
    banner.classList.remove('ok');
    banner.innerHTML =
      '<button class="bt-x" aria-label="Cerrar">&times;</button>' +
      '<div class="bt-tit">🔥 Incendio de mayor intensidad en España</div>' +
      '<div class="bt-sub"><b>' + (focoTop.comunidad || 'España') + '</b>' +
        (focoTop.lugar ? ' · ' + focoTop.lugar : '') +
        ' · <span class="bt-frp">' + focoTop.frp + ' MW</span>' +
        (focoTop.intensidad ? ' · ' + focoTop.intensidad : '') + '</div>' +
      '<button class="bt-go">Ir al foco en el mapa →</button>';
    banner.style.display = 'block';

    const irAlFoco = function() {
      banner.style.display = 'none';  // al ir al foco, ocultamos la tarjeta: queda solo el popup
      mapa.flyTo(marcadorTop.getLatLng(), 11, { duration: 1.1 });
      mapa.once('moveend', function() {
        marcadorTop.openPopup();
        const el = marcadorTop.getElement();
        if (el) {
          el.classList.add('foco-destacado');
          setTimeout(function() { el.classList.remove('foco-destacado'); }, 2200);
        }
      });
      registrarInteraccion('ver_foco_max', { comunidad: focoTop.comunidad || '', frp: focoTop.frp });
    };
    banner.querySelector('.bt-x').onclick = function() { banner.style.display = 'none'; };
    banner.querySelector('.bt-go').onclick = irAlFoco;
  } else {
    banner.classList.add('ok');
    banner.innerHTML = '<div class="bt-tit">✓ Sin incendios activos en España ahora mismo</div>';
    banner.style.display = 'block';
  }

  // Panel izquierdo. Prioridad: EFFIS (hectáreas) si algún día está activo o en
  // modo demo; si no, los 4 focos más intensos de FIRMS (intensidad + gráfica + botón).
  let grandes = data.grandes_incendios;
  if ((!grandes || !grandes.length) && /[?&]demo=1/.test(location.search)) grandes = GRANDES_EJEMPLO;
  if (grandes && grandes.length) {
    renderPanelGrandes(grandes);
  } else {
    const top = marcadores.slice().sort((a, b) => (b.f.frp || 0) - (a.f.frp || 0)).slice(0, 4);
    renderPanelFirms(top);
  }
}

inicializar();

// Reajusta el encuadre si cambia el tamaño del marco (responsive iframe)
// y recoloca el panel de incendios si se cruza el umbral móvil/escritorio.
window.addEventListener('resize', () => {
  mapa.invalidateSize();
  const panel = document.getElementById('panel-grandes');
  if (panel) {
    const dentroDelMapa = panel.parentElement === mapa.getContainer();
    if (esMovil() && dentroDelMapa) colocarPanel(panel);
    else if (!esMovil() && !dentroDelMapa) colocarPanel(panel);
  }
});
</script>
</body>
</html>
