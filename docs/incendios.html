<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Incendios en España — Tiempo Real por Comunidad</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: Arial, sans-serif; background: #0a1628; }
  #mapa { width: 100%; height: 530px; background: #0a1628; }

  #cabecera {
    background: #1a0a0a;
    color: white;
    padding: 10px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 6px;
    border-bottom: 1px solid #3a1a1a;
  }
  #cabecera h2 {
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 0.04em;
    color: #fff0e8;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  #resumen-nacional {
    font-size: 11px;
    color: #9a6a5a;
    letter-spacing: 0.02em;
  }
  #resumen-nacional span {
    color: #ff8855;
    font-weight: 600;
  }
  #ultima-actualizacion {
    font-size: 11px;
    color: #7a5a4a;
  }

  #leyenda {
    background: #150808;
    padding: 7px 16px;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    border-bottom: 1px solid #3a1a1a;
    font-size: 11px;
    color: #9a7a6a;
  }
  #leyenda strong { color: #cc9a8a; font-weight: 500; }
  .leyenda-item { display: flex; align-items: center; gap: 4px; color: #9a7a6a; }
  .leyenda-punto {
    width: 10px; height: 10px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.15);
    flex-shrink: 0;
  }

  /* MARCADORES */
  .marcador-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    cursor: pointer;
  }
  .marcador-burbuja {
    border-radius: 10px;
    border: 1.5px solid rgba(255,255,255,0.2);
    box-shadow: 0 2px 12px rgba(0,0,0,0.6), 0 0 0 1px rgba(0,0,0,0.3);
    padding: 4px 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-width: 72px;
    white-space: nowrap;
    backdrop-filter: blur(2px);
  }
  .marcador-nombre {
    font-size: 8px; font-weight: 700;
    color: rgba(255,255,255,0.9);
    text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    line-height: 1.2;
    text-align: center;
  }
  .marcador-focos {
    font-size: 13px; font-weight: 800;
    color: white;
    text-shadow: 0 1px 4px rgba(0,0,0,0.8);
    line-height: 1.3;
  }
  .marcador-sin-fuego {
    font-size: 10px; font-weight: 600;
    color: rgba(255,255,255,0.8);
    line-height: 1.3;
  }
  .marcador-fila {
    display: flex; gap: 5px;
    align-items: center; margin-top: 1px;
  }
  .marcador-dias {
    font-size: 9px; font-weight: 600;
    color: rgba(255,255,255,0.9);
    background: rgba(0,0,0,0.3);
    border-radius: 4px; padding: 0 4px;
    text-shadow: 0 1px 2px rgba(0,0,0,0.6);
  }
  .marcador-punta {
    width: 0; height: 0;
    border-left: 6px solid transparent;
    border-right: 6px solid transparent;
    margin-top: -1px;
    filter: drop-shadow(0 2px 3px rgba(0,0,0,0.5));
  }

  /* POPUP OSCURO CÁLIDO */
  .leaflet-popup-content-wrapper {
    background: #180a0a !important;
    border: 1px solid #3a1a1a !important;
    border-radius: 14px !important;
    box-shadow: 0 8px 32px rgba(0,0,0,0.7) !important;
    color: #f0e0d8 !important;
  }
  .leaflet-popup-tip { background: #180a0a !important; }
  .leaflet-popup-close-button { color: #7a5a4a !important; }
  .leaflet-popup-close-button:hover { color: #f0e0d8 !important; }

  .popup-titulo { font-weight: 700; font-size: 14px; margin-bottom: 3px; color: #fff0e8; }
  .popup-dato {
    display: flex; justify-content: space-between;
    padding: 5px 0; border-bottom: 1px solid #2a1212;
    font-size: 12px; color: #9a7a6a;
  }
  .popup-dato:last-of-type { border-bottom: none; }
  .popup-dato span:last-child { font-weight: 600; color: #e0c8b8; }
  .popup-separador {
    font-size: 10px; font-weight: 600;
    letter-spacing: 0.06em; text-transform: uppercase;
    color: #7a5a4a; padding: 8px 0 4px;
    border-bottom: 1px solid #2a1212;
  }
  .popup-tag {
    display: inline-block; margin-top: 10px;
    padding: 3px 12px; border-radius: 12px;
    font-size: 10px; font-weight: 700; color: white;
    letter-spacing: 0.03em;
  }
  .popup-fuego { color: #ff8855; }
  .popup-sin-fuego { color: #88cc88; }

  /* Controles dark cálido */
  .leaflet-control-zoom a {
    background: #180a0a !important;
    color: #9a7a6a !important;
    border-color: #3a1a1a !important;
  }
  .leaflet-control-zoom a:hover {
    background: #2a1212 !important;
    color: #f0e0d8 !important;
  }
  .leaflet-control-attribution {
    background: rgba(24,10,10,0.85) !important;
    color: #7a5a4a !important;
    font-size: 10px !important;
  }
  .leaflet-control-attribution a { color: #aa8a7a !important; }
</style>
</head>
<body>

<div id="cabecera">
  <h2>🔥 Incendios en España — Por Comunidad Autónoma</h2>
  <div style="display:flex;flex-direction:column;align-items:flex-end;gap:2px">
    <span id="resumen-nacional">Cargando datos...</span>
    <span id="ultima-actualizacion"></span>
  </div>
</div>

<div id="leyenda">
  <strong>Focos activos:</strong>
  <div class="leyenda-item"><div class="leyenda-punto" style="background:#44AA66"></div> Sin incendios</div>
  <div class="leyenda-item"><div class="leyenda-punto" style="background:#FFCC44"></div> 1–5 focos</div>
  <div class="leyenda-item"><div class="leyenda-punto" style="background:#FF8822"></div> 6–20 focos</div>
  <div class="leyenda-item"><div class="leyenda-punto" style="background:#FF4400"></div> 21–50 focos</div>
  <div class="leyenda-item"><div class="leyenda-punto" style="background:#CC2200"></div> +50 focos</div>
  <span style="margin-left:auto;font-size:10px;color:#7a5a4a">Clic en una comunidad para más detalles</span>
</div>

<div id="mapa"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const JSON_URL = 'https://davidbebow.github.io/temperaturas-mar-espana/incendios.json';

const mapa = L.map('mapa', {
  center: [40.0, -3.5],
  zoom: 5,
  zoomControl: true
});

L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
  attribution: '© Esri | Datos: NASA FIRMS',
  maxZoom: 16
}).addTo(mapa);

L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}', {
  attribution: '',
  maxZoom: 16,
  opacity: 0.7
}).addTo(mapa);

function crearIcono(c) {
  const color = c.color;
  const nombre = c.nombre.length > 14 ? c.nombre.substring(0, 13) + '…' : c.nombre;
  const dias = c.dias_consecutivos > 0
    ? c.dias_consecutivos + 'd 🔥'
    : '';

  let contenido = '';
  if (c.tiene_fuego) {
    contenido = `
      <div class="marcador-focos">🔥 ${c.focos_activos}</div>
      ${dias ? `<div class="marcador-fila"><span class="marcador-dias">${dias}</span></div>` : ''}
    `;
  } else {
    contenido = `<div class="marcador-sin-fuego">✓ Sin focos</div>`;
  }

  const html = `
    <div class="marcador-wrapper">
      <div class="marcador-burbuja" style="background:${color}cc">
        <div class="marcador-nombre">${nombre}</div>
        ${contenido}
      </div>
      <div class="marcador-punta" style="border-top:8px solid ${color}cc"></div>
    </div>`;

  return L.divIcon({
    html,
    className: '',
    iconSize: null,
    iconAnchor: [44, c.tiene_fuego ? 52 : 44],
    popupAnchor: [0, -55]
  });
}

function formatDias(n, label) {
  if (n === null || n === undefined) return '—';
  if (n === 0) return `0 días`;
  return `${n} día${n === 1 ? '' : 's'}`;
}

fetch(JSON_URL + '?t=' + Date.now())
  .then(r => r.json())
  .then(data => {
    const totalFocos = data.total_focos_espana || 0;
    const conFuego   = data.comunidades_con_fuego || 0;

    document.getElementById('resumen-nacional').innerHTML =
      conFuego > 0
        ? `<span>${conFuego} comunidades</span> con fuego activo · <span>${totalFocos} focos</span> en España`
        : `✓ Sin incendios activos en España`;

    document.getElementById('ultima-actualizacion').textContent =
      'Actualizado: ' + data.fecha_legible;

    let primerConFuego = null;
    let primerMarker  = null;

    data.comunidades.forEach(c => {
      const icono = crearIcono(c);

      const popup = `
        <div style="min-width:230px">
          <div class="popup-titulo">${c.tiene_fuego ? '🔥' : '✅'} ${c.nombre}</div>
          <div class="popup-dato">
            <span>Focos activos hoy</span>
            <span class="${c.tiene_fuego ? 'popup-fuego' : 'popup-sin-fuego'}">${c.focos_activos > 0 ? c.focos_activos + ' focos' : 'Sin incendios'}</span>
          </div>
          <div class="popup-dato">
            <span>Estado</span>
            <span>${c.etiqueta}</span>
          </div>
          <div class="popup-separador">Histórico de incendios</div>
          <div class="popup-dato">
            <span>Días seguidos con incendio</span>
            <span class="${c.dias_consecutivos > 0 ? 'popup-fuego' : ''}">${formatDias(c.dias_consecutivos)}</span>
          </div>
          <div class="popup-dato">
            <span>Días con incendio este año</span>
            <span>${formatDias(c.dias_anio_actual)}</span>
          </div>
          <div class="popup-dato">
            <span>Días con incendio año anterior</span>
            <span>${formatDias(c.dias_anio_anterior)}</span>
          </div>
          <div class="popup-dato">
            <span>Récord racha con incendio</span>
            <span>${formatDias(c.max_racha_con_fuego)}</span>
          </div>
          <div>
            <span class="popup-tag" style="background:${c.color}99;border:1px solid ${c.color}">
              ${c.etiqueta}
            </span>
          </div>
        </div>`;

      const marker = L.marker([c.lat, c.lon], { icon: icono })
        .addTo(mapa)
        .bindPopup(popup, { maxWidth: 270 });

      if (c.tiene_fuego && !primerConFuego) {
        primerConFuego = c;
        primerMarker   = marker;
      }

      if (!primerMarker) {
        primerMarker = marker;
      }
    });

    // Abrir automáticamente la primera comunidad con fuego, o Andalucía si no hay ninguna
    if (primerMarker) {
      setTimeout(() => primerMarker.openPopup(), 800);
    }
  })
  .catch(err => {
    console.error('Error:', err);
    document.getElementById('resumen-nacional').textContent = 'Error al cargar datos';
  });
</script>
</body>
</html>
