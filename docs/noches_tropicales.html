<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Temperaturas nocturnas en España</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1622;
      --panel: #0e1c2b;
      --panel-2: #122335;
      --ink: #eaf4fc;
      --muted: #7fa3bf;
      --line: rgba(127, 163, 191, 0.18);
      --accent: #f0c83b;
      --radius: 12px;
      font-size: 16px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .wrap {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    /* ---------- Cabecera ---------- */
    header {
      padding: 12px 16px 10px;
      background: linear-gradient(180deg, var(--panel-2), var(--panel));
      border-bottom: 1px solid var(--line);
    }

    .topbar {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 4px 16px;
    }

    h1 {
      margin: 0;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.01em;
    }

    h1 .moon { margin-right: 6px; }

    .meta {
      color: var(--muted);
      font-size: 11.5px;
      display: flex;
      gap: 4px 14px;
      flex-wrap: wrap;
    }

    .meta strong { color: #b9d4e8; font-weight: 600; }

    .legend-bar {
      margin-top: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px 16px;
      flex-wrap: wrap;
    }

    .pills {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 9px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--line);
      font-size: 11px;
      color: #c4dbec;
      white-space: nowrap;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      flex: 0 0 auto;
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.25);
    }

    .hint {
      color: var(--muted);
      font-size: 11px;
      white-space: nowrap;
    }

    /* ---------- Mapa ---------- */
    #map {
      min-height: 460px;
      height: calc(100vh - 96px);
      width: 100%;
      background: #0b1622;
    }

    .leaflet-control-zoom a {
      background: var(--panel-2) !important;
      color: var(--ink) !important;
      border-color: var(--line) !important;
    }

    /* Botones Península / Canarias */
    .view-switch {
      display: flex;
      gap: 4px;
      background: rgba(14, 28, 43, 0.92);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 3px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
    }

    .view-switch button {
      appearance: none;
      border: 0;
      background: transparent;
      color: #c4dbec;
      font: 600 11px/1 system-ui, sans-serif;
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
    }

    .view-switch button.active {
      background: var(--accent);
      color: #1a1405;
    }

    /* Etiquetas de ciudad */
    .leaflet-tooltip.city-label {
      background: transparent;
      border: 0;
      box-shadow: none;
      color: #f4fafe;
      font-size: 10px;
      font-weight: 700;
      text-shadow: 0 1px 2px #000, 0 0 4px #000;
      pointer-events: none;
    }

    /* ---------- Popup ---------- */
    .leaflet-popup-content-wrapper {
      padding: 0;
      border-radius: var(--radius);
      background: var(--panel-2);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
      border: 1px solid var(--line);
    }

    .leaflet-popup-content { margin: 0; width: 272px !important; }
    .leaflet-popup-tip { background: var(--panel-2); }

    /* Botón de cierre (el de Leaflet, ahora visible y estilizado) */
    .leaflet-popup-close-button {
      width: 26px !important;
      height: 26px !important;
      top: 8px !important;
      right: 8px !important;
      border-radius: 50% !important;
      background: rgba(255, 255, 255, 0.08) !important;
      color: #cde4f5 !important;
      font: 400 16px/26px sans-serif !important;
      text-align: center;
      transition: background 0.15s;
    }

    .leaflet-popup-close-button:hover {
      background: rgba(255, 255, 255, 0.18) !important;
      color: #fff !important;
    }

    .card { padding: 14px 14px 12px; }

    .card h2 {
      margin: 0 28px 2px 0;
      font-size: 16px;
      line-height: 1.2;
      color: #fff;
    }

    .card .place {
      color: var(--muted);
      font-size: 11.5px;
      margin-bottom: 10px;
    }

    .now {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 9px 11px;
      margin-bottom: 10px;
    }

    .now .dot { width: 12px; height: 12px; }

    .now .t {
      font-size: 19px;
      font-weight: 750;
      color: #fff;
      white-space: nowrap;
    }

    .now .lbl {
      color: var(--muted);
      font-size: 10.5px;
      line-height: 1.3;
    }

    .section {
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 4px 0;
      font-size: 12.5px;
    }

    .row span:first-child { color: #9ec3da; }
    .row strong { color: #fff; font-weight: 700; white-space: nowrap; }
    .row strong.warm { color: #ffb38a; }
    .row strong.cool { color: #9fd4ff; }

    @media (max-width: 700px) {
      header { padding: 10px 12px 8px; }
      #map { height: 540px; }
      .hint { display: none; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="topbar">
        <h1><span class="moon">🌙</span>Temperaturas nocturnas en España</h1>
        <div class="meta" id="meta">Cargando datos…</div>
      </div>
      <div class="legend-bar">
        <div class="pills" id="pills"></div>
        <div class="hint">🌙 tamaño = noches tropicales del mes · Pulsa una ciudad para el detalle</div>
      </div>
    </header>
    <main id="map" aria-label="Mapa de temperaturas nocturnas"></main>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const DATA_URL = "temperaturas_nocturnas.json?v=" + Date.now();

    const NIVELES = [
      { min: 25,        color: "#e03415", label: "Muy cálida", sub: "25 ºC o más" },
      { min: 20,        color: "#ff7a1a", label: "Tropical",   sub: "20–24,9 ºC" },
      { min: 15,        color: "#ffb320", label: "Cálida",     sub: "15–19,9 ºC" },
      { min: 10,        color: "#4cb572", label: "Templada",   sub: "10–14,9 ºC" },
      { min: 5,         color: "#3fa2d8", label: "Fresca",     sub: "5–9,9 ºC" },
      { min: -Infinity, color: "#2266bb", label: "Fría",       sub: "menos de 5 ºC" }
    ];
    const SIN_DATOS = "#6b7884";
    const MESES = ["ene", "feb", "mar", "abr", "may", "jun", "jul", "ago", "sep", "oct", "nov", "dic"];

    const fmtTemp = v => (v === null || v === undefined)
      ? "—"
      : v.toFixed(1).replace(".", ",") + " ºC";

    const fmtDelta = v => {
      if (v === null || v === undefined) return "—";
      return (v > 0 ? "+" : "") + v.toFixed(1).replace(".", ",") + " ºC";
    };

    const fmtFecha = iso => {
      if (!iso) return "";
      const [y, m, d] = iso.split("-").map(Number);
      return `${d} ${MESES[m - 1]}`;
    };

    function nivelDe(tmin) {
      if (tmin === null || tmin === undefined) return null;
      return NIVELES.find(n => tmin >= n.min);
    }

    // Última mínima disponible: la de anoche si existe; si no,
    // el dato más reciente del histórico (AEMET publica con 3-4 días de retraso).
    function ultimaMin(city) {
      if (city.t_min_anoche !== null && city.t_min_anoche !== undefined) {
        return { tmin: city.t_min_anoche, fecha: city.fecha_anoche, esAnoche: true };
      }
      const h = city.historico || {};
      const fechas = Object.keys(h)
        .filter(k => !k.startsWith("_") && h[k] && h[k].tmin !== null && h[k].tmin !== undefined)
        .sort();
      if (!fechas.length) return null;
      const f = fechas[fechas.length - 1];
      return { tmin: h[f].tmin, fecha: f, esAnoche: false };
    }

    function radio(city) {
      return 7 + Math.min(city.nt_mes || 0, 20) * 0.5;
    }

    function popupHtml(city, data, um) {
      const nivel = um ? nivelDe(um.tmin) : null;
      const color = nivel ? nivel.color : SIN_DATOS;
      const etiqueta = nivel ? nivel.label : "Sin datos";
      const fechaTxt = um
        ? (um.esAnoche ? "mínima de anoche" : `mínima del ${fmtFecha(um.fecha)} (último dato AEMET)`)
        : "sin dato reciente de AEMET";

      const clase = v => (v === null || v === undefined) ? "" : (v > 0 ? "warm" : "cool");

      return `
        <div class="card">
          <h2>${city.nombre}</h2>
          <div class="place">${city.ccaa}</div>

          <div class="now">
            <span class="dot" style="background:${color}"></span>
            <span class="t">${um ? fmtTemp(um.tmin) : "—"}</span>
            <span class="lbl">${etiqueta}<br>${fechaTxt}</span>
          </div>

          <div class="section">📅 ${data.mes_actual} ${data.anyo_actual}</div>
          <div class="row"><span>Media de mínimas</span><strong>${fmtTemp(city.media_min_mes)}</strong></div>
          <div class="row"><span>Media de máximas</span><strong>${fmtTemp(city.media_max_mes)}</strong></div>
          <div class="row"><span>🌙 Noches tropicales (mes)</span><strong>${city.nt_mes ?? 0}</strong></div>
          <div class="row"><span>🌙 Noches tropicales (año)</span><strong>${city.nt_anyo ?? 0}</strong></div>

          <div class="section">📆 Comparado con ${data.mes_anterior_ref}</div>
          <div class="row"><span>Mínimas año anterior</span><strong>${fmtTemp(city.media_min_mes_ant)}</strong></div>
          <div class="row"><span>Máximas año anterior</span><strong>${fmtTemp(city.media_max_mes_ant)}</strong></div>
          <div class="row"><span>Diferencia mínimas</span><strong class="${clase(city.diff_min_vs_ant)}">${fmtDelta(city.diff_min_vs_ant)}</strong></div>
          <div class="row"><span>Diferencia máximas</span><strong class="${clase(city.diff_max_vs_ant)}">${fmtDelta(city.diff_max_vs_ant)}</strong></div>
        </div>
      `;
    }

    function pintaLeyenda() {
      const cont = document.getElementById("pills");
      cont.innerHTML = NIVELES.map(n =>
        `<span class="pill" title="${n.sub}"><span class="dot" style="background:${n.color}"></span>${n.label} ${n.sub.replace("menos de ", "&lt;")}</span>`
      ).join("") +
      `<span class="pill"><span class="dot" style="background:${SIN_DATOS}"></span>Sin datos</span>`;
    }

    async function init() {
      pintaLeyenda();

      const resp = await fetch(DATA_URL, { cache: "no-store" });
      if (!resp.ok) throw new Error("No se pudo cargar " + DATA_URL);
      const data = await resp.json();

      const VISTAS = {
        peninsula: { center: [39.95, -3.6], zoom: 6 },
        canarias:  { center: [28.4, -15.8], zoom: 7 }
      };

      const map = L.map("map", {
        scrollWheelZoom: false,
        zoomControl: true,
        ...{ center: VISTAS.peninsula.center, zoom: VISTAS.peninsula.zoom }
      });

      L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}", {
        maxZoom: 16,
        attribution: "&copy; Esri · Datos: AEMET"
      }).addTo(map);

      // Conmutador Península / Canarias
      const Switch = L.Control.extend({
        options: { position: "topleft" },
        onAdd() {
          const div = L.DomUtil.create("div", "view-switch");
          div.innerHTML = `
            <button data-v="peninsula" class="active">Península</button>
            <button data-v="canarias">Canarias</button>`;
          L.DomEvent.disableClickPropagation(div);
          div.addEventListener("click", e => {
            const b = e.target.closest("button");
            if (!b) return;
            div.querySelectorAll("button").forEach(x => x.classList.toggle("active", x === b));
            const v = VISTAS[b.dataset.v];
            map.flyTo(v.center, v.zoom, { duration: 0.8 });
          });
          return div;
        }
      });
      map.addControl(new Switch());

      let conDato = 0, deAnoche = 0, fechaMasReciente = "";

      data.ciudades.forEach(city => {
        if (typeof city.lat !== "number" || typeof city.lon !== "number") return;

        const um = ultimaMin(city);
        const nivel = um ? nivelDe(um.tmin) : null;
        const color = nivel ? nivel.color : SIN_DATOS;

        if (um) {
          conDato++;
          if (um.esAnoche) deAnoche++;
          if (um.fecha > fechaMasReciente) fechaMasReciente = um.fecha;
        }

        const marker = L.circleMarker([city.lat, city.lon], {
          radius: radio(city),
          color: "rgba(255,255,255,0.7)",
          weight: 1.2,
          fillColor: color,
          fillOpacity: um ? 0.88 : 0.45
        }).addTo(map);

        marker.bindTooltip(city.nombre, {
          className: "city-label",
          direction: "bottom",
          permanent: true,
          offset: [0, 8]
        });

        marker.bindPopup(popupHtml(city, data, um), {
          closeButton: true,
          autoPanPadding: [24, 24]
        });
      });

      const fuente = deAnoche
        ? `<span><strong>${deAnoche}</strong> ciudades con dato de anoche</span>`
        : `<span>Mínimas más recientes: <strong>${fmtFecha(fechaMasReciente)}</strong> (AEMET publica con unos días de retraso)</span>`;

      document.getElementById("meta").innerHTML =
        `${fuente}<span>Actualizado: <strong>${data.fecha_legible}</strong></span><span>Fuente: ${data.fuente}</span>`;
    }

    init().catch(err => {
      document.getElementById("meta").textContent = "Error cargando datos: " + err.message;
    });
  </script>
</body>
</html>
