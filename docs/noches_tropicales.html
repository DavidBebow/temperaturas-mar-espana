<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Temperaturas Nocturnas en España</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    :root {
      color-scheme: dark;
      --bg: #061019;
      --panel: #06121a;
      --ink: #e7f4ff;
      --muted: #7faac6;
      --line: rgba(116, 169, 200, 0.3);
    }

    * { box-sizing: border-box; }

    html, body {
      height: 100%;
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .wrap {
      min-height: 100%;
      display: grid;
      grid-template-rows: auto 1fr;
      background: var(--bg);
    }

    header {
      background: var(--panel);
      border-bottom: 1px solid var(--line);
      padding: 10px 12px 7px;
    }

    .topbar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 18px;
    }

    h1 {
      margin: 0;
      color: #eef8ff;
      font-size: 14px;
      line-height: 1.2;
      font-weight: 760;
      white-space: nowrap;
    }

    .version {
      color: #7faac6;
      font-weight: 650;
    }

    .meta-block {
      text-align: right;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.35;
    }

    .highlight {
      color: #ffc938;
      font-weight: 800;
    }

    .legend-bar {
      margin-top: 9px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      overflow-x: auto;
      color: #9fc5dc;
      font-size: 11px;
      scrollbar-width: thin;
    }

    .legend-left,
    .legend-right {
      display: flex;
      align-items: center;
      gap: 11px;
      white-space: nowrap;
    }

    .legend-left strong {
      color: #d9edf8;
      font-weight: 650;
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.32);
      flex: 0 0 auto;
    }

    #map {
      height: calc(100vh - 80px);
      min-height: 520px;
      width: 100%;
      background: #20242a;
    }

    .city-marker {
      display: flex;
      align-items: center;
      justify-content: center;
      width: var(--size);
      height: var(--size);
      border-radius: 999px;
      border: 1.5px solid rgba(255, 255, 255, 0.62);
      background: var(--marker-color);
      color: #fff;
      box-shadow:
        0 2px 8px rgba(0, 0, 0, 0.4),
        inset 0 1px 6px rgba(255, 255, 255, 0.28);
      font-size: var(--font-size);
      font-weight: 850;
      line-height: 1;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.75);
      opacity: var(--marker-opacity);
    }

    .city-marker.no-data {
      color: rgba(255, 255, 255, 0.78);
    }

    .leaflet-tooltip.city-label {
      background: transparent;
      border: 0;
      box-shadow: none;
      color: #ffffff;
      font-size: 10px;
      font-weight: 850;
      text-shadow: 0 1px 2px #000, 0 0 5px #000;
    }

    .leaflet-popup-content-wrapper {
      padding: 0;
      border-radius: 10px;
      background: #071b2e;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.42);
    }

    .leaflet-popup-content {
      margin: 0;
    }

    .leaflet-popup-tip {
      background: #071b2e;
    }

    .leaflet-popup-close-button {
      display: block;
      color: #6b98b7 !important;
      font-size: 21px !important;
      padding: 7px 9px 0 0 !important;
    }

    .leaflet-popup-close-button:hover {
      color: #e7f4ff !important;
      background: transparent !important;
    }

    .city-popup {
      width: 275px;
      color: #dcefff;
      background: #071b2e;
      border-radius: 10px;
      overflow: hidden;
    }

    .popup-inner {
      padding: 14px 14px 12px;
    }

    .city-popup h2 {
      margin: 0;
      padding-right: 18px;
      color: #ffffff;
      font-size: 16px;
      line-height: 1.15;
    }

    .popup-place {
      margin-top: 3px;
      color: #75a8c8;
      font-size: 12px;
    }

    .popup-rule {
      width: 24px;
      height: 2px;
      margin: 25px 0 12px;
      background: rgba(220, 239, 255, 0.8);
    }

    .popup-current {
      margin-bottom: 12px;
      color: #a9c6da;
      font-size: 12px;
    }

    .section-title {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid rgba(130, 174, 205, 0.14);
      color: #5f91b4;
      font-size: 11px;
      font-weight: 850;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .row {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      padding: 5px 0;
      border-top: 1px solid rgba(130, 174, 205, 0.16);
      font-size: 13px;
    }

    .row span:first-child {
      color: #9ec3da;
    }

    .row strong {
      color: #e8f6ff;
      font-weight: 780;
      white-space: nowrap;
    }

    .attribution-note {
      color: #87abc0;
      font-size: 10px;
    }

    @media (max-width: 720px) {
      header { padding: 9px 10px 7px; }

      .topbar { display: block; }

      h1 {
        white-space: normal;
        font-size: 13px;
      }

      .meta-block {
        margin-top: 5px;
        text-align: left;
      }

      .legend-bar {
        align-items: flex-start;
        font-size: 10px;
      }

      #map { height: 540px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="topbar">
        <h1>🌙 Temperaturas Nocturnas en España <span class="version">v2 anomalías</span></h1>
        <div class="meta-block">
          <div id="top-summary">Cargando datos...</div>
          <div id="top-meta"></div>
        </div>
      </div>

      <div class="legend-bar">
        <div class="legend-left">
          <strong>Anomalía media mínimas:</strong>
          <span class="legend-item"><span class="dot" style="background:#cc2200"></span>≥ +4ºC</span>
          <span class="legend-item"><span class="dot" style="background:#ff6600"></span>+2 a +4ºC</span>
          <span class="legend-item"><span class="dot" style="background:#ffaa00"></span>+0,5 a +2ºC</span>
          <span class="legend-item"><span class="dot" style="background:#d6d6d6"></span>Normal</span>
          <span class="legend-item"><span class="dot" style="background:#44aa66"></span>-0,5 a -2ºC</span>
          <span class="legend-item"><span class="dot" style="background:#3399cc"></span>-2 a -4ºC</span>
          <span class="legend-item"><span class="dot" style="background:#0055aa"></span>≤ -4ºC</span>
        </div>
        <div class="legend-right">🌙 = noches tropicales del mes · Clic para detalle</div>
      </div>
    </header>

    <main id="map" aria-label="Mapa de temperaturas nocturnas"></main>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const DATA_URL = "temperaturas_nocturnas.json?v=" + Date.now();

    function fmtTemp(value) {
      return value === null || value === undefined ? "Sin datos" : value.toFixed(1).replace(".", ",") + "ºC";
    }

    function fmtDelta(value) {
      if (value === null || value === undefined) return "Sin datos";
      const sign = value > 0 ? "+" : "";
      return sign + value.toFixed(1).replace(".", ",") + "ºC";
    }

    function fmtNum(value) {
      return value === null || value === undefined ? "0" : String(value);
    }

    function colorAnomalia(value) {
      if (value === null || value === undefined) return "#8a8a8a";
      if (value >= 4) return "#cc2200";
      if (value >= 2) return "#ff6600";
      if (value >= 0.5) return "#ffaa00";
      if (value > -0.5) return "#d6d6d6";
      if (value > -2) return "#44aa66";
      if (value > -4) return "#3399cc";
      return "#0055aa";
    }

    function markerSize(city) {
      const tropicales = city.nt_mes || 0;
      return Math.max(34, Math.min(58, 34 + tropicales * 2.2));
    }

    function markerText(city) {
      if (city.diff_min_vs_ant !== null && city.diff_min_vs_ant !== undefined) {
        const sign = city.diff_min_vs_ant > 0 ? "+" : "";
        return sign + city.diff_min_vs_ant.toFixed(1).replace(".", ",");
      }

      if (city.t_min_anoche !== null && city.t_min_anoche !== undefined) {
        return city.t_min_anoche.toFixed(1).replace(".", ",");
      }

      return "—";
    }

    function popupHtml(city, data) {
      const nightLine = city.t_min_anoche === null || city.t_min_anoche === undefined
        ? "Sin datos · mínima de anoche"
        : `${fmtTemp(city.t_min_anoche)} · mínima de anoche`;

      return `
        <div class="city-popup">
          <div class="popup-inner">
            <h2>🌙 ${city.nombre}</h2>
            <div class="popup-place">${city.nombre}</div>
            <div class="popup-rule"></div>
            <div class="popup-current">${nightLine}</div>

            <div class="section-title">📅 ${data.mes_actual}</div>
            <div class="row"><span>Media mínimas</span><strong>${fmtTemp(city.media_min_mes)}</strong></div>
            <div class="row"><span>Media máximas</span><strong>${fmtTemp(city.media_max_mes)}</strong></div>
            <div class="row"><span>🌙 Noches tropicales mes</span><strong>${fmtNum(city.nt_mes)}</strong></div>
            <div class="row"><span>🌙 Noches tropicales año</span><strong>${fmtNum(city.nt_anyo)}</strong></div>

            <div class="section-title">📆 vs ${data.mes_anterior_ref}</div>
            <div class="row"><span>Media mínimas año ant.</span><strong>${fmtTemp(city.media_min_mes_ant)}</strong></div>
            <div class="row"><span>Media máximas año ant.</span><strong>${fmtTemp(city.media_max_mes_ant)}</strong></div>
            <div class="row"><span>Diferencia mínimas</span><strong>${fmtDelta(city.diff_min_vs_ant)}</strong></div>
            <div class="row"><span>Diferencia máximas</span><strong>${fmtDelta(city.diff_max_vs_ant)}</strong></div>
          </div>
        </div>
      `;
    }

    function setHeader(data) {
      const withNight = data.ciudades.filter(c => c.t_min_anoche !== null && c.t_min_anoche !== undefined);
      const hottest = withNight.slice().sort((a, b) => b.t_min_anoche - a.t_min_anoche)[0];
      const tropicalTotal = data.ciudades.reduce((sum, city) => sum + (city.nt_mes || 0), 0);

      document.getElementById("top-summary").innerHTML = hottest
        ? `Más cálida anoche: <span class="highlight">${hottest.nombre} ${fmtTemp(hottest.t_min_anoche)}</span> · ${tropicalTotal} noches tropicales acumuladas este mes`
        : "Sin datos disponibles";

      document.getElementById("top-meta").textContent =
        `Actualizado: ${data.fecha_legible} · Fuente: ${data.fuente}`;
    }

    function addCityMarker(map, city, data, bounds) {
      if (typeof city.lat !== "number" || typeof city.lon !== "number") return;

      const size = markerSize(city);
      const color = colorAnomalia(city.diff_min_vs_ant);

      const icon = L.divIcon({
        className: "",
        iconSize: [size, size],
        iconAnchor: [size / 2, size / 2],
        popupAnchor: [0, -size / 2],
        html: `<div class="city-marker ${city.diff_min_vs_ant === null || city.diff_min_vs_ant === undefined ? "no-data" : ""}" style="--size:${size}px;--marker-color:${color};--marker-opacity:${city.diff_min_vs_ant === null || city.diff_min_vs_ant === undefined ? 0.62 : 0.9};--font-size:${size > 48 ? 12 : 11}px">${markerText(city)}</div>`
      });

      const marker = L.marker([city.lat, city.lon], { icon }).addTo(map);

      marker.bindTooltip(city.nombre, {
        className: "city-label",
        direction: "bottom",
        permanent: true,
        offset: [0, Math.round(size / 2) - 1]
      });

      marker.bindPopup(popupHtml(city, data));
      bounds.push([city.lat, city.lon]);
    }

    async function init() {
      const response = await fetch(DATA_URL, { cache: "no-store" });
      if (!response.ok) throw new Error("No se pudo cargar " + DATA_URL);

      const data = await response.json();
      setHeader(data);

      const map = L.map("map", {
        scrollWheelZoom: true,
        zoomControl: true
      }).setView([39.7, -3.6], 6);

      L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png", {
        maxZoom: 18,
        attribution: '<span class="attribution-note">Datos: AEMET · &copy; OpenStreetMap &copy; CARTO</span>'
      }).addTo(map);

      const bounds = [];
      data.ciudades.forEach(city => addCityMarker(map, city, data, bounds));

      if (bounds.length) {
        map.fitBounds(bounds, { padding: [22, 22] });
      }
    }

    init().catch(error => {
      document.getElementById("top-summary").textContent = "Error cargando datos";
      document.getElementById("top-meta").textContent = error.message;
    });
  </script>
</body>
</html>
