<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Muertes atribuibles al calor en España — datos MoMo</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{font-family:'DM Sans',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:#f7f8fa;color:#1b2a3a;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  #wrap{max-width:1080px;margin:0 auto;padding:16px 14px 22px}

  #titulo{text-align:center;margin-bottom:14px}
  #titulo .t{font-size:17px;font-weight:700;letter-spacing:-.01em}
  #titulo .t b{color:#cc4400}
  #titulo .s{font-size:11.5px;color:#6a7686;margin-top:2px}

  #tabs{display:flex;gap:6px;justify-content:center;margin:0 auto 16px;width:max-content;
    background:rgba(255,255,255,.9);border:1px solid #e2e6ec;border-radius:999px;padding:4px;
    box-shadow:0 6px 20px rgba(20,30,50,.1)}
  .tab{border:0;background:transparent;color:#5a6676;border-radius:999px;padding:6px 14px;
    font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap}
  .tab.on{background:#cc4400;color:#fff}
  .tab:hover:not(.on){color:#cc4400}

  .grid{display:grid;grid-template-columns:290px 1fr;gap:14px;align-items:start}
  .card{background:rgba(255,255,255,.96);border:1px solid #e2e6ec;border-radius:16px;
    padding:16px 18px;box-shadow:0 10px 34px rgba(20,30,50,.09)}
  .eyebrow{font-size:10px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:#cc4400;margin-bottom:8px}
  .big{font-size:46px;font-weight:700;color:#a12f00;letter-spacing:-.03em;line-height:1}
  .big small{display:block;font-size:12px;font-weight:500;color:#6a7686;margin-top:9px;letter-spacing:0;line-height:1.5}
  .card h4{font-size:12.5px;font-weight:700;margin-bottom:4px}
  .card p{font-size:12px;color:#5a6676;line-height:1.55;margin-top:8px}

  .mini{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
  .mini.tres{grid-template-columns:repeat(3,1fr);gap:8px}
  .mini.tres div{padding:10px 9px}
  .mini.tres .n{font-size:17px}
  .mini.tres .l{font-size:9.5px}
  .mini .destacado{background:#fff1e6;border-color:#f0cfb4}
  .mini div{background:#fbf6f0;border:1px solid #f0e6da;border-radius:12px;padding:11px 12px}
  .mini .n{font-size:20px;font-weight:700;color:#a12f00;letter-spacing:-.02em;line-height:1}
  .mini .l{font-size:10.5px;color:#6a7686;margin-top:5px;line-height:1.4}

  #chart{width:100%;height:290px;display:block}
  #chart text{fill:#9aa6b6;font-size:10px;font-family:inherit}
  #chart text.val{fill:#5a6676;font-weight:700;font-size:10.5px}
  .barra{cursor:pointer;transition:opacity .15s}
  .barra:hover{opacity:.78}

  #leyenda{display:flex;gap:14px;align-items:center;flex-wrap:wrap;justify-content:center;
    margin-top:10px;font-size:11px;color:#5a6676}
  #leyenda .lg{display:flex;align-items:center;gap:6px}
  #leyenda .sw{width:13px;height:13px;border-radius:4px;border:1px solid rgba(0,0,0,.08)}

  #selprov{width:100%;font-family:inherit;font-size:13.5px;font-weight:600;color:#1b2a3a;
    background:#fff;border:1px solid #e2e6ec;border-radius:10px;padding:9px 11px;margin-bottom:12px;
    cursor:pointer;-webkit-appearance:none;appearance:none;
    background-image:url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23cc4400' stroke-width='2.5'%3E%3Cpath d='M6 9l6 6 6-6'/%3E%3C/svg%3E");
    background-repeat:no-repeat;background-position:right 9px center;background-size:15px;padding-right:30px}
  #selprov:focus{outline:none;border-color:#cc4400}
  .aviso{background:#fbf6f0;border:1px solid #f0e6da;border-radius:10px;padding:10px 12px;
    font-size:11.5px;color:#6a7686;line-height:1.5;margin-top:10px}

  .rank{list-style:none;margin-top:6px}
  .rank li{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:#5a6676;
    padding:5px 0;border-bottom:1px solid #eef1f5}
  .rank li:last-child{border-bottom:none}
  .rank li b{color:#a12f00;font-weight:700}

  #pie{text-align:center;font-size:10.5px;color:#9aa6b6;margin-top:14px;line-height:1.6}
  #pie a{color:#cc4400;text-decoration:none}
  #pie a:hover{text-decoration:underline}

  @media(max-width:780px){
    .grid{grid-template-columns:1fr}
    .big{font-size:38px}
    #chart{height:240px}
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="titulo">
    <div class="t">Observatorio climático · <b>Muertes atribuibles al calor</b></div>
    <div class="s" id="subtitulo">Estimación diaria del sistema MoMo · Instituto de Salud Carlos III</div>
  </div>

  <div id="tabs">
    <button class="tab on" data-view="dias">Día a día</button>
    <button class="tab" data-view="provincia">Por provincia</button>
    <button class="tab" data-view="anios">Comparar años</button>
    <button class="tab" data-view="meses">Mes a mes</button>
    <button class="tab" data-view="contexto">La serie larga</button>
  </div>

  <div class="grid">
    <div class="card" id="resumen"></div>
    <div class="card">
      <div class="eyebrow" id="chart-title">Defunciones atribuibles a la temperatura</div>
      <svg id="chart" viewBox="0 0 720 290" preserveAspectRatio="xMidYMid meet"></svg>
      <div id="leyenda"></div>
    </div>
  </div>

  <div id="pie"></div>
</div>

<script>
const JSON_URL = 'https://davidbebow.github.io/temperaturas-mar-espana/calor_mortalidad.json';

/* Copia de seguridad: si el JSON no carga, la pagina NUNCA sale vacia.
   Datos reales consultados en el panel MoMo el 14/08/2026. */
const PREVIEW = {
  "actualizado":"2026-08-17",
  "fuente":"MoMo · Centro Nacional de Epidemiología · Instituto de Salud Carlos III",
  "verano_actual":{"anio":2026,"a_fecha":"2026-08-16","desde":"2026-06-01","atribuibles_calor":4178,"parcial":true},
  /* Serie diaria real del verano de 2026, leida del panel MoMo el 17/08/2026.
     Un valor por dia desde el 1 de junio. Validada: junio 939, julio 2.025. */
  "dias_compacto":{"desde":"2026-06-01","valores":[
    15,12,12,9,4,3,2,2,1,0,0,1,4,15,16,16,15,15,14,13,14,38,68,100,113,106,97,88,78,68,
    51,36,35,36,44,64,94,118,134,142,129,115,102,83,65,56,45,42,40,39,43,47,48,49,50,54,
    48,45,51,57,63,60,59,65,68,64,67,61,65,76,80,76,73,79,101,115,105]},
  "meses":[
    {"mes":"2025-08","atribuibles":1088,"signo":"calor"},
    {"mes":"2025-09","atribuibles":173,"signo":"calor"},
    {"mes":"2025-10","atribuibles":11,"signo":"frio"},
    {"mes":"2025-11","atribuibles":137,"signo":"frio"},
    {"mes":"2025-12","atribuibles":278,"signo":"frio"},
    {"mes":"2026-01","atribuibles":909,"signo":"frio"},
    {"mes":"2026-02","atribuibles":51,"signo":"frio"},
    {"mes":"2026-03","atribuibles":51,"signo":"frio"},
    {"mes":"2026-04","atribuibles":49,"signo":"calor"},
    {"mes":"2026-05","atribuibles":123,"signo":"calor"},
    {"mes":"2026-06","atribuibles":939,"signo":"calor"},
    {"mes":"2026-07","atribuibles":2025,"signo":"calor"},
    {"mes":"2026-08","atribuibles":1214,"signo":"calor","parcial":true}
  ],
  "doce_meses":{"observadas":452894,"base":441782,"exceso":11112,"atribuibles_temperatura":7121},
  "contexto":{"total_2015_2025":27564,"peor_anio":{"anio":2022,"atribuibles":4789},
    "riesgo_por_grado_min":9.1,"riesgo_por_grado_max":10.7},
  /* Serie historica leida verano a verano del panel MoMo el 17/08/2026, usando
     el selector de Periodo. Contraste: 2015-2025 suma 27.522 frente a las 27.564
     que publica Sanidad (0,15 % por redondeo diario) y 2022 da 4.788 frente a
     los 4.789 oficiales. */
  "comparativa_mensual":{
    "06":{"2015":168,"2016":70,"2017":999,"2018":92,"2019":202,"2020":54,"2021":40,
          "2022":827,"2023":141,"2024":30,"2025":409,"2026":939},
    "07":{"2015":1795,"2016":879,"2017":794,"2018":123,"2019":1085,"2020":574,"2021":560,
          "2022":2216,"2023":685,"2024":675,"2025":1062,"2026":2025},
    "08":{"2015":462,"2016":686,"2017":974,"2018":1307,"2019":302,"2020":838,"2021":779,
          "2022":1609,"2023":1990,"2024":1270,"2025":2184,"2026":1214},
    "09":{"2015":61,"2016":618,"2017":40,"2018":84,"2019":26,"2020":88,"2021":50,
          "2022":78,"2023":188,"2024":33,"2025":173}
  },
  "historico_anual":[
    {"anio":2015,"atribuibles_calor":2486},{"anio":2016,"atribuibles_calor":2253},
    {"anio":2017,"atribuibles_calor":2807},{"anio":2018,"atribuibles_calor":1606},
    {"anio":2019,"atribuibles_calor":1615},{"anio":2020,"atribuibles_calor":1554},
    {"anio":2021,"atribuibles_calor":1429},{"anio":2022,"atribuibles_calor":4730},
    {"anio":2023,"atribuibles_calor":3004},{"anio":2024,"atribuibles_calor":2008},
    {"anio":2025,"atribuibles_calor":3828}
  ]
};

/* ?p=murcia abre directamente la pestana provincial con esa provincia puesta.
   Es lo que permite incrustar la herramienta en /cambio-climatico-en-{slug}/.
   ?solo=1 ademas oculta las pestanas, para dejar solo la vista provincial. */
const PARAMS   = new URLSearchParams(location.search);
const PROV_URL = (PARAMS.get('p') || '').toLowerCase().trim();
const SOLO     = PARAMS.get('solo') === '1';

/* Grafias alternativas que pueden venir en la URL de una pagina de provincia */
const ALIAS_PROV = {
  'coruna':'a-coruna', 'la-coruna':'a-coruna', 'araba':'alava',
  'islas-baleares':'baleares', 'castello':'castellon', 'gerona':'girona',
  'guipuzcoa':'gipuzkoa', 'lerida':'lleida', 'rioja':'la-rioja',
  'vizcaya':'bizkaia', 'tenerife':'santa-cruz-de-tenerife'
};

let D = PREVIEW;
let provSel = ALIAS_PROV[PROV_URL] || PROV_URL || null;
let vista = provSel ? 'provincia' : 'dias';

const MESES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];

/* Punto de millar SIEMPRE. toLocaleString('es-ES') no agrupa los numeros de
   cuatro cifras (3851, 2024) y eso hacia que julio pareciera un ano. */
const nf = n => (n == null || isNaN(n))
  ? '—'
  : String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, '.');

function etiquetaMes(clave){
  const [a, m] = clave.split('-');
  return MESES[parseInt(m, 10) - 1] + ' ' + a.slice(2);
}

function etiquetaDia(clave){
  const [, m, d] = clave.split('-');
  return parseInt(d, 10) + ' ' + MESES[parseInt(m, 10) - 1];
}

const NOMBRE_MES = { '06':'Junio', '07':'Julio', '08':'Agosto', '09':'Septiembre' };

/* Comparativa por meses. Si el JSON aun no la trae calculada, se deduce de la
   serie mensual, que siempre esta: asi la pestana funciona igualmente. */
function comparativaMensual(){
  if(D.comparativa_mensual && Object.keys(D.comparativa_mensual).length) return D.comparativa_mensual;
  const out = {};
  (D.meses || []).forEach(m => {
    const mm = m.mes.slice(5, 7);
    if(!NOMBRE_MES[mm]) return;
    (out[mm] = out[mm] || {})[m.mes.slice(0, 4)] = m.atribuibles;
  });
  return out;
}

function sumaDias(fechaISO, n){
  const d = new Date(fechaISO + 'T12:00:00');
  d.setDate(d.getDate() + n);
  return d.toISOString().slice(0, 10);
}

/* ---------- Provincias ---------- */
function provincias(){ return D.provincias || {}; }

function listaProvincias(){
  return Object.keys(provincias())
    .map(s => ({ slug: s, nombre: provincias()[s].nombre || s }))
    .sort((a, b) => a.nombre.localeCompare(b.nombre, 'es'));
}

function provinciaActual(){
  const P = provincias();
  if(provSel && P[provSel]) return Object.assign({ slug: provSel }, P[provSel]);
  const l = listaProvincias();
  if(!l.length) return null;
  provSel = l[0].slug;
  return Object.assign({ slug: provSel }, P[provSel]);
}

/* Serie diaria de una provincia, expandida a pares {fecha, atribuibles} */
function diasProvincia(p){
  if(!p || !p.valores) return [];
  return p.valores.map((v, i) => ({ fecha: sumaDias(p.desde, i), atribuibles: v }));
}

/* Dias del verano en curso. Acepta las dos formas: la lista completa que
   escribe el script y la version compacta que viaja dentro de este archivo. */
function diasVerano(){
  if(D.dias && D.dias.length){
    const anio = (D.verano_actual || {}).anio;
    return D.dias
      .filter(x => x.fecha && x.fecha >= anio + '-06-01')
      .sort((a, b) => a.fecha.localeCompare(b.fecha));
  }
  const c = D.dias_compacto;
  if(c && c.valores && c.valores.length){
    return c.valores.map((v, i) => ({ fecha: sumaDias(c.desde, i), atribuibles: v }));
  }
  return [];
}

/* Fichas de ayer, semana y mes. Si el JSON no las trae hechas, se calculan
   aqui a partir de la serie diaria. */
function resumenDias(){
  if(D.resumen_dias && D.resumen_dias.ayer) return D.resumen_dias;
  const dias = diasVerano();
  if(!dias.length) return null;
  const ayerISO = sumaDias(new Date().toISOString().slice(0, 10), -1);
  const reg = [...dias].reverse().find(r => r.fecha <= ayerISO) || dias[dias.length - 1];
  const u7 = dias.slice(-7);
  const mesUlt = dias[dias.length - 1].fecha.slice(0, 7);
  const delMes = dias.filter(r => r.fecha.slice(0, 7) === mesUlt);
  return {
    ayer:   { fecha: reg.fecha, atribuibles: reg.atribuibles, es_ayer: reg.fecha === ayerISO },
    semana: { atribuibles: u7.reduce((s, r) => s + r.atribuibles, 0),
              desde: u7[0].fecha, hasta: u7[u7.length - 1].fecha, dias: u7.length },
    mes:    { mes: mesUlt, dias: delMes.length,
              atribuibles: delMes.reduce((s, r) => s + r.atribuibles, 0) }
  };
}

function fechaLarga(iso){
  if(!iso) return '';
  const [a, m, d] = iso.split('-');
  const nombres = ['enero','febrero','marzo','abril','mayo','junio','julio',
                   'agosto','septiembre','octubre','noviembre','diciembre'];
  return parseInt(d, 10) + ' de ' + nombres[parseInt(m, 10) - 1] + ' de ' + a;
}

/* ------------------------------------------------------------------ */
/* Tarjeta izquierda                                                   */
/* ------------------------------------------------------------------ */
function pintarResumen(){
  const el = document.getElementById('resumen');
  const v  = D.verano_actual || {};
  const c  = D.contexto || {};
  const dm = D.doce_meses || {};

  if(vista === 'contexto'){
    el.innerHTML =
      '<div class="eyebrow">Serie larga · 2015-2025</div>' +
      '<div class="big">' + nf(c.total_2015_2025) +
      '<small>muertes atribuibles a las altas temperaturas en España en once años, según las estimaciones de MoMo.</small></div>' +
      '<div class="mini">' +
        '<div><div class="n">' + nf(c.peor_anio && c.peor_anio.atribuibles) + '</div>' +
        '<div class="l">el peor año de la serie, ' + (c.peor_anio ? c.peor_anio.anio : '') + '</div></div>' +
        '<div><div class="n">+' + (c.riesgo_por_grado_min || '') + '%</div>' +
        '<div class="l">más riesgo de morir por cada grado por encima del umbral</div></div>' +
      '</div>' +
      '<p>El riesgo de mortalidad sube entre un ' + c.riesgo_por_grado_min + ' % y un ' +
      c.riesgo_por_grado_max + ' % por cada grado que la temperatura supera el umbral de cada zona.</p>';
    return;
  }

  if(vista === 'provincia'){
    const lista = listaProvincias();
    if(!lista.length){
      el.innerHTML =
        '<div class="eyebrow">Por provincia</div>' +
        '<p style="font-size:13px;margin-top:10px">El desglose provincial aparece en cuanto el observatorio publique los datos por provincia. Mientras tanto, la cifra nacional está en la pestaña «Día a día».</p>';
      return;
    }
    // Si la URL pidio una provincia que no esta en los datos, se dice, en vez
    // de mostrar otra distinta sin avisar.
    if(PROV_URL && !provincias()[provSel]){
      el.innerHTML =
        '<div class="eyebrow">Por provincia</div>' +
        '<p style="font-size:13px;margin-top:10px">No hay datos publicados para «' +
        PROV_URL.replace(/[<>&]/g, '') + '». Elige otra provincia en la lista.</p>' +
        '<select id="selprov" aria-label="Elegir provincia">' +
        lista.map(x => '<option value="' + x.slug + '">' + x.nombre + '</option>').join('') +
        '</select>';
      return;
    }
    const p = provinciaActual();
    const opciones = lista.map(x =>
      '<option value="' + x.slug + '"' + (x.slug === p.slug ? ' selected' : '') + '>' +
      x.nombre + '</option>').join('');
    const nac = (D.verano_actual || {}).atribuibles_calor;
    const cuota = (nac && p.verano != null) ? (p.verano / nac * 100) : null;

    el.innerHTML =
      '<div class="eyebrow">Verano de ' + ((D.verano_actual || {}).anio || '') + ' · por provincia</div>' +
      '<select id="selprov" aria-label="Elegir provincia">' + opciones + '</select>' +
      '<div class="big">' + nf(p.verano) +
      '<small>muertes atribuibles al calor en ' + p.nombre +
      ' desde el 1 de junio, según MoMo.</small></div>' +
      '<div class="mini tres">' +
        '<div class="destacado"><div class="n">' + nf(p.ayer && p.ayer.atribuibles) + '</div>' +
        '<div class="l">' + (p.ayer && p.ayer.es_ayer ? 'ayer' : ('el ' + etiquetaDia((p.ayer || {}).fecha || ''))) + '</div></div>' +
        '<div><div class="n">' + nf(p.semana) + '</div><div class="l">últimos 7 días</div></div>' +
        '<div><div class="n">' + nf(p.mes && p.mes.atribuibles) + '</div><div class="l">en lo que va de mes</div></div>' +
      '</div>' +
      (cuota != null
        ? '<p>Es el ' + cuota.toFixed(1).replace('.', ',') + ' % de las ' + nf(nac) +
          ' muertes atribuibles al calor registradas en toda España este verano.</p>'
        : '') +
      '<div class="aviso">En provincias pequeñas las cifras diarias son bajas y muy variables: conviene mirar el acumulado del verano antes que el dato de un día suelto.</div>';
    return;
  }

  if(vista === 'anios'){
    const comp = comparativaMensual();
    const anioActual = String((D.verano_actual || {}).anio);
    // Se comparan los meses ya cerrados del verano en curso contra su media
    // historica: es la lectura que responde a "¿va peor que otros anos?"
    const filas = Object.keys(comp).sort().map(mm => {
      const porAnio = comp[mm] || {};
      const actual = porAnio[anioActual];
      const previos = Object.keys(porAnio).filter(a => a !== anioActual).map(a => porAnio[a]);
      if(actual == null || !previos.length) return null;
      const media = previos.reduce((s, x) => s + x, 0) / previos.length;
      const dif = media ? Math.round((actual / media - 1) * 100) : null;
      return { mes: NOMBRE_MES[mm] || mm, actual, media: Math.round(media), dif };
    }).filter(Boolean);

    const lista = filas.map(f =>
      '<li><span>' + f.mes + '</span><b>' + nf(f.actual) +
      (f.dif == null ? '' : ' <span style="color:' + (f.dif >= 0 ? '#c0392b' : '#2e7d52') +
       ';font-weight:600">' + (f.dif >= 0 ? '+' : '') + f.dif + '%</span>') +
      '</b></li>').join('');

    // Puesto del verano en curso entre todos los de la serie.
    const totalActual = (D.verano_actual || {}).atribuibles_calor;
    const previos = (D.historico_anual || []).map(x => x.atribuibles_calor);
    const peor = previos.length ? Math.max(...previos) : null;
    const anioPeor = peor != null
      ? (D.historico_anual.find(x => x.atribuibles_calor === peor) || {}).anio : null;
    const puesto = (totalActual != null && previos.length)
      ? previos.filter(v => v > totalActual).length + 1 : null;
    const total = previos.length + 1;

    el.innerHTML =
      '<div class="eyebrow">Comparativa de veranos</div>' +
      '<div class="big">' + (puesto ? puesto + 'º' : '—') +
      '<small>verano más mortífero de los ' + total + ' de la serie, y aún no ha terminado.' +
      (peor != null ? ' El récord es ' + anioPeor + ', con ' + nf(peor) + '.' : '') +
      '</small></div>' +
      '<h4 style="margin-top:14px">' + anioActual + ' frente a la media de cada mes</h4>' +
      '<ul class="rank">' + (lista || '<li><span>Sin datos suficientes</span></li>') + '</ul>' +
      '<p>Cada grupo de barras del gráfico es un mes. La naranja es ' + anioActual +
      '; las grises, ese mismo mes en años anteriores.</p>';
    return;
  }

  if(vista === 'meses'){
    el.innerHTML =
      '<div class="eyebrow">Últimos doce meses</div>' +
      '<div class="big">' + nf(dm.atribuibles_temperatura) +
      '<small>muertes atribuibles a la temperatura, sumando el calor del verano y el frío del invierno.</small></div>' +
      '<div class="mini">' +
        '<div><div class="n">' + nf(dm.observadas) + '</div><div class="l">defunciones observadas por todas las causas</div></div>' +
        '<div><div class="n">' + nf(dm.exceso) + '</div><div class="l">exceso sobre la mortalidad esperada</div></div>' +
      '</div>' +
      '<p>MoMo separa las muertes atribuibles al <b>exceso</b> de temperatura de las atribuibles al <b>defecto</b>. En las barras naranjas manda el calor; en las azules, el frío.</p>';
    return;
  }

  const r = resumenDias();
  let mini, cola, clases;

  if(r && r.ayer){
    const etAyer = r.ayer.es_ayer ? 'ayer' : ('el ' + etiquetaDia(r.ayer.fecha));
    clases = 'mini tres';
    mini =
      '<div class="destacado"><div class="n">' + nf(r.ayer.atribuibles) + '</div>' +
      '<div class="l">' + etAyer + '</div></div>' +
      '<div><div class="n">' + nf(r.semana.atribuibles) + '</div>' +
      '<div class="l">últimos 7 días</div></div>' +
      '<div><div class="n">' + nf(r.mes.atribuibles) + '</div>' +
      '<div class="l">en lo que va de mes</div></div>';
    cola = '<p>Cada barra del gráfico es un día. Los últimos aparecen bajos porque aún se están consolidando: MoMo los revisa al alza según llegan las defunciones con retraso.</p>';
  } else {
    const meses = (D.meses || []).filter(m => m.signo === 'calor' && m.mes >= (v.anio + '-06'));
    const julio = meses.find(m => m.mes.endsWith('-07'));
    const junio = meses.find(m => m.mes.endsWith('-06'));
    clases = 'mini';
    mini =
      '<div><div class="n">' + nf(julio && julio.atribuibles) + '</div><div class="l">solo en julio, el mes más letal</div></div>' +
      '<div><div class="n">' + nf(junio && junio.atribuibles) + '</div><div class="l">en junio, con la primera ola de calor</div></div>';
    cola = '<p>Cifra a ' + fechaLarga(v.a_fecha) + '. Agosto está incompleto y MoMo lo revisa al alza a medida que llegan las defunciones con retraso.</p>';
  }

  el.innerHTML =
    '<div class="eyebrow">Verano de ' + (v.anio || '') + ' · en curso</div>' +
    '<div class="big">' + nf(v.atribuibles_calor) +
    '<small>muertes atribuibles al calor en España desde el 1 de junio, según MoMo.</small></div>' +
    '<div class="' + clases + '">' + mini + '</div>' + cola;
}

/* Comparativa por meses: un grupo de barras por mes, una barra por ano */
function pintarChartAnios(){
  const svg = document.getElementById('chart');
  const tit = document.getElementById('chart-title');
  const W = 720, H = 290, ML = 46, MR = 12, MT = 22, MB = 46;

  const comp = comparativaMensual();
  const anioActual = String((D.verano_actual || {}).anio);
  const meses = Object.keys(comp).sort();
  tit.textContent = 'Muertes atribuibles al calor en cada mes, año a año';

  if(!meses.length){
    svg.innerHTML = '<text x="360" y="145" text-anchor="middle" style="font-size:12.5px;fill:#6a7686">' +
      'La comparativa aparece cuando el observatorio recopile la serie mensual completa.</text>';
    return;
  }

  // Se muestran los ultimos anios para que las barras no se vuelvan invisibles.
  const todos = [...new Set(meses.flatMap(m => Object.keys(comp[m])))].sort();
  const anios = todos.slice(-6);
  const max = Math.max(...meses.flatMap(m => anios.map(a => comp[m][a] || 0)), 10);

  const anchoGrupo = (W - ML - MR) / meses.length;
  const anchoBarra = Math.min((anchoGrupo * 0.82) / anios.length, 26);
  const y = v => (H - MB) - (v / max) * (H - MT - MB);

  let s = '';
  for(let i = 0; i <= 4; i++){
    const v = Math.round(max / 4 * i), yy = y(v);
    s += '<line x1="' + ML + '" y1="' + yy + '" x2="' + (W - MR) + '" y2="' + yy +
         '" stroke="#eef1f5" stroke-width="1"/>' +
         '<text x="' + (ML - 8) + '" y="' + (yy + 3.5) + '" text-anchor="end">' + nf(v) + '</text>';
  }

  meses.forEach((mm, gi) => {
    const x0 = ML + anchoGrupo * gi + (anchoGrupo - anchoBarra * anios.length) / 2;
    anios.forEach((a, ai) => {
      const v = comp[mm][a];
      if(v == null) return;
      const x = x0 + anchoBarra * ai;
      const yy = y(v), h = (H - MB) - yy;
      const esActual = a === anioActual;
      // Los anios previos van en grises cada vez mas oscuros; el actual, naranja.
      const gris = ['#dfe4ea', '#d2d8e0', '#c5ccd6', '#b8c0cc', '#aab4c2'][ai % 5];
      s += '<rect class="barra" x="' + x.toFixed(1) + '" y="' + yy.toFixed(1) +
           '" width="' + (anchoBarra - 2).toFixed(1) + '" height="' + Math.max(h, 1).toFixed(1) +
           '" rx="2.5" fill="' + (esActual ? '#cc4400' : gris) + '"><title>' +
           (NOMBRE_MES[mm] || mm) + ' de ' + a + ': ' + nf(v) + ' muertes atribuibles</title></rect>';
      if(esActual && h > 16){
        s += '<text class="val" x="' + (x + (anchoBarra - 2) / 2).toFixed(1) + '" y="' + (yy - 5).toFixed(1) +
             '" text-anchor="middle">' + nf(v) + '</text>';
      }
    });
    s += '<text x="' + (ML + anchoGrupo * gi + anchoGrupo / 2).toFixed(1) + '" y="' + (H - MB + 17) +
         '" text-anchor="middle" style="font-weight:600;fill:#5a6676">' + (NOMBRE_MES[mm] || mm) + '</text>';
  });

  // Anos de referencia bajo el eje, en el mismo orden que las barras.
  s += '<text x="' + ((ML + W - MR) / 2).toFixed(1) + '" y="' + (H - MB + 34) +
       '" text-anchor="middle" style="font-size:10px">De izquierda a derecha en cada mes: ' +
       anios.join(' · ') + '</text>';

  svg.innerHTML = s;
}

function pintarChart(){
  if(vista === 'anios') return pintarChartAnios();

  const svg = document.getElementById('chart');
  const tit = document.getElementById('chart-title');
  const W = 720, H = 290, ML = 46, MR = 12, MT = 22, MB = 40;

  let datos, titulo;
  if(vista === 'contexto'){
    const h = (D.historico_anual || []).slice().sort((a, b) => a.anio - b.anio);
    datos = h.map(x => ({ etiqueta: String(x.anio), valor: x.atribuibles_calor, signo: 'calor' }));
    titulo = 'Muertes atribuibles al calor, año a año';
    if(datos.length < 2){
      tit.textContent = titulo;
      svg.innerHTML = '<text x="360" y="140" text-anchor="middle" style="font-size:12.5px;fill:#6a7686">' +
        'La serie anual completa se publica cuando el observatorio la recopila.</text>' +
        '<text x="360" y="164" text-anchor="middle" style="font-size:11.5px;fill:#9aa6b6">' +
        'Dato disponible: ' + nf((D.contexto || {}).total_2015_2025) + ' muertes entre 2015 y 2025.</text>';
      return;
    }
  } else if(vista === 'provincia'){
    const p = provinciaActual();
    const dias = diasProvincia(p);
    if(!dias.length){
      tit.textContent = 'Defunciones atribuibles al calor por provincia';
      svg.innerHTML = '<text x="360" y="145" text-anchor="middle" style="font-size:12.5px;fill:#6a7686">' +
        'El desglose provincial aparece cuando el observatorio lo publique.</text>';
      return;
    }
    const corte = dias.length - 5;
    datos = dias.map((x, i) => ({
      etiqueta: etiquetaDia(x.fecha), valor: x.atribuibles,
      signo: 'calor', parcial: i >= corte
    }));
    titulo = 'Defunciones atribuibles al calor en ' + p.nombre + ', día a día';
  } else if(vista === 'dias'){
    const dias = diasVerano();
    if(dias.length){
      const corte = dias.length - 5;   // los ultimos dias aun se estan consolidando
      datos = dias.map((x, i) => ({
        etiqueta: etiquetaDia(x.fecha), valor: x.atribuibles,
        signo: 'calor', parcial: x.parcial || i >= corte
      }));
      titulo = 'Defunciones atribuibles al calor, día a día, verano de ' + (D.verano_actual || {}).anio;
    } else {
      // Si aun no hay serie diaria, se muestra la mensual en vez de un hueco.
      datos = (D.meses || []).map(m => ({
        etiqueta: etiquetaMes(m.mes), valor: m.atribuibles, signo: m.signo, parcial: !!m.parcial
      }));
      titulo = 'Defunciones atribuibles a la temperatura, mes a mes';
    }
  } else {
    datos = (D.meses || []).map(m => ({
      etiqueta: etiquetaMes(m.mes), valor: m.atribuibles, signo: m.signo, parcial: !!m.parcial
    }));
    titulo = 'Defunciones atribuibles a la temperatura en los últimos doce meses';
  }
  tit.textContent = titulo;

  const max = Math.max(...datos.map(d => d.valor), 10);
  const paso = (W - ML - MR) / datos.length;
  const ancho = Math.min(paso * 0.62, 54);
  const escala = v => (H - MB) - (v / max) * (H - MT - MB);

  let s = '';
  /* Rejilla horizontal */
  const pasos = 4;
  for(let i = 0; i <= pasos; i++){
    const v = Math.round(max / pasos * i);
    const y = escala(v);
    s += '<line x1="' + ML + '" y1="' + y + '" x2="' + (W - MR) + '" y2="' + y +
         '" stroke="#eef1f5" stroke-width="1"/>' +
         '<text x="' + (ML - 8) + '" y="' + (y + 3.5) + '" text-anchor="end">' + nf(v) + '</text>';
  }

  // Con muchas barras (serie diaria) no caben ni los valores ni todas las fechas.
  const densa = datos.length > 20;
  const cadaN = densa ? Math.ceil(datos.length / 10) : 1;

  datos.forEach((d, i) => {
    const x = ML + paso * i + (paso - ancho) / 2;
    const y = escala(d.valor);
    const h = (H - MB) - y;
    const color = d.signo === 'frio' ? '#2a6df4' : (d.parcial ? '#e8a87c' : '#cc4400');
    s += '<rect class="barra" x="' + x.toFixed(1) + '" y="' + y.toFixed(1) +
         '" width="' + ancho.toFixed(1) + '" height="' + Math.max(h, 1).toFixed(1) +
         '" rx="' + (densa ? 1.5 : 4) + '" fill="' + color + '"><title>' + d.etiqueta + ': ' +
         nf(d.valor) + ' defunciones atribuibles</title></rect>';
    if(!densa && h > 20){
      s += '<text class="val" x="' + (x + ancho / 2).toFixed(1) + '" y="' + (y - 5).toFixed(1) +
           '" text-anchor="middle">' + nf(d.valor) + '</text>';
    }
    if(i % cadaN === 0 || i === datos.length - 1){
      s += '<text x="' + (x + ancho / 2).toFixed(1) + '" y="' + (H - MB + 16) +
           '" text-anchor="middle">' + d.etiqueta + '</text>';
    }
  });

  svg.innerHTML = s;
}

function pintarPie(){
  document.getElementById('pie').innerHTML =
    'Fuente: <b>MoMo</b> · Sistema de Monitorización de la Mortalidad Diaria, Centro Nacional de Epidemiología, ' +
    '<a href="https://momo.isciii.es/panel_momo/" target="_blank" rel="noopener">Instituto de Salud Carlos III</a>. ' +
    'Actualizado el ' + fechaLarga(D.actualizado) + '. MoMo publica a diario y este panel se refresca dos veces al día.<br>' +
    'Los últimos días aparecen más bajos de lo que acabarán siendo: las defunciones tardan en llegar a los registros civiles y MoMo revisa esas cifras al alza durante las semanas siguientes. ' +
    'El sistema estima el exceso de mortalidad atribuible a la temperatura mediante modelos estadísticos: no certifica la causa de cada defunción individual.';
}

function pintarLeyenda(){
  const el = document.getElementById('leyenda');
  const sw = (c, t) => '<span class="lg"><span class="sw" style="background:' + c + '"></span> ' + t + '</span>';
  if(vista === 'provincia'){
    el.innerHTML = sw('#cc4400', 'Atribuibles al calor') + sw('#e8a87c', 'Dato aún provisional');
  } else if(vista === 'anios'){
    el.innerHTML = sw('#cc4400', 'Verano en curso') + sw('#b8c0cc', 'Años anteriores');
  } else if(vista === 'contexto'){
    el.innerHTML = sw('#cc4400', 'Muertes atribuibles al calor, por verano');
  } else {
    el.innerHTML = sw('#cc4400', 'Atribuibles al calor') + sw('#2a6df4', 'Atribuibles al frío') +
                   sw('#e8a87c', 'Dato aún provisional');
  }
}

function pintar(){
  pintarResumen(); pintarChart(); pintarLeyenda(); pintarPie();
  // El desplegable se recrea con la tarjeta, asi que se reengancha aqui.
  const sel = document.getElementById('selprov');
  if(sel){
    sel.addEventListener('change', e => { provSel = e.target.value; pintar(); });
  }
}

function marcarPestana(){
  document.querySelectorAll('.tab').forEach(x =>
    x.classList.toggle('on', x.dataset.view === vista));
}

document.querySelectorAll('.tab').forEach(b => {
  b.addEventListener('click', () => {
    vista = b.dataset.view;
    marcarPestana();
    pintar();
  });
});

/* Incrustada en una pagina de provincia con ?solo=1: se ocultan las pestanas.
   Solo si hay datos provinciales: si aun no los hay, es preferible dejarlas
   visibles para que la herramienta siga sirviendo de algo. */
function ajustarPestanas(){
  const t = document.getElementById('tabs');
  if(!t) return;
  t.style.display = (SOLO && Object.keys(provincias()).length) ? 'none' : '';
}

marcarPestana();
ajustarPestanas();
pintar();

fetch(JSON_URL, { cache: 'no-store' })
  .then(r => r.ok ? r.json() : Promise.reject(r.status))
  /* Se fusiona: lo que traiga el JSON manda, y lo que le falte (por ejemplo la
     serie diaria, mientras el script no la publique) sale de la copia local. */
  .then(j => { if(j && j.verano_actual){ D = Object.assign({}, PREVIEW, j); ajustarPestanas(); pintar(); } })
  .catch(e => console.warn('[calor-mortalidad] se mantiene la copia local:', e));
</script>
