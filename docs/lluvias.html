<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lluvias en España — Por provincia y municipio</title>
<!-- La pagina buena es la de WordPress: este visor va en un iframe y no debe competir con ella en Google. -->
<link rel="canonical" href="https://calentamientoglobal.es/lluvias-en-espana/">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
  /* ─────────────────────────────────────────────────────────────────────────
     El mapa ocupa TODA la ventana y lo demas flota encima, como en el mapa de
     embalses. La version anterior apilaba cabecera + controles + leyenda + mapa
     en columna: entre las tres barras se comian 150 px de alto, y dentro de un
     iframe de 660 px eso dejaba a España en un hueco de medio palmo.
     ───────────────────────────────────────────────────────────────────────── */
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  body{background:#06101a;color:#dceaf6;-webkit-font-smoothing:antialiased;
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  #mapa{position:absolute;inset:0;background:#06101a;z-index:1}

  /* Cristal comun a los tres paneles flotantes. */
  .vidrio{background:rgba(8,22,36,.90);border:1px solid #1b3d5c;border-radius:16px;
    backdrop-filter:blur(14px);box-shadow:0 16px 44px rgba(0,0,0,.55)}

  /* ---------- HUD (izquierda arriba) ---------- */
  /* La altura se corta ANTES de la leyenda, que vive en la misma columna. Con
     max-height:100% la lista de provincias se metia por detras del recuadro de
     la leyenda y la quinta fila quedaba ilegible. */
  #hud{position:absolute;top:16px;left:16px;z-index:1000;width:274px;
    max-width:calc(100vw - 32px);max-height:calc(100% - 210px);
    display:flex;flex-direction:column;padding:15px 17px 6px}
  .hud-tit{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;
    letter-spacing:-.01em;color:#eaf5ff}
  .hud-tit .dot{width:9px;height:9px;border-radius:50%;background:#3fa7e8;flex:none;
    box-shadow:0 0 0 0 rgba(63,167,232,.6);animation:pulso 2.2s infinite}
  @keyframes pulso{
    0%{box-shadow:0 0 0 0 rgba(63,167,232,.55)}
    70%{box-shadow:0 0 0 9px rgba(63,167,232,0)}
    100%{box-shadow:0 0 0 0 rgba(63,167,232,0)}}
  .hud-fecha{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:#5b7d97;
    font-weight:600;margin-top:5px}
  .hud-big{font-size:38px;font-weight:800;letter-spacing:-.03em;line-height:1.04;margin:8px 0 1px}
  .hud-cap{font-size:12px;color:#7e9bb4;line-height:1.4}
  .hud-div{height:1px;background:#14314b;margin:13px 0}
  .chips{display:flex;gap:8px}
  .chips .c{flex:1;background:rgba(13,36,55,.75);border:1px solid #17395a;border-radius:11px;
    padding:8px 10px}
  .chips .c b{display:block;font-size:16px;font-weight:800;letter-spacing:-.01em;
    font-variant-numeric:tabular-nums}
  .chips .c span{display:block;margin-top:2px;font-size:10px;color:#5b7d97;line-height:1.3}
  .hud-k{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;
    color:#5cbcf0;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .hud-k button{background:none;border:0;color:#456f8e;cursor:pointer;font:inherit;
    font-size:14px;line-height:1;padding:0 0 0 6px}
  .hud-k button:hover{color:#9fbdd6}
  #panel-lista{overflow-y:auto;margin-top:2px;min-height:0}
  #hud.plegado #panel-lista{display:none}
  .pg-card{padding:8px 0;border-bottom:1px solid #102a41;cursor:pointer;display:flex;
    justify-content:space-between;align-items:baseline;gap:10px}
  .pg-card:last-child{border-bottom:0}
  .pg-card:hover .pg-zona{color:#fff;text-decoration:underline}
  .pg-zona{font-size:13px;font-weight:600;color:#dceaf6;line-height:1.3}
  .pg-prov{font-size:10.5px;color:#5b7d97;margin-top:1px}
  .pg-mm{font-size:14px;font-weight:700;white-space:nowrap;letter-spacing:-.01em;
    font-variant-numeric:tabular-nums}
  .vacio{padding:10px 0 12px;font-size:12px;color:#5b7d97;line-height:1.5}

  /* ---------- BARRA DE CONTROLES (arriba en el centro) ---------- */
  /* Centrada en el hueco que queda A LA DERECHA del HUD, no en la ventana: si se
     centra en la ventana hay que restarle el ancho del panel por los dos lados y
     la barra se queda sin sitio, parte los grupos en dos filas y deja colgando
     un separador. */
  #barra{position:absolute;top:16px;left:306px;right:16px;z-index:1000;
    display:flex;align-items:center;gap:7px;padding:8px 11px;flex-wrap:wrap;
    justify-content:center;width:auto;margin:0 auto;max-width:max-content;
    transition:right .34s cubic-bezier(.32,.72,.29,1)}
  /* Al abrirse el cajon, la barra se recentra en el hueco que queda. Si no, la
     ficha le pasa por encima y esconde los dos ultimos botones. */
  body.con-cajon #barra{right:368px}
  /* Cada grupo lleva SU separador delante y viaja con el. Sueltos, al partirse la
     barra en dos filas quedaba un separador colgando al final de la primera. */
  #barra .g{display:inline-flex;align-items:center;gap:7px}
  #barra .sep{width:1px;height:19px;background:#1b3d5c;margin:0 4px 0 1px;flex:none}
  .pill{background:rgba(13,36,55,.8);border:1px solid #1b3d5c;color:#9fbdd6;
    padding:7px 13px;border-radius:999px;font:inherit;font-size:12.5px;font-weight:600;
    cursor:pointer;white-space:nowrap;transition:background .15s,color .15s,border-color .15s}
  .pill:hover{background:#123049;color:#dceaf6}
  .pill.activo{background:#1f6ea8;border-color:#2f8fd0;color:#fff}

  /* ---------- LEYENDA (abajo a la izquierda) ---------- */
  #leyenda{position:absolute;bottom:16px;left:16px;z-index:1000;padding:11px 14px;
    max-width:min(340px,calc(100vw - 32px))}
  .ley-k{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.11em;
    color:#5b7d97;margin-bottom:7px}
  /* Dos columnas: en una sola, los siete tramos de litros hacen una leyenda de
     200 px de alto que se come la mitad de la columna izquierda. */
  #leyenda-items{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px}
  .ley-item{display:flex;align-items:center;gap:7px;font-size:11px;color:#8ea9c0;line-height:1.3}
  .ley-dot{width:13px;height:10px;border-radius:3px;flex:none;
    border:1px solid rgba(255,255,255,.14)}
  .ley-mun{grid-column:1 / -1;margin-top:5px;padding-top:7px;border-top:1px solid #14314b;
    align-items:flex-start}
  .ley-puntos{display:flex;gap:2px;flex:none;padding-top:1px}
  .ley-punto{width:9px;height:9px;border-radius:50%;border:1px solid rgba(10,28,44,.55)}

  /* ---------- CAJÓN (derecha) ---------- */
  /* Una sola ficha para las dos capas. Antes la provincia se contaba en un popup
     de Leaflet pegado al puntero y el municipio en una tarjeta de la esquina:
     dos maneras distintas de decir lo mismo en el mismo mapa. */
  #cajon{position:absolute;top:16px;right:16px;bottom:16px;z-index:1100;width:336px;
    max-width:calc(100vw - 32px);display:flex;flex-direction:column;overflow:hidden;
    transform:translateX(calc(100% + 26px));transition:transform .34s cubic-bezier(.32,.72,.29,1)}
  #cajon.abierto{transform:translateX(0)}
  .cj-cab{padding:16px 18px 12px;border-bottom:1px solid #14314b;flex:none}
  .cj-k{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:#7fa8c9;font-weight:600}
  .cj-cab h2{margin:3px 0 0;font-size:21px;font-weight:700;letter-spacing:-.02em;color:#fff;
    line-height:1.15;padding-right:26px}
  .cj-x{position:absolute;top:13px;right:14px;width:27px;height:27px;border-radius:50%;
    border:1px solid #1b3d5c;background:rgba(13,36,55,.9);color:#7fa8c9;cursor:pointer;
    font:inherit;font-size:13px;line-height:1}
  .cj-x:hover{color:#fff;background:#12304a}
  .cj-body{flex:1;overflow-y:auto;padding:14px 18px 18px}

  .cj-n{font-size:35px;font-weight:800;letter-spacing:-.03em;line-height:1}
  .cj-et{font-size:12.5px;margin-top:3px;font-weight:600}
  .cj-barra{height:8px;background:#16293a;border-radius:5px;margin:14px 0 4px;position:relative}
  .cj-barra i{display:block;height:100%;border-radius:5px}
  .cj-cien{position:absolute;top:-4px;bottom:-4px;left:50%;width:0;border-left:1px dashed #8fa8bd}
  .cj-pie{font-size:10.5px;color:#7fa8c9;margin:0 0 12px}
  .cj-fila{display:flex;justify-content:space-between;gap:12px;font-size:13px;padding:7px 0;
    border-bottom:1px solid #17324a}
  .cj-fila:last-of-type{border-bottom:0}
  .cj-fila span{color:#9db8cf}
  .cj-fila b{font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
  .cj-tres{display:flex;gap:8px;margin:13px 0 0;padding:12px 0 0;border-top:1px solid #14314b;
    text-align:center}
  .cj-tres>div{flex:1}
  .cj-tres b{display:block;font-size:13.5px;font-weight:700;color:#dceaf6;letter-spacing:-.01em;
    font-variant-numeric:tabular-nums}
  .cj-tres span{display:block;margin-top:2px;font-size:9.5px;text-transform:uppercase;
    letter-spacing:.06em;color:#456f8e}
  .cj-frase{margin:13px 0 0;font-size:13.5px;line-height:1.5;color:#cfe2f2}
  .cj-frase b{color:#fff}
  .cj-cta{display:block;margin-top:15px;padding:11px 14px;background:#1257a8;color:#fff;
    text-decoration:none;border-radius:11px;font-size:13.5px;font-weight:600;text-align:center}
  .cj-cta:hover{background:#1a6cc9}
  .cj-nota{margin-top:11px;font-size:10.5px;color:#7b93a8;line-height:1.45}

  /* ---------- ETIQUETA AL PASAR EL PUNTERO ---------- */
  /* Nombre del municipio o de la provincia bajo el puntero, con lo ultimo medido.
     Mismo cristal que los paneles para que no parezca un globo del navegador. */
  .leaflet-tooltip.tip-cg{background:rgba(8,22,36,.96);color:#dceaf6;border:1px solid #2a5577;
    border-radius:10px;padding:7px 10px;font:12px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    box-shadow:0 8px 22px rgba(0,0,0,.5);white-space:nowrap}
  .leaflet-tooltip.tip-cg b{color:#fff;font-size:13px}
  .leaflet-tooltip.tip-cg .tt-p{color:#7fa8c9;font-size:11px}
  .leaflet-tooltip.tip-cg .tt-l{display:block;margin-top:3px;color:#cfe2f2}
  .leaflet-tooltip.tip-cg .tt-s{display:block;margin-top:3px;color:#6f93b0;font-size:10.5px}
  .leaflet-tooltip-top.tip-cg:before{border-top-color:#2a5577}
  .pill.off{opacity:.35;cursor:not-allowed}
  .pill.off:hover{background:rgba(13,36,55,.8);color:#9fbdd6}
  .cj-sub{margin:16px 0 2px;padding-top:12px;border-top:1px solid #14314b;font-size:10px;
    font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#5cbcf0}
  /* La cifra de hoy, lo primero y lo mas grande (1-10-2026): la gente pulsa un
     punto para saber cuanto acaba de llover, no como va el año. */
  .cj-ahora{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#5cbcf0;margin:0 0 6px}
  .cj-n.cj-hoy{font-size:44px}
  .cj-n.cj-seco{color:#8fa6b8}
  .cj-n.cj-mojado{color:#6ec6ff}
  .cj-aviso{margin:11px 0 0;padding:9px 11px;border-left:3px solid #c98a2b;background:rgba(201,138,43,.12);
    border-radius:0 8px 8px 0;font-size:12px;line-height:1.45;color:#e8d9bf}
  .cj-aviso.cj-cerca{border-left-color:#5cbcf0;background:rgba(92,188,240,.12);color:#cfe2f2}
  .cj-aviso b{color:#fff}
  .cj-anio .cj-n{font-size:26px}
  .cj-tres.cuatro b{font-size:12.5px}

  /* ---------- CONTROLES DE LEAFLET ---------- */
  .leaflet-control-zoom{border:none !important;box-shadow:0 4px 16px rgba(0,0,0,.5) !important;
    border-radius:12px !important;overflow:hidden;margin-left:16px !important}
  .leaflet-control-zoom a{background:#0a1c2c !important;color:#9fbdd6 !important;
    border-color:#14314b !important;width:34px !important;height:34px !important;
    line-height:34px !important;font-size:18px !important}
  .leaflet-control-zoom a:hover{background:#12304a !important;color:#fff !important}
  .leaflet-bar a:first-child{border-radius:12px 12px 0 0 !important}
  .leaflet-bar a:last-child{border-radius:0 0 12px 12px !important}
  .leaflet-control-attribution{background:rgba(6,16,26,.85) !important;color:#456f8e !important;
    font-size:10px !important;border-radius:8px 0 0 0 !important;padding:2px 8px !important}
  .leaflet-control-attribution a{color:#6f9fc4 !important}
  /* Zoom y atribucion abajo a la derecha, y apartandose cuando se abre la ficha.
     En la esquina de arriba a la izquierda los botones quedaban DEBAJO del HUD,
     invisibles; y la atribucion, debajo del cajon. */
  .leaflet-bottom.leaflet-right{transition:right .34s cubic-bezier(.32,.72,.29,1)}
  body.con-cajon .leaflet-bottom.leaflet-right{right:352px}
  .leaflet-bottom.leaflet-right .leaflet-control-zoom{margin-bottom:24px !important;
    margin-right:16px !important}

  /* ---------- PANTALLAS ESTRECHAS ---------- */
  @media(max-width:900px){
    #barra{max-width:calc(100vw - 32px)}
  }
  @media(max-width:760px){
    /* En movil no caben tres paneles: manda el mapa. El HUD se queda arriba con
       lo imprescindible, la barra baja debajo, la leyenda desaparece y la ficha
       sube desde abajo como una hoja. */
    /* El HUD se queda en una franja de cabecera. Con el panel entero (cifra +
       fichas + lista de cinco) ocupaba medio movil y España caia en el hueco de
       abajo, cortada por arriba. Las fichas de comparacion se van y la lista
       arranca plegada: se despliega con el boton si se quiere. */
    #hud{width:auto;right:16px;padding:11px 14px 4px;max-height:52%}
    .hud-tit{font-size:14px}
    .hud-big{font-size:27px;margin:5px 0 0}
    .hud-cap{font-size:11.5px}
    #hud .chips,#hud .d-chips{display:none}
    #hud .hud-div{margin:9px 0}
    #panel-lista{max-height:150px}
    #barra{position:absolute;top:auto;bottom:16px;left:16px;right:16px;transform:none;
      max-width:none;justify-content:flex-start;overflow-x:auto;flex-wrap:nowrap}
    #barra .g{flex:none}
    #leyenda{display:none}
    #cajon{top:auto;left:16px;right:16px;bottom:16px;width:auto;height:64%;
      transform:translateY(calc(100% + 26px))}
    #cajon.abierto{transform:translateY(0)}
    /* Aqui la hoja tapa la barra entera: se retira mientras hay ficha abierta,
       en vez de dejarla debajo donde no se puede pulsar. */
    body.con-cajon #barra{opacity:0;pointer-events:none}
    /* Los botones de zoom chocarian con la barra de abajo; en un movil se hace
       zoom con dos dedos. */
    .leaflet-control-zoom{display:none}
    body.con-cajon .leaflet-bottom.leaflet-right{right:0}
  }
</style>
</head>
<body>

<div id="mapa"></div>

<div id="hud" class="vidrio">
  <div class="hud-tit"><span class="dot"></span>Lluvia en España</div>
  <div class="hud-fecha" id="hud-fecha">Cargando datos…</div>
  <div class="hud-big" id="hud-big">—</div>
  <div class="hud-cap" id="hud-cap">&nbsp;</div>
  <div class="hud-div d-chips"></div>
  <div class="chips">
    <div class="c"><b id="chip-a">—</b><span id="chip-a-et">lo normal</span></div>
    <div class="c"><b id="chip-b">—</b><span id="chip-b-et">por encima de lo normal</span></div>
  </div>
  <div class="hud-div"></div>
  <div class="hud-k"><span id="panel-titulo">Dónde más ha llovido</span>
    <button id="panel-cerrar" aria-label="Plegar">−</button></div>
  <div id="panel-lista"></div>
</div>

<div id="barra" class="vidrio">
  <span class="g">
    <button class="pill" data-periodo="hoy" hidden>Hoy</button>
    <button class="pill activo" data-periodo="ayer">Último día</button>
    <button class="pill" data-periodo="semana">7 días</button>
  </span>
  <span class="g">
    <i class="sep"></i>
    <button class="pill activo" id="btn-mun">Municipios</button>
  </span>
</div>

<div id="leyenda" class="vidrio">
  <div class="ley-k" id="leyenda-titulo">Precipitación</div>
  <div id="leyenda-items"></div>
</div>

<div id="cajon" class="vidrio">
  <button class="cj-x" id="cj-x">&#10005;</button>
  <div class="cj-cab">
    <div class="cj-k" id="cj-k">&mdash;</div>
    <h2 id="cj-nom">&mdash;</h2>
  </div>
  <div class="cj-body" id="cj-body"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// ─── CONFIGURACIÓN ────────────────────────────────────────────────────────────
const JSON_URL    = 'https://davidbebow.github.io/temperaturas-mar-espana/lluvias_nacional.json';
const GEOJSON_URL = 'https://raw.githubusercontent.com/codeforgermany/click_that_hood/main/public/data/spain-provinces.geojson';
const SITIO       = 'https://calentamientoglobal.es/lluvias-en-espana/';
const MUNI_URL    = 'https://davidbebow.github.io/temperaturas-mar-espana/municipios_mapa.json';
// LO ULTIMO MEDIDO: pluviometros de AEMET, cinco o mas pasadas al dia. Es la
// fuente de "Hoy", "Ultimo dia" y "7 dias". Open-Meteo sigue dando el acumulado
// del año: para los ultimos dias su "archivo" devuelve modelo (incluso el dia en
// curso, que aun no ha pasado), y el 28-9-2026 daba 34 mm en A Coruña donde el
// pluviometro midio 3,8. Si este fichero falla, el mapa vuelve a Open-Meteo.
const AEMET_URL   = 'https://davidbebow.github.io/temperaturas-mar-espana/lluvias_municipios.json';

const NOMBRE_A_ID = {
  'A Coruña':'acoruna','Alacant/Alicante':'alicante','Albacete':'albacete','Almería':'almeria',
  'Araba/Álava':'alava','Asturias':'asturias','Badajoz':'badajoz','Barcelona':'barcelona',
  'Bizkaia/Vizcaya':'vizcaya','Burgos':'burgos','Cantabria':'cantabria',
  'Castelló/Castellón':'castellon','Ceuta':'ceuta','Ciudad Real':'ciudad_real','Cuenca':'cuenca',
  'Cáceres':'caceres','Cádiz':'cadiz','Córdoba':'cordoba','Gipuzkoa/Guipúzcoa':'guipuzcoa',
  'Girona':'girona','Granada':'granada','Guadalajara':'guadalajara','Huelva':'huelva',
  'Huesca':'huesca','Illes Balears':'baleares','Jaén':'jaen','La Rioja':'rioja',
  'Las Palmas':'canarias_las_p','León':'leon','Lleida':'lleida','Lugo':'lugo','Madrid':'madrid',
  'Melilla':'melilla','Murcia':'murcia','Málaga':'malaga','Navarra':'navarra','Ourense':'ourense',
  'Palencia':'palencia','Pontevedra':'pontevedra','Salamanca':'salamanca',
  'Santa Cruz De Tenerife':'canarias_sc_tf','Segovia':'segovia','Sevilla':'sevilla','Soria':'soria',
  'Tarragona':'tarragona','Teruel':'teruel','Toledo':'toledo','Valladolid':'valladolid',
  'València/Valencia':'valencia','Zamora':'zamora','Zaragoza':'zaragoza','Ávila':'avila',
};

// Cada provincia del mapa con su ficha en el sitio. El mapa es lo que mas trafico
// tiene y hasta ahora no enlazaba a ninguna de las paginas que cuelgan de el.
const ID_A_SLUG = {"almeria":"almeria","cadiz":"cadiz","cordoba":"cordoba","granada":"granada",
"huelva":"huelva","jaen":"jaen","malaga":"malaga","sevilla":"sevilla","huesca":"huesca",
"teruel":"teruel","zaragoza":"zaragoza","asturias":"asturias","baleares":"baleares",
"canarias_las_p":"las-palmas","canarias_sc_tf":"santa-cruz-de-tenerife","cantabria":"cantabria",
"albacete":"albacete","ciudad_real":"ciudad-real","cuenca":"cuenca","guadalajara":"guadalajara",
"toledo":"toledo","avila":"avila","burgos":"burgos","leon":"leon","palencia":"palencia",
"salamanca":"salamanca","segovia":"segovia","soria":"soria","valladolid":"valladolid",
"zamora":"zamora","barcelona":"barcelona","girona":"girona","lleida":"lleida",
"tarragona":"tarragona","badajoz":"badajoz","caceres":"caceres","acoruna":"a-coruna","lugo":"lugo",
"ourense":"ourense","pontevedra":"pontevedra","rioja":"la-rioja","madrid":"madrid",
"murcia":"murcia","navarra":"navarra","alava":"alava","guipuzcoa":"gipuzkoa","vizcaya":"bizkaia",
"alicante":"alicante","castellon":"castellon","valencia":"valencia","ceuta":"ceuta",
"melilla":"melilla"};

const CAMPOS = {
  hoy:    {mm:'mm_hoy',    anom:null,                  etq:null,              media:null},
  ayer:   {mm:'mm_ayer',   anom:'anomalia_ayer_pct',   etq:'etiqueta_ayer',   media:'media_diaria_mm'},
  semana: {mm:'mm_semana', anom:'anomalia_semana_pct', etq:'etiqueta_semana', media:'media_semana_mm'},
  anual:  {mm:'mm_anual',  anom:'anomalia_anual_pct',  etq:'etiqueta_anual',  media:'media_hasta_hoy_mm'},
};

// ─── ESCALAS ──────────────────────────────────────────────────────────────────
const UMBRALES = {hoy:[0,1,3,8,15,30], ayer:[0,1,3,8,15,30], semana:[0,5,15,30,60,120], anual:[0,100,250,500,800,1200]};
const AZULES   = ['#0a1a26','#12405f','#176a95','#1f97c9','#37bde8','#6ad8f7','#a8ecff'];

function colorLitros(mm, periodo){
  if (mm === null || mm === undefined) return '#16293a';
  const u = UMBRALES[periodo] || UMBRALES.ayer;
  for (let i = u.length - 1; i >= 0; i--) if (mm >= u[i]) return AZULES[i + 1];
  return AZULES[0];
}
// Los puntos van ENCIMA de un fondo que ya es rojo, ocre o azul segun la
// provincia, asi que su escala no puede ser la de las provincias: un punto azul
// oscuro sobre una provincia azul oscura desaparece. De gris apagado (0 mm) a
// blanco (los mayores aguaceros), pasando por cian: se lee sobre cualquier fondo.
const PUNTOS = ['#2b3d4d','#5f8fb0','#4fb0e8','#39c6ff','#7fe0ff','#c2f1ff','#ffffff'];
function colorPunto(mm, periodo){
  if (mm === null || mm === undefined) return '#3a4a58';
  const u = UMBRALES[periodo] || UMBRALES.ayer;
  for (let i = u.length - 1; i >= 0; i--) if (mm >= u[i]) return PUNTOS[i + 1];
  return PUNTOS[0];
}
function colorAnomalia(p){
  if (p === null || p === undefined) return '#16293a';
  if (p < -40) return '#a02615';
  if (p < -15) return '#d2571f';
  if (p <  15) return '#8a7f3a';
  if (p <  40) return '#2b8ecd';
  return '#1257a8';
}

// ─── FORMATO ──────────────────────────────────────────────────────────────────
const nf = new Intl.NumberFormat('es-ES', {maximumFractionDigits:1});
const mmTxt = v => (v === null || v === undefined) ? '—' : nf.format(v) + ' mm';
const pctTxt = v => (v === null || v === undefined) ? '—' : (v > 0 ? '+' : '') + nf.format(v) + ' %';

// "2026-08-31" -> "31 de agosto de 2026". Se parte la cadena a mano en vez de
// pasarla por new Date(): un ISO sin hora lo interpreta el navegador como UTC y
// en España eso adelanta la fecha un dia entero durante el horario de verano.
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio',
               'agosto','septiembre','octubre','noviembre','diciembre'];
function fechaLarga(iso){
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso || ''));
  if (!m) return iso || '—';
  return Number(m[3]) + ' de ' + MESES[Number(m[2]) - 1] + ' de ' + m[1];
}
// El fichero nacional trae la fecha como "07/09/2026", no como ISO.
function fechaDeDatos(txt){
  const m = /^(\d{2})\/(\d{2})\/(\d{4})/.exec(String(txt || ''));
  return m ? fechaLarga(m[3] + '-' + m[2] + '-' + m[1]) : (txt || '—');
}

// ─── LEYENDA ──────────────────────────────────────────────────────────────────
function etiquetasLitros(periodo){
  const u = UMBRALES[periodo];
  const t = [`0 mm`, `menos de ${u[1]} mm`];
  for (let i = 1; i < u.length - 1; i++) t.push(`${u[i]}–${u[i+1]} mm`);
  t.push(`más de ${u[u.length-1]} mm`);
  return t.map((label, i) => ({color: AZULES[i], label}));
}
const LEY_ANOM = [
  {color:'#a02615', label:'Muy seco · bajo −40 %'},
  {color:'#d2571f', label:'Seco · −40 a −15 %'},
  {color:'#8a7f3a', label:'Normal · ±15 %'},
  {color:'#2b8ecd', label:'Lluvioso · +15 a +40 %'},
  {color:'#1257a8', label:'Muy lluvioso · más de +40 %'},
];
const TITULOS = {
  hoy:'Lluvia de hoy', ayer:'Lluvia del último día', semana:'Lluvia de 7 días', anual:'Acumulado del año',
};
// DOS CAPAS, DOS ESCALAS DE TIEMPO (2-10-2026). El fondo de la provincia es una
// superficie grande y quieta: cuenta lo lento, como va el año hidrologico
// frente a lo normal. El punto es lo que se pulsa y lo que se mira cuando
// llueve: cuenta lo rapido, los litros del periodo elegido (hoy, el ultimo dia,
// 7 dias). Antes era al reves y en "Hoy" salia España azul con puntos amarillos
// que no significaban lluvia de hoy. Cada capa lleva su escala fija y la
// leyenda enseña las dos, con su etiqueta: no hay dos azules que signifiquen
// cosas distintas sin decirlo.
function actualizarLeyenda(){
  document.getElementById('leyenda-titulo').textContent = 'Provincias · año hidrológico frente a lo normal · ERA5';
  let html = LEY_ANOM.map(i =>
    `<span class="ley-item"><span class="ley-dot" style="background:${i.color}"></span>${i.label}</span>`
  ).join('');
  if (munVisible && munDatos){
    const et = etiquetasLitros(periodoActual);
    const muestra = et.map((e, i) => `<span class="ley-punto" style="background:${PUNTOS[i]}"></span>`).join('');
    html += `<span class="ley-item ley-mun"><span class="ley-puntos">${muestra}</span>` +
            `<span>Municipios: ${TITULOS[periodoActual].toLowerCase()} medida por AEMET · de ${et[0].label} a ${et[et.length - 1].label}</span></span>`;
  }
  document.getElementById('leyenda-items').innerHTML = html;
}

// ─── LO ULTIMO MEDIDO (AEMET) ──────────────────────────────────────────────────
let aemet = null, aemetProv = {};
const SLUG_A_ID = Object.fromEntries(Object.entries(ID_A_SLUG).map(([k, v]) => [v, k]));
function cargarAemet(d){
  if (!d || !d.provincias) return;
  aemet = d;
  Object.values(d.provincias).forEach(a => { const id = SLUG_A_ID[a.slug]; if (id) aemetProv[id] = a; });
}
const hayHoy = () => !!(aemet && aemet.hoy_fecha);
function horaHoy(){
  if (!hayHoy()) return null;
  const hs = Object.values(aemetProv).map(a => a.hoy_h).filter(h => h !== undefined && h !== null);
  return hs.length ? Math.max(...hs) : null;
}
function horaGenerado(){
  if (!aemet || !aemet.generado) return '';
  const g = new Date(aemet.generado);
  return isNaN(g) ? '' : g.toLocaleTimeString('es-ES', {hour:'2-digit', minute:'2-digit', timeZone:'Europe/Madrid'});
}
function fechaCorta(iso){
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso || ''));
  return m ? Number(m[3]) + ' ' + MESES[Number(m[2]) - 1].slice(0, 3) : '';
}
const anomDe = (mm, media) => (mm === null || mm === undefined || !(media > 0)) ? null : Math.round((mm / media * 100 - 100) * 10) / 10;
const etiquetaDe = a => a === null ? '—' : a < -40 ? 'Muy seco' : a < -15 ? 'Seco' : a < 15 ? 'Normal' : a < 40 ? 'Lluvioso' : 'Muy lluvioso';

// Lo que vale una provincia en el periodo: {mm, anom, media, etq, fuente}.
function valor(p, periodo){
  const a = aemetProv[p.id];
  if (periodo === 'hoy'){
    const mm = (a && hayHoy() && a.hoy !== undefined) ? a.hoy : null;
    return {mm, anom:null, media:null, etq:null, fuente:'aemet'};
  }
  if ((periodo === 'ayer' || periodo === 'semana') && a && a[periodo === 'ayer' ? 'dia' : 'sem'] !== undefined){
    const mm = periodo === 'ayer' ? a.dia : a.sem;
    const media = periodo === 'ayer' ? p.media_diaria_mm : p.media_semana_mm;
    const anom = anomDe(mm, media);
    return {mm, anom, media, etq:etiquetaDe(anom), fuente:'aemet'};
  }
  const c = CAMPOS[periodo];
  return {mm:p[c.mm], anom:p[c.anom], media:p[c.media], etq:p[c.etq], fuente:'era5'};
}
function periodoTxt(periodo){
  if (periodo === 'hoy') return 'hoy, hasta las ' + horaHoy() + ' h';
  if (periodo === 'ayer') return aemet ? 'el ' + fechaCorta(aemet.fecha) : 'el último día con dato';
  if (periodo === 'semana') return 'en 7 días';
  return 'en lo que va de año';
}
function fechaHud(){
  const act = horaGenerado() ? ' · actualizado a las ' + horaGenerado() : '';
  if (periodoActual === 'hoy') return 'Hoy, ' + fechaLarga(aemet.hoy_fecha) + ', hasta las ' + horaHoy() + ' h' + act;
  if (periodoActual === 'ayer' && aemet) return fechaLarga(aemet.fecha) + ' · día completo · pluviómetros AEMET' + act;
  if (periodoActual === 'semana' && aemet) return '7 días hasta el ' + fechaLarga(aemet.fecha) + ' · pluviómetros AEMET';
  return 'Año ' + String(fechaAnual).slice(-4) + ' · reanálisis hasta el ' + fechaDeDatos(fechaAnual);
}
let fechaAnual = '';

// ─── MAPA ─────────────────────────────────────────────────────────────────────
const mapa = L.map('mapa', {center:[40.2,-3.4], zoom:6, zoomControl:false});
L.control.zoom({position:'bottomright'}).addTo(mapa);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}',
  {attribution:'© Esri · Lluvia: AEMET (pluviómetros) y Open-Meteo (ERA5) · Medias: ERA5-Land', maxZoom:12}).addTo(mapa);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}',
  {maxZoom:12, opacity:0.45}).addTo(mapa);

let datosMap = {}, capaGeojson = null, capaPorId = {};
let periodoActual = 'ayer', modoActual = 'litros';

function estilo(feature){
  const p = datosMap[NOMBRE_A_ID[feature.properties.name || feature.properties.NAME || '']];
  if (!p) return {fillColor:'#16293a', fillOpacity:.3, color:'#12304a', weight:.8, opacity:.5};
  // Siempre el año hidrologico frente a lo normal, elija lo que elija el
  // lector arriba: los botones mueven los puntos, no el fondo.
  const color = colorAnomalia(valor(p, 'anual').anom);
  return {fillColor:color, fillOpacity:.85, color:'#0c2136', weight:.9, opacity:.8};
}

// Encuadre inicial: se ajusta a España DESCONTANDO el ancho de los paneles, para
// que la peninsula no quede debajo del HUD ni del cajon. Con un simple center +
// zoom fijo, en una pantalla ancha Galicia acababa tapada por el panel izquierdo.
const ESPANA = L.latLngBounds([[35.6,-9.6],[43.9,4.5]]);
// Una vez que el lector mueve el mapa, ya no se le reencuadra por su cuenta.
// El encuadre automatico solo sirve al arrancar y cuando cambia el tamaño.
let programatico = false, usuarioMovio = false;
function encuadrar(){
  // SE MIDE EL CONTENEDOR, NO LA VENTANA, y si todavia no tiene tamaño no se
  // toca el mapa. Un iframe con loading="lazy" existe en el DOM antes de tener
  // altura: encuadrar en ese momento le da a Leaflet un lienzo de cero pixeles,
  // el zoom sale invalido y el mapa se queda EN BLANCO para siempre, porque ya
  // no vuelve a haber ningun cambio de tamaño que lo rescate. Es exactamente lo
  // que paso al publicarlo la primera vez dentro de la pagina.
  const caja = document.getElementById('mapa');
  const an = caja.clientWidth, al = caja.clientHeight;
  if (an < 120 || al < 120) return false;

  const movil = an <= 760;
  // En movil los paneles no estan a los lados sino ARRIBA y ABAJO, asi que el
  // margen que hay que reservar es vertical. Con el reparto de escritorio, la
  // peninsula se metia entera debajo de la cabecera.
  //
  // Y los margenes se limitan a un tercio de la caja: si entre los dos superan
  // el ancho disponible, el hueco es negativo y vuelve a salir un zoom invalido.
  const tope  = v => Math.min(v, Math.floor(an / 3));
  const topeV = v => Math.min(v, Math.floor(al / 3));
  const izq = movil ? [tope(18), topeV(150)] : [tope(300), topeV(30)];
  const der = movil ? [tope(18), topeV(92)]  : [tope(cajonAbierto() ? 356 : 40), topeV(60)];
  programatico = true;
  mapa.fitBounds(ESPANA, {paddingTopLeft:izq, paddingBottomRight:der, animate:false});
  setTimeout(() => { programatico = false; }, 60);
  return true;
}
mapa.on('dragstart zoomstart', () => { if (!programatico) usuarioMovio = true; });

// ─── CAJÓN ────────────────────────────────────────────────────────────────────
const cajon = document.getElementById('cajon');
const cajonAbierto = () => cajon.classList.contains('abierto');
let provSel = null;   // provincia resaltada, si la ficha abierta es provincial

function cajonPinta(k, nombre, cuerpo){
  document.getElementById('cj-k').textContent = k;
  document.getElementById('cj-nom').textContent = nombre;
  document.getElementById('cj-body').innerHTML = cuerpo;
  document.getElementById('cj-body').scrollTop = 0;
  cajon.classList.add('abierto');
  document.body.classList.add('con-cajon');
}
function cajonCerrar(){
  cajon.classList.remove('abierto');
  document.body.classList.remove('con-cajon');
  if (munSel) { munNormal(munSel); munSel = null; }
  munSelIne = null;
  if (provSel){ capaGeojson && capaGeojson.resetStyle(provSel); provSel = null; }
}
document.getElementById('cj-x').addEventListener('click', cajonCerrar);

// ─── FICHA PROVINCIAL ─────────────────────────────────────────────────────────
function fichaProvincia(p){
  const v = valor(p, periodoActual);
  const mm = v.mm, anom = v.anom, media = v.media;
  const color = modoActual === 'anomalia' ? colorAnomalia(anom) : colorLitros(mm, periodoActual);
  const tope = {hoy:40, ayer:40, semana:150, anual:1500}[periodoActual];
  const barra = modoActual === 'anomalia'
    ? Math.min(100, Math.abs(anom || 0) * 1.5)
    : Math.min(100, ((mm || 0) / tope) * 100);
  const slug = ID_A_SLUG[p.id];
  const a = aemetProv[p.id];
  // La fila de la media necesita su propia redaccion: "Lo normal el último día
  // con dato" no se entiende. Lo que se compara es contra lo tipico de la epoca.
  const normalTxt = {ayer:'Lo normal en un día de esta época',
                     semana:'Lo normal en una semana de esta época',
                     anual:'Lo normal a estas alturas del año'}[periodoActual];
  const tres = [];
  if (hayHoy() && a && a.hoy !== undefined) tres.push([mmTxt(a.hoy), 'hoy · ' + a.hoy_h + ' h']);
  tres.push([mmTxt(valor(p, 'ayer').mm), aemet ? fechaCorta(aemet.fecha) : 'último día']);
  tres.push([mmTxt(valor(p, 'semana').mm), '7 días']);
  tres.push([mmTxt(p.mm_anual), 'del año']);
  const nota = periodoActual === 'anual'
    ? 'Acumulado del año: reanálisis ERA5 (Open-Meteo). Lo normal, ERA5-Land 1991-2020 para estas mismas fechas.'
    : (v.fuente === 'aemet'
        ? 'Media de ' + (a && a.est ? a.est + ' pluviómetros' : 'los pluviómetros') + ' de AEMET en la provincia, observación horaria' +
          (horaGenerado() ? ', actualizada a las ' + horaGenerado() : '') + '. Lo normal, ERA5-Land 1991-2020.'
        : 'Lluvia de Open-Meteo (reanálisis ERA5). Lo normal se calcula con ERA5-Land 1991-2020 para estas mismas fechas.');
  const anual = valor(p, 'anual');
  const anualTxt = `<div class="cj-fila"><span>Año hidrológico frente a lo normal</span><b style="color:${colorAnomalia(anual.anom)}">${pctTxt(anual.anom)}${anual.etq ? ' · ' + anual.etq.toLowerCase() : ''}</b></div>`;
  const maxTxt = (a && a.max && a.max.mm > 0 && periodoActual !== 'anual')
    ? `<div class="cj-fila"><span>Donde más llovió el ${fechaCorta(aemet.fecha)}</span><b>${a.max.ruta
        ? `<a href="${SITIO}${a.max.ruta}/" target="_top" style="color:#9fd4ff">${a.max.nombre}</a>` : a.max.nombre} · ${mmTxt(a.max.mm)}</b></div>` : '';
  return `
    <div class="cj-n" style="color:${color}">${modoActual === 'anomalia' ? pctTxt(anom) : mmTxt(mm)}</div>
    <div class="cj-et" style="color:${color}">${v.etq ? v.etq + ' · ' : ''}${periodoTxt(periodoActual)}</div>
    <div class="cj-barra"><i style="width:${barra}%;background:${color}"></i></div>
    <div class="cj-pie">${modoActual === 'anomalia'
      ? 'Cuánto se aleja de lo normal (la barra llena son ±67 %)'
      : 'Sobre ' + tope + ' mm, el techo de la escala en este periodo'}</div>
    <div class="cj-fila"><span>Ha caído</span><b>${mmTxt(mm)}</b></div>
    ${media !== null && media !== undefined ? `<div class="cj-fila"><span>${normalTxt}</span><b>${mmTxt(media)}</b></div>
    <div class="cj-fila"><span>Diferencia</span><b style="color:${colorAnomalia(anom)}">${pctTxt(anom)}</b></div>` : ''}
    ${maxTxt}
    ${anualTxt}
    <div class="cj-tres${tres.length > 3 ? ' cuatro' : ''}">${tres.map(([b, s]) => `<div><b>${b}</b><span>${s}</span></div>`).join('')}</div>
    ${slug ? `<a class="cj-cta" href="${SITIO}${slug}/" target="_top">Ver los municipios de ${p.nombre} →</a>` : ''}
    <div class="cj-nota">${nota}</div>`;
}

function abrirProvincia(id, encuadra){
  const p = datosMap[id];
  if (!p) return;
  if (munSel) { munNormal(munSel); munSel = null; }
  if (provSel && capaGeojson) capaGeojson.resetStyle(provSel);
  provSel = capaPorId[id] || null;
  if (provSel) provSel.setStyle({fillOpacity:.98, weight:2.2, color:'#ffd166'});
  if (encuadra && provSel) mapa.fitBounds(provSel.getBounds(), {maxZoom:8, paddingBottomRight:[340,20]});
  cajonPinta(p.ccaa, p.nombre, fichaProvincia(p));
}

// ─── HUD: la cifra nacional y la lista de extremos ────────────────────────────
// La cifra es la MEDIA DE LAS 52 PROVINCIAS, no un total ponderado por superficie
// ni por poblacion, y el pie de la cifra lo dice. Un "78 mm en España" a secas
// invitaria a leerlo como si fuera un dato oficial de la AEMET, y no lo es.
function actualizarHud(){
  const vals = Object.values(datosMap).map(p => [p, valor(p, periodoActual)]).filter(([, v]) => v.mm !== null && v.mm !== undefined);
  if (!vals.length) return;
  const media  = a => a.reduce((s,v) => s + v, 0) / a.length;
  const mmMed  = media(vals.map(([, v]) => v.mm));
  const conAnom = vals.filter(([, v]) => v.anom !== null && v.anom !== undefined);
  // La cifra nacional es lluvia total frente a normal total, no la media de los
  // porcentajes: en un dia seco, una provincia con 2 mm sobre una normal de 0,1
  // da +1.900 % y arrastraria la media de las 52 sin decir nada.
  const sumaMm = conAnom.reduce((s, [, v]) => s + v.mm, 0), sumaNormal = conAnom.reduce((s, [, v]) => s + (v.media || 0), 0);
  const anomMed = conAnom.length && sumaNormal > 0 ? Math.round((sumaMm / sumaNormal * 100 - 100) * 10) / 10 : null;
  const sobre   = conAnom.filter(([, v]) => v.anom > 0).length;
  document.getElementById('hud-fecha').textContent = fechaHud();

  const big = document.getElementById('hud-big');
  if (modoActual === 'anomalia' && periodoActual !== 'hoy'){
    big.textContent = pctTxt(anomMed);
    big.style.color = colorAnomalia(anomMed);
    document.getElementById('hud-cap').textContent =
      'frente a lo normal, en el conjunto de las ' + vals.length + ' provincias';
  } else {
    big.textContent = mmTxt(mmMed);
    big.style.color = '#eaf5ff';
    document.getElementById('hud-cap').textContent = 'de media por provincia ' + periodoTxt(periodoActual);
  }
  if (periodoActual === 'hoy'){
    // Sin normal para un dia a medias: las fichas cuentan cuantas provincias
    // llevan lluvia y donde ha caido mas, que es lo que se busca cuando llueve.
    const conLluvia = vals.filter(([, v]) => v.mm >= 1).length;
    const mun = aemet && aemet.municipios ? Object.values(aemet.municipios).filter(m => m.hoy !== undefined) : [];
    const cima = mun.length ? mun.reduce((x, y) => (y.hoy > x.hoy ? y : x)) : null;
    document.getElementById('chip-a').textContent = conLluvia + ' de ' + vals.length;
    document.getElementById('chip-a-et').textContent = 'provincias con 1 mm o más';
    document.getElementById('chip-b').textContent = cima && cima.hoy > 0 ? mmTxt(cima.hoy) : '0 mm';
    document.getElementById('chip-b-et').textContent = cima && cima.hoy > 0 ? 'lo máximo: ' + cima.n : 'en ningún municipio';
  } else {
    const normal = media(vals.map(([, v]) => v.media || 0));
    document.getElementById('chip-a').textContent = mmTxt(normal);
    document.getElementById('chip-a-et').textContent = 'lo normal en estas fechas';
    document.getElementById('chip-b').textContent = sobre + ' de ' + conAnom.length;
    document.getElementById('chip-b-et').textContent = 'por encima de lo normal';
  }
}

function actualizarPanel(){
  // LA LISTA ES DE MUNICIPIOS, NO DE PROVINCIAS (2-10-2026). Con la media
  // provincial, Benicassim con 33 mm y Benicarlo con 86 no aparecian: la lista
  // decia "Castellon 59,8" y debajo Huesca con 6,7. "Donde mas esta lloviendo"
  // es una pregunta sobre sitios, y los sitios son los puntos del mapa. Las
  // provincias se quedan como pie de cada fila y en las fichas de arriba.
  //
  // Y una fila por pluviometro, no por municipio: Alzira, Sueca y Algemesi
  // beben del mismo (Polinya de Xuquer) y saldrian tres veces con 62,2 mm.
  // Se queda el primero de cada estacion y se nombra el pluviometro solo
  // cuando es uno de reserva (el suyo se ha callado).
  const titulo = periodoActual === 'hoy' ? 'Dónde más está lloviendo hoy' : 'Dónde más ha llovido';
  document.getElementById('panel-titulo').textContent = titulo;
  const provs = (munDatos && munDatos.provincias) || [];
  const filas = [];
  if (munDatos && aemet){
    const vistos = new Set();
    munDatos.municipios
      .map(f => [munValor(f), f])
      .filter(([v]) => v !== null && v !== undefined)
      .sort((a, b) => b[0] - a[0])
      .forEach(([v, f]) => {
        if (filas.length >= 5) return;
        const m = munAemet(f);
        const reserva = periodoActual === 'hoy' ? m.hoy_est : m.dia_est;   // solo si no es el suyo
        const clave = reserva || m.est || f[MUN.ine];
        if (vistos.has(clave)) return;
        vistos.add(clave);
        // El nombre de AEMET viene a veces con coletillas entre parentesis
        // ("Torreblanca Ayuntamiento (c.agraria Local)"); fuera.
        filas.push({f, v, est: reserva ? reserva.replace(/\s*\(.*?\)\s*/g, '').trim() : null});
      });
  }
  // Si en todo el pais no ha caido nada, decirlo. Una lista de cinco ceros
  // parece un fallo de carga, y no lo es: hay dias asi.
  if (!filas.length || filas.every(x => (x.v || 0) === 0)){
    document.getElementById('panel-lista').innerHTML =
      '<div class="vacio">No ha llovido en ningún municipio en este periodo. ' +
      'Pasa: en verano puede estar toda España a cero durante semanas.</div>';
    return;
  }
  document.getElementById('panel-lista').innerHTML = filas.map(({f, v, est}) => {
    const col = colorPunto(v, periodoActual);
    const pie = (provs[f[MUN.prov]] || '') + (est ? ' · pluviómetro de ' + est : '');
    return `<div class="pg-card" data-ine="${f[MUN.ine]}">
        <div><div class="pg-zona">${f[MUN.nombre]}</div><div class="pg-prov">${pie}</div></div>
        <div class="pg-mm" style="color:${col === PUNTOS[0] ? '#8fa6b8' : col}">${mmTxt(v)}</div></div>`;
  }).join('');
  document.querySelectorAll('.pg-card').forEach(el => {
    el.addEventListener('click', () => {
      const f = munDatos.municipios.find(x => x[MUN.ine] === el.dataset.ine);
      if (!f) return;
      // Se acerca al punto y se abre su ficha, con el punto resaltado como si
      // se hubiera pulsado en el mapa.
      munSelIne = f[MUN.ine];
      mapa.setView([f[MUN.lat], f[MUN.lon]], Math.max(mapa.getZoom(), 8));
      munPinta();
      abrirMunicipio(f);
    });
  });
}

function refrescar(){
  if (capaGeojson) capaGeojson.setStyle(estilo);
  if (provSel) provSel.setStyle({fillOpacity:.98, weight:2.2, color:'#ffd166'});
  actualizarLeyenda();
  actualizarHud();
  actualizarPanel();
  // El cajon abierto tiene que seguir al periodo elegido. Antes se quedaba con
  // las cifras del periodo anterior y no habia forma de saberlo.
  if (cajonAbierto() && provSel){
    const id = Object.keys(capaPorId).find(k => capaPorId[k] === provSel);
    if (id && datosMap[id]) cajonPinta(datosMap[id].ccaa, datosMap[id].nombre, fichaProvincia(datosMap[id]));
  }
  // Los puntos cambian de color con el periodo: se repintan.
  if (munDatos) munPinta();
}

// ─── CONTROLES ────────────────────────────────────────────────────────────────
function elegirPeriodo(per){
  periodoActual = per;
  document.querySelectorAll('[data-periodo]').forEach(x => x.classList.toggle('activo', x.dataset.periodo === per));
  refrescar();
}
document.querySelectorAll('[data-periodo]').forEach(b => b.addEventListener('click', () => elegirPeriodo(b.dataset.periodo)));
document.querySelectorAll('[data-modo]').forEach(b => b.addEventListener('click', () => {
  if (b.classList.contains('off')) return;
  document.querySelectorAll('[data-modo]').forEach(x => x.classList.remove('activo'));
  b.classList.add('activo'); modoActual = b.dataset.modo; refrescar();

document.getElementById('panel-cerrar').addEventListener('click', function(){
  const h = document.getElementById('hud');
  h.classList.toggle('plegado');
  this.textContent = h.classList.contains('plegado') ? '+' : '−';
});
// En movil la lista arranca plegada: la cabecera tiene que dejar sitio al mapa.
// Se recalcula al cruzar el umbral, no en cada resize, para no deshacer lo que
// el lector haya plegado o desplegado a mano.
let eraMovil = null;
function ajustarAlAncho(){
  const movil = window.innerWidth <= 760;
  if (movil === eraMovil) return;
  eraMovil = movil;
  const h = document.getElementById('hud');
  h.classList.toggle('plegado', movil);
  document.getElementById('panel-cerrar').textContent = movil ? '+' : '−';
}
ajustarAlAncho();

// ─── CAPA DE MUNICIPIOS ───────────────────────────────────────────────────────
//
// El fichero llega en arrays posicionales, no en objetos con nombre de campo.
// Ver la cabecera de mapa_municipios.py: con objetos, el fichero completo pasa
// del megabyte y medio y hay que bajarlo entero antes de pintar el primer punto.
const MUN = {ine:0, nombre:1, ruta:2, lat:3, lon:4, mm:5, mediana:6, puesto:7, de:8, prov:9};

// PANEL PROPIO, POR ENCIMA DE LAS PROVINCIAS, Y EN SVG.
//
// Dos cosas que se descubrieron probando y que conviene no deshacer:
//
// 1. Sin panel propio, Leaflet pone la capa de municipios en el mismo panel que
//    el geojson y ademas DEBAJO (z-index 100 frente a 200). Con el relleno
//    provincial al 85 % de opacidad encima, los puntos salian grises y apagados
//    por muy vivo que fuera su color, y ningun clic llegaba a ellos: el SVG de
//    las provincias se los quedaba todos.
//
// 2. La primera version usaba L.canvas, que es lo indicado para muchos puntos.
//    Pero un canvas es un RECTANGULO opaco para el raton: subido por encima de
//    las provincias, se tragaba tambien los clics en el hueco entre puntos y el
//    mapa provincial dejaba de abrir sus fichas. Un SVG no: cada circulo responde
//    al raton y el hueco entre circulos deja pasar el clic a la provincia de
//    abajo. Es la unica forma de que las dos capas convivan.
//
//    El coste es un nodo del DOM por municipio. Medido con los 8.132 del objetivo
//    final: repintar 140 ms, quince arrastres 179 ms. Se aguanta. Si algun dia
//    dejara de aguantar, la salida NO es volver al canvas (rompe la capa de
//    abajo) sino dibujar solo los municipios del encuadre visible.
mapa.createPane('municipios');
mapa.getPane('municipios').style.zIndex = 450;   // entre overlayPane (400) y shadowPane (500)
const lienzo = L.svg({padding:.3, pane:'municipios'});
let capaMun = null, munVisible = true, munDatos = null, munSel = null, munSelIne = null;

// El porcentaje se convierte a la MISMA escala de anomalia que usan las
// provincias (−40/−15/+15/+40), para que un color signifique lo mismo en las dos
// capas. Un mapa donde el mismo rojo quiere decir dos cosas distintas segun la
// capa es peor que un mapa sin colores.
const munAnom = f => f[MUN.mediana] > 0 ? (f[MUN.mm] / f[MUN.mediana]) * 100 - 100 : null;

// Mismos cinco tramos que colorAnomalia y mismos tonos, pero encendidos. Los
// colores de las provincias estan calculados para rellenar un poligono grande
// sobre un mapa oscuro; ese mismo tono en un punto de cuatro pixeles, dibujado
// ENCIMA de una provincia que ya es azul, desaparece. Lo que tiene que
// significar lo mismo en las dos capas es el TRAMO, no el valor del color.
function colorMunicipio(p){
  if (p === null || p === undefined) return '#8fa6b8';
  if (p < -40) return '#ff5233';
  if (p < -15) return '#ff9d4d';
  if (p <  15) return '#ede4b0';
  if (p <  40) return '#6ec6ff';
  return '#1e88ff';
}

function munEtiqueta(a){
  if (a === null) return '—';
  if (a < -40) return 'Muy seco';
  if (a < -15) return 'Seco';
  if (a <  15) return 'Normal';
  if (a <  40) return 'Lluvioso';
  return 'Muy lluvioso';
}
// EL PUESTO 1 ES EL AÑO MAS HUMEDO, no el mas seco. Comprobado contra los datos:
// las celdas con puesto 1-5 van al 144 % de su mediana y las de puesto 41-45 al
// 83 %. La primera version de esta ficha decia "12.º más seco" de un municipio
// que iba al 119 % de lo normal, y esa contradiccion en la misma tarjeta fue lo
// que delato el fallo.
//
// Y se cuenta desde el extremo mas cercano: de un año en el puesto 40 de 45 se
// dice que es el 6.º mas seco, no el 40.º mas lluvioso. Es como lo diria una
// persona.
function munPuesto(puesto, de){
  const desdeSeco = de - puesto + 1;
  const cual = puesto <= de / 2
    ? '<b>' + puesto + '.º más lluvioso</b>'
    : '<b>' + desdeSeco + '.º más seco</b>';
  return 'Es el ' + cual + ' de los últimos ' + de + ' años.';
}

function munRadio(){
  const z = mapa.getZoom();
  return z <= 5 ? 3 : z <= 6 ? 3.8 : z <= 7 ? 4.8 : z <= 8 ? 6 : 7.5;
}
// El borde se adelgaza al alejarse. Con un radio de 3 px, un borde de 1,2 px se
// come mas de la mitad del punto y lo que se ve es el borde, no el color.
function munBorde(){
  const z = mapa.getZoom();
  return z <= 5 ? 0.6 : z <= 6 ? 0.8 : 1.2;
}
const munNormal = m => m.setStyle({weight: munBorde(), color: '#0a1c2c', opacity: .55});

// Lo ultimo que ha medido el pluviometro de AEMET asignado al municipio.
function munAemet(f){ return aemet && aemet.municipios ? aemet.municipios[f[MUN.ine]] : null; }
// Los litros del periodo elegido para este municipio, o null si no hay dato.
function munValor(f){
  const m = munAemet(f);
  if (!m) return null;
  if (periodoActual === 'hoy') return (hayHoy() && m.hoy !== undefined) ? m.hoy : null;
  if (periodoActual === 'ayer') return m.dia !== undefined ? m.dia : null;
  if (periodoActual === 'semana') return m.sem !== undefined ? m.sem : null;
  return null;
}
function munMedido(f){
  // LO ULTIMO MEDIDO VA LO PRIMERO Y LO MAS GRANDE. Quien pulsa un punto en una
  // tarde de tormenta quiere saber cuanto acaba de llover; "como va el año" es
  // valioso, pero va despues y mas pequeño.
  //
  // Desde el 1-10-2026 el fichero trae ademas el nombre del pluviometro (est),
  // la estacion de reserva si la asignada se ha callado (hoy_est, hoy_km,
  // est_h), la hora hasta la que va la red (corte_red) y lo maximo medido en
  // el entorno (cerca). Todo eso se cuenta aqui, porque un "0,2 mm" de un
  // pluviometro mudo desde hace tres horas no es un dato, es un silencio.
  const m = munAemet(f);
  if (!m) return `<div class="cj-ahora">Lo último medido</div>
    <div class="cj-n cj-seco">—</div>
    <div class="cj-et" style="color:#8fa6b8">Sin pluviómetro de AEMET al día para este municipio</div>`;
  let h = '';
  const avisos = [];
  const conHoy = hayHoy() && m.hoy !== undefined;
  if (conHoy){
    const mojado = m.hoy > 0;
    let et = 'en lo que va de hoy, hasta las ' + m.hoy_h + ':00';
    if (m.hoy_est) et += ' · pluviómetro de ' + m.hoy_est + ', a ' + m.hoy_km + ' km';
    h += `<div class="cj-ahora">Lo último medido</div>
      <div class="cj-n cj-hoy ${mojado ? 'cj-mojado' : 'cj-seco'}">${mmTxt(m.hoy)}</div>
      <div class="cj-et" style="color:${mojado ? '#6ec6ff' : '#8fa6b8'}">${et}</div>`;
    if (m.hoy_est){
      avisos.push(`<div class="cj-aviso">El pluviómetro de ${m.est || 'este municipio'} ${m.est_h ? 'no envía datos desde las ' + m.est_h + ':00' : 'no ha enviado ningún dato hoy'}. La cifra es la del de <b>${m.hoy_est}</b>, a ${m.hoy_km} km, que sí está al día.</div>`);
    } else if (aemet.corte_red && m.hoy_h <= aemet.corte_red - 2){
      avisos.push(`<div class="cj-aviso">El pluviómetro${m.est ? ' de ' + m.est : ''} va con retraso: su último dato es de las ${m.hoy_h}:00 y la red de AEMET ya va por las ${aemet.corte_red}:00. Puede haber llovido después.</div>`);
    }
    if (m.cerca && m.cerca.mm !== undefined){
      avisos.push(`<div class="cj-aviso cj-cerca">A ${m.cerca.km} km, el pluviómetro de ${m.cerca.est} lleva <b>${mmTxt(m.cerca.mm)}</b> hoy (hasta las ${m.cerca.h}:00). Con tormentas, la lluvia cambia mucho de un pueblo a otro.</div>`);
    }
  } else if (m.dia !== undefined){
    h += `<div class="cj-ahora">Lo último medido</div>
      <div class="cj-n cj-hoy ${m.dia > 0 ? 'cj-mojado' : 'cj-seco'}">${mmTxt(m.dia)}</div>
      <div class="cj-et" style="color:${m.dia > 0 ? '#6ec6ff' : '#8fa6b8'}">${fechaLarga(aemet.fecha)}, el último día completo</div>`;
  }
  const filas = [];
  if (conHoy && m.dia !== undefined) filas.push([fechaLarga(aemet.fecha).replace(/ de \d{4}$/, '') + (m.dia_h && m.dia_h < 24 ? ' (' + m.dia_h + ' h de 24)' : '') + (m.dia_est ? ' · ' + m.dia_est + ', ' + m.dia_km + ' km' : ''), mmTxt(m.dia)]);
  if (m.sem !== undefined) filas.push(['Últimos 7 días' + (m.sem_dias && m.sem_dias < 7 ? ' (' + m.sem_dias + ' con dato)' : ''), mmTxt(m.sem)]);
  if (m.racha !== undefined) filas.push(['Días seguidos sin llover', m.racha === 0 ? 'llovió el último día' : String(m.racha)]);
  return h + avisos.join('') +
    (filas.length ? `<div style="margin-top:10px">` + filas.map(([k, v]) => `<div class="cj-fila"><span>${k}</span><b>${v}</b></div>`).join('') + `</div>` : '') +
    `<div class="cj-nota">Pluviómetro de AEMET${m.est ? ' en ' + m.est : ''} (observación horaria)${horaGenerado() ? ', actualizado a las ' + horaGenerado() : ''}. Se mide cada hora. Es un dato medido, no la rejilla.</div>`;
}
function munTip(f){
  const provs = (munDatos && munDatos.provincias) || [];
  const m = munAemet(f);
  let l = '';
  if (m){
    const partes = [];
    if (hayHoy() && m.hoy !== undefined) partes.push('hoy ' + mmTxt(m.hoy));
    if (m.dia !== undefined) partes.push(fechaCorta(aemet.fecha) + ' ' + mmTxt(m.dia));
    if (m.sem !== undefined) partes.push('7 días ' + mmTxt(m.sem));
    l = `<span class="tt-l">${partes.join(' · ')}</span>`;
  }
  const a = munAnom(f);
  return `<b>${f[MUN.nombre]}</b> <span class="tt-p">${provs[f[MUN.prov]] || ''}</span>${l}` +
    `<span class="tt-s">Año: ${a === null ? '—' : munEtiqueta(a).toLowerCase() + ' (' + pctTxt(a) + ')'} · pulsa para ver la ficha</span>`;
}

function fichaMunicipio(f){
  // El mismo color del punto que se acaba de pulsar, no el de la escala
  // provincial: si la ficha se pintara con otro tono, el lector tendria que
  // creerse que hablan del mismo sitio.
  const a = munAnom(f), col = colorMunicipio(a);
  const pct = f[MUN.mediana] > 0 ? (f[MUN.mm] / f[MUN.mediana]) * 100 : null;
  // La barra tiene el 100 % en el centro: 200 % llena la barra entera, 0 % la
  // deja vacia. Asi el ojo compara contra lo normal y no contra un maximo
  // arbitrario, que es lo que interesa de un dato de lluvia.
  const ancho = Math.max(2, Math.min(100, (pct || 0) / 2));

  return `
    ${munMedido(f)}
    ${f[MUN.ruta]
      // Un municipio sin ficha se pinta igual, pero no se le inventa un enlace a
      // una pagina que no existe.
      ? `<a class="cj-cta" href="${SITIO}${f[MUN.ruta]}/" target="_top">Ver la ficha de ${f[MUN.nombre]} →</a>`
      : ''}
    <div class="cj-anio">
      <div class="cj-sub">Cómo va el año hidrológico</div>
      <div class="cj-n" style="color:${col}">${pct === null ? '—' : nf.format(Math.round(pct)) + ' %'}</div>
      <div class="cj-et" style="color:${col}">${munEtiqueta(a)} · ${pctTxt(a)} frente a lo normal</div>
      <div class="cj-barra"><i style="width:${ancho}%;background:${col}"></i><span class="cj-cien"></span></div>
      <div class="cj-pie">La línea marca lo normal para estas alturas del año</div>
      <div class="cj-fila"><span>Ha caído</span><b>${mmTxt(f[MUN.mm])}</b></div>
      <div class="cj-fila"><span>Lo normal a estas alturas</span><b>${mmTxt(f[MUN.mediana])}</b></div>
      <div class="cj-frase">${munPuesto(f[MUN.puesto], f[MUN.de])}</div>
      <div class="cj-nota">Acumulado del año hidrológico hasta el ${fechaLarga(munDatos.hasta)},
        comparado con la mediana de ese mismo tramo del año desde ${munDatos.desde_anio || '—'}.
        Rejilla ERA5-Land.</div>
    </div>`;
}

function abrirMunicipio(f){
  if (provSel && capaGeojson){ capaGeojson.resetStyle(provSel); provSel = null; }
  // La provincia sale de la lista del fichero, no del primer tramo de la ruta:
  // la ruta es un slug sin acentos ni barras (a-coruna, alava) y escribir
  // "a coruna" o "araba alava" en una ficha publicada es peor que no ponerla.
  const provs = munDatos.provincias || [];
  cajonPinta(provs[f[MUN.prov]] || 'España', f[MUN.nombre], fichaMunicipio(f));
}

function munPinta(){
  if (capaMun) { mapa.removeLayer(capaMun); capaMun = null; }
  if (!munVisible || !munDatos) return;
  const r = munRadio(), w = munBorde();
  // Se pintan de menos a mas lluvia, para que queden ARRIBA los casos
  // interesantes. En la costa gallega o en la Marina Alta hay municipios cada
  // pocos kilometros y a zoom bajo los circulos se solapan: sin ordenar, cual
  // queda visible lo decide el orden alfabetico del fichero, y el pueblo con
  // 40 mm puede quedar tapado por su vecino seco.
  const orden = munDatos.municipios
    .map(f => [munValor(f) ?? -1, f])
    .sort((a, b) => a[0] - b[0]);

  const marcas = orden.map(([, f]) => {
    const v = munValor(f);
    const m = L.circleMarker([f[MUN.lat], f[MUN.lon]], {
      // Borde OSCURO sobre relleno encendido: es lo que separa dos puntos que
      // se solapan. (La version anterior hacia lo contrario, borde claro sobre
      // relleno apagado, y el resultado era una nube de aros claros.)
      // Los puntos a 0 mm van un poco apagados: estan, pero no compiten con
      // los que tienen lluvia.
      renderer: lienzo, radius: r, weight: w, color: '#0a1c2c', opacity: .55,
      fillColor: colorPunto(v, periodoActual), fillOpacity: (v ?? 0) > 0 ? 1 : .7,
    });
    if (munSelIne && f[MUN.ine] === munSelIne){
      m.setStyle({weight:3, color:'#ffd166', opacity:1});
      munSel = m;
    }
    // Nombre al pasar el puntero. La etiqueta se monta al abrirse, no al pintar:
    // asi lleva lo ultimo medido aunque ese fichero llegue despues que los puntos.
    m.bindTooltip(() => munTip(f), {direction:'top', offset:[0, -r], className:'tip-cg', opacity:1});
    m.on('mouseover', () => { if (m !== munSel){ m.setStyle({weight:2, color:'#ffd166', opacity:1}); m.bringToFront(); } });
    m.on('mouseout',  () => { if (m !== munSel) munNormal(m); });
    m.on('click', e => {
      L.DomEvent.stopPropagation(e);   // que no se abra tambien la ficha provincial
      if (munSel) munNormal(munSel);
      m.setStyle({weight:3, color:'#ffd166', opacity:1});
      m.bringToFront();
      munSel = m; munSelIne = f[MUN.ine];
      abrirMunicipio(f);
    });
    return m;
  });
  capaMun = L.layerGroup(marcas).addTo(mapa);
}

mapa.on('zoomend', () => {
  if (!capaMun) return;
  const r = munRadio(), w = munBorde();
  capaMun.eachLayer(l => { l.setRadius(r); if (l !== munSel) l.setStyle({weight:w}); });
});

document.getElementById('btn-mun').addEventListener('click', function(){
  munVisible = !munVisible;
  this.classList.toggle('activo', munVisible);
  if (!munVisible && munSel) cajonCerrar();
  munPinta(); actualizarLeyenda();
});

// Se carga aparte y DESPUES del mapa provincial: si este fichero fallara o
// tardara, el mapa de siempre ya está en pantalla y funcionando.
fetch(MUNI_URL)
  .then(r => r.ok ? r.json() : Promise.reject(r.status))
  .then(d => {
    munDatos = d;
    // La lista de "donde mas llueve" es de municipios: si este fichero llega
    // despues que el de AEMET, hay que rehacerla.
    munPinta(); actualizarLeyenda(); if (aemet) actualizarPanel();
    document.getElementById('btn-mun').textContent =
      'Municipios (' + nf.format(d.municipios.length) + ')';
  })
  .catch(err => {
    console.warn('Capa de municipios no disponible:', err);
    document.getElementById('btn-mun').style.display = 'none';
  });

// ─── CARGA ────────────────────────────────────────────────────────────────────
Promise.all([
  fetch(JSON_URL + '?t=' + Date.now()).then(r => r.json()),
  fetch(GEOJSON_URL).then(r => r.json()),
  // Cache de cinco minutos: el fichero cambia cinco o mas veces al dia.
  fetch(AEMET_URL + '?t=' + Math.floor(Date.now() / 3e5)).then(r => r.ok ? r.json() : null).catch(() => null),
])
.then(([data, geojson, datosAemet]) => {
  (data.provincias || []).forEach(p => { datosMap[p.id] = p; });
  fechaAnual = data.fecha_datos || data.fecha_legible || '';
  cargarAemet(datosAemet);
  if (hayHoy()){
    document.querySelector('[data-periodo="hoy"]').hidden = false;
    document.querySelector('[data-periodo="hoy"]').textContent = 'Hoy · ' + horaHoy() + ' h';
    // Si esta lloviendo en alguna provincia, se abre en Hoy: es lo que se viene a mirar.
    if (Object.values(aemetProv).some(a => (a.hoy || 0) >= 1)) periodoActual = 'hoy';
  }
  if (!aemet){
    // Sin pluviometros el mapa sigue funcionando con el reanalisis, como antes.
    document.querySelector('[data-periodo="hoy"]').hidden = true;
  }

  // La FECHA DEL DATO, no la de la ejecucion. El archivo llega con retraso
  // variable y antes esta linea decia "ayer" un dia 7 con datos del 5.
  document.getElementById('hud-fecha').textContent =
    'España · datos hasta el ' + fechaDeDatos(data.fecha_datos || data.fecha_legible);

  capaGeojson = L.geoJSON(geojson, {
    style: estilo,
    onEachFeature: (feature, capa) => {
      const id = NOMBRE_A_ID[feature.properties.name || feature.properties.NAME || ''];
      if (!id || !datosMap[id]) return;
      capaPorId[id] = capa;
      capa.on('click', () => abrirProvincia(id, false));
      capa.bindTooltip(() => {
        const p = datosMap[id], v = valor(p, periodoActual);
        const an = valor(p, 'anual');
        return `<b>${p.nombre}</b> <span class="tt-p">${p.ccaa}</span><span class="tt-l">${mmTxt(v.mm)} ${periodoTxt(periodoActual)}</span>` +
          `<span class="tt-s">Año hidrológico: ${an.etq ? an.etq.toLowerCase() : '—'} (${pctTxt(an.anom)} frente a lo normal)</span>`;
      }, {sticky:true, direction:'top', offset:[0, -10], className:'tip-cg', opacity:1});
      capa.on('mouseover', () => { if (capa !== provSel) capa.setStyle({fillOpacity:.98, weight:1.8, color:'#5cbcf0'}); });
      capa.on('mouseout',  () => { if (capa !== provSel) capaGeojson.resetStyle(capa); });
    }
  }).addTo(mapa);

  elegirPeriodo(periodoActual);
  encuadrar();
})
.catch(err => {
  console.error(err);
  document.getElementById('hud-fecha').textContent = 'No se han podido cargar los datos';
  document.getElementById('panel-lista').innerHTML =
    '<div class="vacio">No se han podido cargar los datos. Vuelve a intentarlo en unos minutos.</div>';
});

// ─── TAMAÑO ───────────────────────────────────────────────────────────────────
//
// ESTO NO ES UN DETALLE: el mapa vive dentro de un iframe con loading="lazy" que
// nace con la altura del atributo y crece despues, cuando el CSS de la pagina lo
// estira. Leaflet mide su contenedor UNA VEZ, al crearse, y si en ese momento el
// iframe todavia no tiene su tamaño definitivo se queda pintando un mapa del
// tamaño equivocado: la primera version publicada mostraba un cuadrado gris con
// un trozo de carretera de Cuenca y ni un solo punto.
//
// Se vigila el contenedor con ResizeObserver (mas fiable dentro de un iframe que
// el resize de la ventana), se le dice a Leaflet que vuelva a medirse y se
// reencuadra, salvo que el lector ya haya movido el mapa.
let temporizador = null, ultimoTam = '';
function alCambiarTamano(){
  clearTimeout(temporizador);
  temporizador = setTimeout(() => {
    const caja = document.getElementById('mapa');
    const tam = caja.clientWidth + 'x' + caja.clientHeight;
    if (caja.clientWidth < 120 || caja.clientHeight < 120) return;  // aun sin sitio
    if (tam === ultimoTam) return;   // corta el bucle del ResizeObserver
    ultimoTam = tam;
    mapa.invalidateSize({animate:false});
    ajustarAlAncho();
    if (!usuarioMovio) encuadrar();
  }, 180);
}
window.addEventListener('resize', alCambiarTamano);
window.addEventListener('load', alCambiarTamano);
if (window.ResizeObserver) new ResizeObserver(alCambiarTamano).observe(document.getElementById('mapa'));
// Red de seguridad para el iframe perezoso: durante los primeros segundos se
// comprueba si el mapa ya tiene sitio y sigue sin encuadrar. Es barato y evita
// depender de que el navegador dispare un evento de tamaño que quiza no llegue.
let intentos = 0;
const reintento = setInterval(() => {
  if (++intentos > 20) return clearInterval(reintento);
  const caja = document.getElementById('mapa');
  if (caja.clientWidth < 120 || caja.clientHeight < 120) return;
  const tam = caja.clientWidth + 'x' + caja.clientHeight;
  if (tam === ultimoTam) return clearInterval(reintento);
  ultimoTam = tam;
  mapa.invalidateSize({animate:false});
  ajustarAlAncho();
  if (!usuarioMovio) encuadrar();
}, 500);
</script>
