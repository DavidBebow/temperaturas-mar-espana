<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Temperaturas del Mar - España</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: Arial, sans-serif; background: #f0f4f8; }
  #mapa { width: 100%; height: 530px; }

  #cabecera {
    background: #1a3a5c;
    color: white;
    padding: 10px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 6px;
  }
  #cabecera h2 { font-size: 15px; font-weight: 600; }
  #ultima-actualizacion { font-size: 11px; opacity: 0.75; }

  #leyenda {
    background: white;
    padding: 8px 16px;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    border-bottom: 1px solid #ddd;
    font-size: 11px;
  }
  .leyenda-item { display: flex; align-items: center; gap: 4px; }
  .leyenda-punto {
    width: 12px; height: 12px;
    border-radius: 50%;
    border: 1.5px solid rgba(0,0,0,0.25);
    flex-shrink: 0;
  }

  /* MARCADOR PERSONALIZADO */
  .marcador-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    cursor: pointer;
  }
  .marcador-burbuja {
    border-radius: 10px;
    border: 2px solid rgba(255,255,255,0.9);
    box-shadow: 0 2px 8px rgba(0,0,0,0.35);
    padding: 4px 7px;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-width: 64px;
    white-space: nowrap;
  }
  .marcador-nombre {
    font-size: 9px;
    font-weight: 700;
    color: rgba(255,255,255,0.95);
    text-shadow: 0 1px 2px rgba(0,0,0,0.5);
    letter-spacing: 0.2px;
    line-height: 1.2;
  }
  .marcador-temp {
    font-size: 13px;
    font-weight: 800;
    color: white;
    text-shadow: 0 1px 3px rgba(0,0,0,0.5);
    line-height: 1.2;
  }
  .marcador-fila {
    display: flex;
    gap: 5px;
    align-items: center;
    margin-top: 1px;
  }
  .marcador-anterior {
    font-size: 9px;
    color: rgba(255,255,255,0.85);
    text-shadow: 0 1px 2px rgba(0,0,0,0.4);
  }
  .marcador-anomalia {
    font-size: 9px;
    font-weight: 700;
    color: white;
    background: rgba(0,0,0,0.22);
    border-radius: 4px;
    padding: 0 3px;
    text-shadow: 0 1px 2px rgba(0,0,0,0.4);
  }
  .marcador-punta {
    width: 0; height: 0;
    border-left: 6px solid transparent;
    border-right: 6px solid transparent;
    margin-top: -1px;
  }

  /* POPUP */
  .popup-titulo { font-weight: bold; font-size: 14px; margin-bottom: 4px; color: #1a3a5c; }
  .popup-zona { font-size: 11px; color: #888; margin-bottom: 8px; }
  .popup-dato {
    display: flex; justify-content: space-between;
    padding: 4px 0; border-bottom: 1px solid #f0f0f0; font-size: 12px;
  }
  .popup-dato:last-of-type { border-bottom: none; }
  .popup-dato span:last-child { font-weight: 600; }
  .popup-anomalia-tag {
    display: inline-block; margin-top: 8px;
    padding: 3px 10px; border-radius: 12px;
    font-size: 10px; font-weight: 700; color: white;
  }
  .pos { color: #cc2200; }
  .neg { color: #0055cc; }
</style>
</head>
<body>

<div id="cabecera">
  <h2>🌊 Temperatura del Mar en España</h2>
  <span id="ultima-actualizacion">Cargando...</span>
</div>

<div id="leyenda">
  <strong>Anomalía:</strong>
  <div class="leyenda-item"><div class="leyenda-punto" style="background:#0066CC"></div> &lt; −2°C</div>
  <div class="leyenda-item"><div class="leyenda-punto" style="background:#4499DD"></div> −2 a −1°C</div>
  <div class="leyenda-item"><div class="leyenda-punto" style="background:#88BBEE"></div> −1 a −0.3°C</div>
  <div class="leyenda-item"><div class="leyenda-punto" style="background:#44AA66"></div> Normal</div>
  <div class="leyenda-item"><div class="leyenda-punto" style="background:#FFCC44"></div> +0.3 a +1°C</div>
  <div class="leyenda-item"><div class="leyenda-punto" style="background:#FF8822"></div> +1 a +2°C</div>
  <div class="leyenda-item"><div class="leyenda-punto" style="background:#CC2200"></div> &gt; +2°C</div>
  <span style="margin-left:auto;font-size:10px;color:#999">Clic en un punto para más detalles</span>
</div>

<div id="mapa"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const JSON_URL = 'https://TU_USUARIO.github.io/temperaturas-mar-espana/datos.json';

const mapa = L.map('mapa', {
  center: [39.8, -3.0],
  zoom: 5,
  zoomControl: true
});

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© OpenStreetMap | Datos: Open-Meteo Marine API',
  maxZoom: 10
}).addTo(mapa);

function signo(v) {
  if (v === null || v === undefined) return '—';
  return (v > 0 ? '+' : '') + v + '°C';
}

function crearIconoEtiqueta(punto) {
  const color = punto.color;
  const nombre = punto.nombre;
  const temp = punto.temperatura_actual !== null ? punto.temperatura_actual + '°C' : '—';
  const anterior = punto.temperatura_anio_anterior !== null ? punto.temperatura_anio_anterior + '°C' : '—';
  const anomalia = punto.anomalia !== null ? signo(punto.anomalia) : '—';
  const claseSigmno = punto.anomalia > 0 ? '+' : '';

  const html = `
    <div class="marcador-wrapper">
      <div class="marcador-burbuja" style="background:${color}">
        <div class="marcador-nombre">${nombre}</div>
        <div class="marcador-temp">${temp}</div>
        <div class="marcador-fila">
          <span class="marcador-anterior">Ant: ${anterior}</span>
          <span class="marcador-anomalia">${anomalia}</span>
        </div>
      </div>
      <div class="marcador-punta" style="border-top:8px solid ${color}"></div>
    </div>
  `;

  return L.divIcon({
    html: html,
    className: '',
    iconSize: null,
    iconAnchor: [40, 52],
    popupAnchor: [0, -55]
  });
}

function formatDif(valor) {
  if (valor === null || valor === undefined) return '—';
  const cls = valor > 0 ? 'pos' : valor < 0 ? 'neg' : '';
  return `<span class="${cls}">${signo(valor)}</span>`;
}

fetch(JSON_URL + '?t=' + Date.now())
  .then(r => r.json())
  .then(data => {
    document.getElementById('ultima-actualizacion').textContent =
      'Actualizado: ' + data.fecha_legible;

    data.puntos.forEach(p => {
      if (!p.temperatura_actual) return;

      const icono = crearIconoEtiqueta(p);

      const popup = `
        <div style="min-width:210px">
          <div class="popup-titulo">${p.nombre}</div>
          <div class="popup-zona">📍 ${p.zona}</div>
          <div class="popup-dato">
            <span>Temperatura actual</span>
            <span>${p.temperatura_actual}°C</span>
          </div>
          <div class="popup-dato">
            <span>Mismo día año anterior</span>
            <span>${p.temperatura_anio_anterior !== null ? p.temperatura_anio_anterior + '°C' : '—'}</span>
          </div>
          <div class="popup-dato">
            <span>Diferencia vs año anterior</span>
            <span>${formatDif(p.diferencia_anual)}</span>
          </div>
          <div class="popup-dato">
            <span>Media histórica del mes</span>
            <span>${p.media_historica_mes !== null ? p.media_historica_mes + '°C' : '—'}</span>
          </div>
          <div class="popup-dato">
            <span>Anomalía histórica</span>
            <span>${formatDif(p.anomalia)}</span>
          </div>
          <div>
            <span class="popup-anomalia-tag" style="background:${p.color}">
              ${p.etiqueta_anomalia}
            </span>
          </div>
        </div>
      `;

      L.marker([p.lat, p.lon], { icon: icono })
        .addTo(mapa)
        .bindPopup(popup, { maxWidth: 250 });
    });
  })
  .catch(err => {
    console.error('Error:', err);
    document.getElementById('ultima-actualizacion').textContent = 'Error al cargar datos';
  });
</script>
</body>
</html>
