<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Temperatura del mar en España por boyas · actual y predicción</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
  :root{
    --bg:#0a121c; --ink:#eaf2fb; --mut:#93a7bd; --mut2:#61748a; --line:rgba(255,255,255,.08);
    --glass:rgba(255,255,255,.05); --glass2:rgba(255,255,255,.08);
    --live:#37e0a0; --gold:#f0b429; --ember:#ff7a3c;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
  #app{position:relative;overflow:hidden;border-radius:20px;border:1px solid var(--line);
    background:radial-gradient(1000px 460px at 78% -12%,rgba(56,120,200,.12),transparent 62%),
      radial-gradient(760px 420px at 8% 116%,rgba(255,122,60,.08),transparent 58%),var(--bg)}

  /* header */
  #hd{padding:16px 20px 14px;border-bottom:1px solid var(--line)}
  #hd .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  #hd .badge{font-size:9.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;
    color:var(--live);background:rgba(55,224,160,.12);border:1px solid rgba(55,224,160,.3);
    border-radius:999px;padding:4px 10px;display:inline-flex;align-items:center;gap:6px}
  #hd .badge .dot{width:6px;height:6px;border-radius:50%;background:var(--live);animation:pulse 2.4s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
  #hd h1{font-size:18px;font-weight:700;letter-spacing:-.01em;margin-top:9px}
  #hd .sub{font-size:12.5px;color:var(--mut);margin-top:3px}
  #hd .sub b{color:var(--ink);font-weight:600}

  /* mapa */
  #wrap{position:relative}
  #mapa{width:100%;height:480px;background:#08101a}
  .leaflet-container{background:#08101a;font-family:inherit}
  .leaflet-control-zoom{border:none!important;box-shadow:none!important;margin:12px!important}
  .leaflet-control-zoom a{background:var(--glass2)!important;color:var(--ink)!important;
    border:1px solid var(--line)!important;backdrop-filter:blur(8px);width:30px;height:30px;line-height:30px}
  .leaflet-control-attribution{background:rgba(10,18,28,.72)!important;color:var(--mut2)!important;font-size:9px!important}
  .leaflet-control-attribution a{color:var(--mut)!important}

  .boya-pin{background:none!important;border:none!important;width:0!important;height:0!important}
  .pin{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:5px;
    padding:4px 9px 4px 6px;border-radius:999px;cursor:pointer;white-space:nowrap;
    background:rgba(12,20,30,.82);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(6px);
    box-shadow:0 3px 12px rgba(0,0,0,.5);transition:transform .12s,box-shadow .12s}
  .pin:hover{transform:translate(-50%,-50%) scale(1.07);box-shadow:0 5px 18px rgba(0,0,0,.65);z-index:9999}
  .pin .swatch{width:12px;height:12px;border-radius:50%;flex-shrink:0;box-shadow:0 0 0 1px rgba(255,255,255,.25) inset}
  .pin .nm{font-size:11px;font-weight:600;color:#dbe8f6}
  .pin .tp{font-size:12px;font-weight:800;letter-spacing:-.01em}
  .pin.pred{border-style:dashed;border-color:rgba(240,180,41,.7)}
  .pin.live .swatch{box-shadow:0 0 0 1px rgba(255,255,255,.25) inset,0 0 0 3px rgba(55,224,160,.35)}
  .pin.sel{border-color:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.25),0 6px 20px rgba(0,0,0,.7);z-index:9999}

  #leg{position:absolute;left:16px;bottom:14px;z-index:600;background:rgba(10,18,28,.7);
    border:1px solid var(--line);border-radius:12px;padding:8px 12px;backdrop-filter:blur(10px);
    display:flex;align-items:center;gap:9px;font-size:10.5px;color:var(--mut)}
  #leg .bar{width:120px;height:8px;border-radius:5px;border:1px solid rgba(255,255,255,.12);
    background:linear-gradient(90deg,#2159c1,#1e9be0,#27c1a7,#a8cf3f,#f0b429,#ff7a3c,#e0331e)}

  /* timeline */
  #tl{padding:16px 20px 8px;border-top:1px solid var(--line)}
  #tl .btns{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .rb{height:36px;border-radius:11px;border:1px solid var(--line);background:var(--glass2);color:var(--ink);
    cursor:pointer;font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;gap:6px;
    padding:0 13px;transition:background .15s,border-color .15s;backdrop-filter:blur(8px)}
  .rb:hover{background:rgba(255,255,255,.13)}
  .rb.on{border-color:currentColor}
  .rb.ahora{color:var(--live)} .rb.pred{color:var(--gold)} .rb.play{width:36px;padding:0;justify-content:center;color:var(--ink)}
  .rb .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
  #when{margin-left:auto;text-align:right}
  #when .w{font-size:15px;font-weight:700;letter-spacing:-.01em}
  #when .s{font-size:9.5px;font-weight:700;letter-spacing:.11em;text-transform:uppercase}
  #when .s.live{color:var(--live)} #when .s.pred{color:var(--gold)} #when .s.hist{color:var(--mut2)}

  #trkwrap{position:relative;margin-top:14px;padding-bottom:4px}
  #trk{width:100%;-webkit-appearance:none;appearance:none;height:6px;border-radius:6px;outline:none;cursor:pointer;
    background:linear-gradient(90deg,#24405e 0 var(--ph),var(--live) var(--ph) var(--pa),rgba(240,180,41,.55) var(--pa) 100%)}
  #trk::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:#fff;
    border:3px solid #0a121c;cursor:pointer;box-shadow:0 2px 9px rgba(0,0,0,.6)}
  #trk::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid #0a121c;cursor:pointer}
  #hoy-tick{position:absolute;top:-3px;width:2px;height:12px;background:var(--live);border-radius:2px;
    transform:translateX(-50%);pointer-events:none}
  #tlab{display:flex;justify-content:space-between;font-size:9.5px;color:var(--mut2);margin-top:8px}
  #tlab .now{color:var(--live);font-weight:700} #tlab .fut{color:var(--gold);font-weight:700}
  #hint{font-size:10.5px;color:var(--mut2);text-align:center;padding:2px 20px 14px}

  /* detalle */
  #det{position:absolute;inset:0;z-index:1500;display:flex;align-items:flex-end;justify-content:center;
    background:rgba(6,10,16,.55);opacity:0;pointer-events:none;transition:opacity .25s}
  #det.open{opacity:1;pointer-events:auto}
  #sheet{width:100%;max-width:520px;background:rgba(12,19,29,.97);border:1px solid var(--line);
    border-radius:20px 20px 0 0;padding:20px 22px 22px;transform:translateY(20px);transition:transform .28s cubic-bezier(.22,.61,.36,1);
    max-height:92%;overflow-y:auto;backdrop-filter:blur(18px)}
  #det.open #sheet{transform:translateY(0)}
  #sheet .x{position:absolute;top:14px;right:16px;width:30px;height:30px;border-radius:50%;border:1px solid var(--line);
    background:var(--glass2);color:var(--ink);cursor:pointer;font-size:15px}
  .dnom{font-size:20px;font-weight:700} .dred{font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--mut2);margin:3px 0 12px}
  .dtemp{font-size:46px;font-weight:200;letter-spacing:-.03em;line-height:1}.dtemp small{font-size:19px;color:var(--mut)}
  .dsub{font-size:12.5px;color:var(--mut);margin-top:5px}.dsub b{color:var(--live)}
  .drange{font-size:12.5px;color:#ffcf9a;margin-top:3px}
  #sheet canvas{width:100%;height:130px;margin:14px 0 6px;display:block}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
  .box{background:var(--glass);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
  .box .l{font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--mut2);font-weight:600}
  .box .v{font-size:16px;font-weight:600;margin-top:3px}.box .v.rec{color:#ff9d7a}
  .box .l2{font-size:10px;color:var(--mut2);margin-top:2px}
  .model{margin-top:12px;font-size:11px;color:var(--mut);background:var(--glass);border:1px solid var(--line);
    border-radius:12px;padding:10px 12px;line-height:1.55}.model b{color:#a9c6e0}

  @media(max-width:600px){#mapa{height:400px}#hd h1{font-size:16px}#when .w{font-size:13px}}
</style>
</head>
<body>
<div id="app">
  <div id="hd">
    <div class="row">
      <span class="badge"><span class="dot"></span>En directo</span>
    </div>
    <h1>Temperatura del mar en España</h1>
    <div class="sub" id="sub">Cargando datos de las boyas…</div>
  </div>

  <div id="wrap">
    <div id="mapa"></div>
    <div id="leg"><span>11°</span><div class="bar"></div><span>29°</span></div>
    <div id="det"><div id="sheet"><button class="x" id="x">×</button><div id="sheet-body"></div></div></div>
  </div>

  <div id="tl">
    <div class="btns">
      <button class="rb ahora on" id="b-ahora"><span class="dot"></span>Ahora</button>
      <button class="rb play" id="b-play">▶</button>
      <button class="rb pred" id="b-pred">Predicción ▸</button>
      <div id="when"><div class="w" id="w-w">—</div><div class="s" id="w-s"></div></div>
    </div>
    <div id="trkwrap">
      <input type="range" id="trk" min="0" max="1" value="0" step="1">
      <div id="hoy-tick"></div>
      <div id="tlab"><span id="t-ini"></span><span class="now">hoy</span><span class="fut">+12 meses</span></div>
    </div>
  </div>
  <div id="hint">Arrastra la barra para ver meses pasados · pulsa <b>Predicción</b> o ▶ para el futuro que estima el modelo · toca una boya para su ficha</div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function(){
  var URL_MAPA='boyas_mapa.json?v='+Date.now(), URL_ACTUAL='boyas_actual.json?v='+Date.now();
  var MES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  var datos=null,actual=null,mapa=null,marc={},idx=0,total=0,nHist=0,IDX=0,sel=null,playing=false,timer=null;

  var STOPS=[[11,[33,89,193]],[14,[30,155,224]],[17,[39,193,167]],[20,[168,207,63]],[23,[240,180,41]],[26,[255,122,60]],[29,[224,51,30]]];
  function color(t){if(t==null)return '#44566a';if(t<=STOPS[0][0])return rgb(STOPS[0][1]);
    for(var i=1;i<STOPS.length;i++){if(t<=STOPS[i][0]){var a=STOPS[i-1],b=STOPS[i],f=(t-a[0])/(b[0]-a[0]);
      return rgb([0,1,2].map(function(k){return Math.round(a[1][k]+f*(b[1][k]-a[1][k]))}))}}return rgb(STOPS[6][1])}
  function rgb(c){return 'rgb('+c[0]+','+c[1]+','+c[2]+')'}
  function nMes(ym){var p=ym.split('-');return MES[+p[1]-1]+' '+p[0]}
  function fBonita(iso){var p=iso.split('-');return p[2]+' '+MES[+p[1]-1]+' '+p[0]}
  function corto(n){return n.replace(' (costera)','')}

  function valorEn(b,i){
    if(i<nHist)return b.serie[i]!=null?{v:b.serie[i],tipo:'hist'}:null;
    if(i===IDX){var a=actual&&actual.boyas?actual.boyas[b.id]:null;
      if(a)return{v:a.temp,tipo:'live',fecha:a.fecha};
      for(var k=nHist-1;k>=0;k--)if(b.serie[k]!=null)return{v:b.serie[k],tipo:'hist'};return null}
    var j=i-IDX-1;
    if(b.prediccion&&b.prediccion.central[j]!=null)return{v:b.prediccion.central[j],tipo:'pred',p10:b.prediccion.p10[j],p90:b.prediccion.p90[j]};
    return null;
  }
  function etq(i){if(i===IDX)return{w:'Ahora',s:'dato de hoy',c:'live'};
    if(i<nHist)return{w:nMes(datos.meses[i]),s:'observado',c:'hist'};
    return{w:nMes(datos.meses_futuro[i-IDX-1]),s:'predicción',c:'pred'}}

  function pinHtml(b,r){
    var cls='pin '+(r?r.tipo:'')+(sel===b.id?' sel':'');
    var sw=r?color(r.v):'#44566a', tp=r?'<span class="tp" style="color:'+color(r.v)+'">'+r.v.toFixed(1)+'°</span>':'<span class="tp">—</span>';
    return '<div class="'+cls+'"><span class="swatch" style="background:'+sw+'"></span><span class="nm">'+corto(b.nombre)+'</span>'+tp+'</div>';
  }
  function pintar(){
    var e=etq(idx);document.getElementById('w-w').textContent=e.w;
    var ws=document.getElementById('w-s');ws.textContent=e.s;ws.className='s '+e.c;
    document.getElementById('b-ahora').classList.toggle('on',idx===IDX);
    document.getElementById('b-pred').classList.toggle('on',idx>IDX);
    Object.keys(datos.boyas).forEach(function(id){var b=datos.boyas[id],r=valorEn(b,idx);
      marc[id].setIcon(L.divIcon({className:'boya-pin',html:pinHtml(b,r),iconSize:[0,0],iconAnchor:[0,0]}))});
  }

  function sparkline(cv,b){
    var ctx=cv.getContext('2d'),W=cv.width=cv.clientWidth*2,H=cv.height=260;ctx.clearRect(0,0,W,H);
    var hist=[];for(var i=Math.max(0,nHist-24);i<nHist;i++)hist.push(b.serie[i]);
    var pred=b.prediccion,vals=hist.slice();if(pred)vals=vals.concat(pred.central,pred.p10,pred.p90);
    var num=vals.filter(function(x){return x!=null});if(!num.length)return;
    var mn=Math.min.apply(null,num)-.5,mx=Math.max.apply(null,num)+.5,n=hist.length+(pred?12:0);
    function X(i){return 10+i*(W-20)/(n-1)}function Y(v){return H-18-(v-mn)*(H-36)/(mx-mn)}
    if(pred){ctx.beginPath();var op=false;for(var j=0;j<12;j++)if(pred.p90[j]!=null){var x=X(hist.length+j);if(!op){ctx.moveTo(x,Y(pred.p90[j]));op=true}else ctx.lineTo(x,Y(pred.p90[j]))}
      for(var j2=11;j2>=0;j2--)if(pred.p10[j2]!=null)ctx.lineTo(X(hist.length+j2),Y(pred.p10[j2]));ctx.closePath();ctx.fillStyle='rgba(240,180,41,.18)';ctx.fill()}
    ctx.beginPath();ctx.strokeStyle='#5aa9e0';ctx.lineWidth=2.6;var o=false;
    hist.forEach(function(v,i){if(v==null){o=false;return}var x=X(i),y=Y(v);if(!o){ctx.moveTo(x,y);o=true}else ctx.lineTo(x,y)});ctx.stroke();
    if(pred){ctx.beginPath();ctx.setLineDash([6,5]);ctx.strokeStyle='#f0b429';ctx.lineWidth=2.6;var last=null;
      for(var i2=hist.length-1;i2>=0;i2--)if(hist[i2]!=null){last=i2;break}if(last!=null)ctx.moveTo(X(last),Y(hist[last]));
      for(var j3=0;j3<12;j3++)if(pred.central[j3]!=null)ctx.lineTo(X(hist.length+j3),Y(pred.central[j3]));ctx.stroke();ctx.setLineDash([])}
    ctx.beginPath();ctx.strokeStyle='rgba(255,255,255,.2)';ctx.lineWidth=1;ctx.moveTo(X(hist.length-1),8);ctx.lineTo(X(hist.length-1),H-8);ctx.stroke();
  }

  function abrir(id){
    sel=id;pintar();var b=datos.boyas[id],s=b.stats||{},r=valorEn(b,idx),a=actual&&actual.boyas?actual.boyas[id]:null;
    var h='<div class="dnom">'+b.nombre+'</div><div class="dred">'+(b.red||'')+(b.codigo_bd?' · boya '+b.codigo_bd:'')+' · serie desde '+((s.inicio||'—').slice(0,4))+'</div>';
    if(r){h+='<div class="dtemp">'+r.v.toFixed(1)+'<small>°C</small></div>';
      if(r.tipo==='live')h+='<div class="dsub"><b>ahora</b> · medido el '+fBonita(r.fecha)+'</div>';
      else if(r.tipo==='pred'){h+='<div class="dsub">predicción para '+nMes(datos.meses_futuro[idx-IDX-1])+'</div>';if(r.p10!=null)h+='<div class="drange">rango probable (80%): '+r.p10.toFixed(1)+' – '+r.p90.toFixed(1)+' °C</div>'}
      else h+='<div class="dsub">media de '+nMes(datos.meses[idx])+'</div>'}
    h+='<canvas id="spk"></canvas><div class="grid">';
    if(a)h+='<div class="box"><div class="l">Temperatura hoy</div><div class="v" style="color:#8effc0">'+a.temp.toFixed(1)+' °C</div></div>';
    if(s.record_max)h+='<div class="box"><div class="l">Récord histórico</div><div class="v rec">'+s.record_max.valor.toFixed(1)+' °C</div><div class="l2">'+s.record_max.fecha+'</div></div>';
    if(s.record_min)h+='<div class="box"><div class="l">Mínimo histórico</div><div class="v">'+s.record_min.valor.toFixed(1)+' °C</div><div class="l2">'+s.record_min.fecha+'</div></div>';
    if(s.tendencia_decada!=null)h+='<div class="box"><div class="l">Calentamiento</div><div class="v">'+(s.tendencia_decada>0?'+':'')+s.tendencia_decada.toFixed(2)+' °C</div><div class="l2">por década</div></div>';
    if(s.anio_mas_calido)h+='<div class="box"><div class="l">Año más cálido</div><div class="v">'+s.anio_mas_calido.anio+'</div><div class="l2">'+s.anio_mas_calido.media.toFixed(1)+' °C de media</div></div>';
    if(s.anomalia_reciente!=null)h+='<div class="box"><div class="l">Anomalía reciente</div><div class="v">'+(s.anomalia_reciente>0?'+':'')+s.anomalia_reciente.toFixed(1)+' °C</div><div class="l2">frente a lo normal</div></div>';
    if(s.record_dias25)h+='<div class="box"><div class="l">Récord días ≥25°</div><div class="v">'+s.record_dias25.dias+'</div><div class="l2">en '+s.record_dias25.anio+'</div></div>';
    h+='</div>';
    if(b.metricas&&b.metricas.mae_1m!=null)h+='<div class="model">Fiabilidad del modelo aquí (validado con datos reales): error de <b>±'+b.metricas.mae_1m.toFixed(2)+' °C</b> a 1 mes'+(b.metricas.mae_3m!=null?' y <b>±'+b.metricas.mae_3m.toFixed(2)+' °C</b> a 3 meses':'')+'.</div>';
    else if(!b.prediccion)h+='<div class="model">Serie aún corta: esta boya muestra solo observaciones, sin predicción.</div>';
    document.getElementById('sheet-body').innerHTML=h;
    document.getElementById('det').classList.add('open');
    mapa.panTo([b.lat,b.lon],{animate:true});
    setTimeout(function(){var cv=document.getElementById('spk');if(cv)sparkline(cv,b)},70);
  }
  function cerrar(){document.getElementById('det').classList.remove('open');sel=null;pintar()}

  function resumen(){
    var vs=[];Object.keys(datos.boyas).forEach(function(id){var r=valorEn(datos.boyas[id],IDX);if(r)vs.push({n:corto(datos.boyas[id].nombre),v:r.v})});
    if(!vs.length){document.getElementById('sub').textContent='';return}
    var media=vs.reduce(function(a,b){return a+b.v},0)/vs.length;
    var cal=vs.slice().sort(function(a,b){return b.v-a.v})[0], fri=vs.slice().sort(function(a,b){return a.v-b.v})[0];
    var fecha=actual&&actual.generado?actual.generado.slice(0,10):(datos.generado||'');
    document.getElementById('sub').innerHTML='Ahora mismo: media <b>'+media.toFixed(1)+' °C</b> · más cálida <b>'+cal.n+' '+cal.v.toFixed(1)+'°</b> · más fría <b>'+fri.n+' '+fri.v.toFixed(1)+'°</b> · '+vs.length+' boyas · '+fecha;
  }

  function iniciar(j,act){
    datos=j;actual=act;Object.keys(datos.boyas).forEach(function(id){datos.boyas[id].id=id});
    nHist=datos.meses.length;IDX=nHist;total=nHist+1+datos.meses_futuro.length;idx=IDX;

    mapa=L.map('mapa',{zoomControl:true,scrollWheelZoom:false}).setView([38.6,-3.2],5);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',
      {attribution:'© OpenStreetMap · © CARTO · Puertos del Estado vía Copernicus Marine',subdomains:'abcd',maxZoom:12}).addTo(mapa);

    Object.keys(datos.boyas).forEach(function(id){var b=datos.boyas[id];
      var m=L.marker([b.lat,b.lon],{icon:L.divIcon({className:'boya-pin',html:'',iconSize:[0,0],iconAnchor:[0,0]}),riseOnHover:true}).addTo(mapa);
      m.on('click',function(){abrir(id)});marc[id]=m});

    var trk=document.getElementById('trk');trk.max=total-1;trk.value=idx;
    var ph=(nHist/(total-1)*100), pa=((IDX+1)/(total-1)*100);
    trk.style.setProperty('--ph',ph.toFixed(1)+'%');trk.style.setProperty('--pa',pa.toFixed(1)+'%');
    document.getElementById('hoy-tick').style.left=(nHist/(total-1)*100).toFixed(1)+'%';
    trk.addEventListener('input',function(){idx=+this.value;pintar()});

    document.getElementById('t-ini').textContent=nMes(datos.meses[0]);
    document.getElementById('b-ahora').addEventListener('click',function(){idx=IDX;trk.value=idx;pintar()});
    document.getElementById('b-pred').addEventListener('click',function(){idx=Math.min(total-1,IDX+6);trk.value=idx;pintar()});
    document.getElementById('x').addEventListener('click',cerrar);
    document.getElementById('det').addEventListener('click',function(e){if(e.target.id==='det')cerrar()});

    var pb=document.getElementById('b-play');
    pb.addEventListener('click',function(){playing=!playing;pb.textContent=playing?'❚❚':'▶';
      if(playing){if(idx>=total-1)idx=0;timer=setInterval(function(){idx++;if(idx>=total){idx=total-1;playing=false;pb.textContent='▶';clearInterval(timer)}trk.value=idx;pintar()},210)}else clearInterval(timer)});

    resumen();pintar();
  }

  Promise.all([
    fetch(URL_MAPA).then(function(r){return r.json()}),
    fetch(URL_ACTUAL).then(function(r){return r.ok?r.json():null}).catch(function(){return null})
  ]).then(function(res){iniciar(res[0],res[1])})
   .catch(function(e){document.getElementById('sub').textContent='Error cargando datos';console.error(e)});
})();
</script>
