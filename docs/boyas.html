<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Temperatura del mar en España por boyas · histórico y predicción</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: Arial, sans-serif; background: #0a1218; }
  #mapa { width: 100%; height: 480px; background: #0a1218; }

  #cabecera {
    background: #060e14; color: white; padding: 10px 16px;
    display: flex; justify-content: space-between; align-items: center;
    flex-wrap: wrap; gap: 6px; border-bottom: 1px solid #1a3040;
  }
  #cabecera h2 { font-size: 14px; font-weight: 500; letter-spacing: .04em; color: #e0f0ff; }
  #info-derecha { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
  #resumen { font-size: 11px; color: #5a8aaa; }
  #ultima-act { font-size: 11px; color: #4a6a8a; }

  #leyenda {
    background: #080c12; padding: 7px 16px; display: flex; flex-wrap: wrap;
    gap: 12px; align-items: center; border-bottom: 1px solid #1a3040;
    font-size: 11px; color: #7a9aaa;
  }
  #leyenda strong { color: #9abccc; font-weight: 500; }
  #grad {
    width: 150px; height: 10px; border-radius: 5px;
    background: linear-gradient(90deg,#2159c1,#1e9be0,#27c1a7,#a8cf3f,#e8b325,#e0661f,#CC2200);
    border: 1px solid rgba(255,255,255,.12);
  }
  .chip-pred {
    padding: 2px 8px; border-radius: 10px; font-size: 10px; font-weight: 700;
    letter-spacing: .06em; color: #ffd9a8; background: #2a1d08;
    border: 1px dashed #c98a2b;
  }

  /* ------ barra temporal ------ */
  #barra {
    background: #060e14; border-top: 1px solid #1a3040;
    padding: 10px 16px 14px; color: #cfe6f5;
  }
  #barra-fila1 { display: flex; align-items: center; gap: 12px; }
  #btn-play {
    width: 34px; height: 34px; border-radius: 50%; border: 1px solid #1e3a5c;
    background: #0a1828; color: #9fc6e0; font-size: 14px; cursor: pointer;
    flex-shrink: 0; transition: background .2s;
  }
  #btn-play:hover { background: #123049; }
  #slider-zona { flex: 1; position: relative; }
  #slider {
    width: 100%; -webkit-appearance: none; appearance: none; height: 8px;
    border-radius: 4px; outline: none; cursor: pointer;
    background: linear-gradient(90deg, #1e3a5c var(--pct-hist), #6b4a12 var(--pct-hist));
  }
  #slider::-webkit-slider-thumb {
    -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%;
    background: #e8f0ff; border: 2px solid #0a1828; cursor: pointer;
  }
  #slider::-moz-range-thumb {
    width: 16px; height: 16px; border-radius: 50%;
    background: #e8f0ff; border: 2px solid #0a1828; cursor: pointer;
  }
  #etiquetas { display: flex; justify-content: space-between; font-size: 10px; color: #4a6a8a; margin-top: 4px; }
  #eti-futuro { color: #c98a2b; font-weight: 700; }
  #mes-actual {
    min-width: 150px; text-align: center; font-size: 13px; font-weight: 600;
    color: #e8f0ff; background: #0a1828; border: 1px solid #1e3a5c;
    border-radius: 10px; padding: 6px 10px; flex-shrink: 0;
  }
  #mes-actual .sub { display: block; font-size: 9px; font-weight: 700; letter-spacing: .08em; color: #c98a2b; }

  /* ------ popups ------ */
  .leaflet-popup-content-wrapper {
    background: #0a1828 !important; border: 1px solid #1e3a5c !important;
    border-radius: 14px !important; box-shadow: 0 8px 32px rgba(0,0,0,.8) !important;
    color: #e0eeff !important;
  }
  .leaflet-popup-content { margin: 14px 16px !important; width: 270px !important; }
  .leaflet-popup-tip { background: #0a1828 !important; }
  .leaflet-popup-close-button { color: #4a6a8a !important; }
  .popup-titulo { font-weight: 700; font-size: 15px; color: #e8f0ff; }
  .popup-red   { font-size: 10px; color: #5a8aaa; letter-spacing: .05em; margin: 2px 0 8px; }
  .popup-temp  { font-size: 28px; font-weight: 300; color: #e8f0ff; letter-spacing: -.02em; }
  .popup-etiq  { font-size: 11px; color: #7a9aaa; margin-bottom: 8px; }
  .popup-rango { font-size: 11px; color: #ffd9a8; margin: -4px 0 8px; }
  .popup-dato  {
    display: flex; justify-content: space-between; padding: 4px 0;
    border-bottom: 1px solid #1a2a40; font-size: 11.5px; color: #7a9aaa;
  }
  .popup-dato span:last-child { font-weight: 600; color: #c8e0f0; text-align: right; }
  .popup-dato .rec { color: #ff9d7a; }
  .popup-modelo {
    margin-top: 10px; padding: 7px 9px; background: #0d1a28; border: 1px solid #1a3040;
    border-radius: 8px; font-size: 10.5px; color: #6a92ac; line-height: 1.5;
  }
  .popup-modelo b { color: #9fc6e0; }
  canvas.spark { width: 100%; height: 74px; margin: 6px 0 2px; display: block; }

  .leaflet-control-zoom a {
    background: #0a1828 !important; color: #7a9aaa !important; border-color: #1e3a5c !important;
  }
  .leaflet-control-attribution {
    background: rgba(6,14,20,.8) !important; color: #4a6a8a !important; font-size: 9px !important;
  }
  .leaflet-control-attribution a { color: #5a8aaa !important; }
  .leaflet-tooltip.temp-tip {
    background: #0a1828; border: 1px solid #1e3a5c; color: #e8f0ff;
    font-weight: 700; font-size: 11px; border-radius: 8px; padding: 2px 8px;
  }
  .leaflet-tooltip.temp-tip:before { display: none; }

  @media (max-width: 560px) {
    #mapa { height: 400px; }
    #mes-actual { min-width: 118px; font-size: 11.5px; }
    #leyenda { gap: 8px; }
  }
</style>
</head>
<body>

<div id="cabecera">
  <h2>🌊 TEMPERATURA DEL MAR EN ESPAÑA · BOYAS DE PUERTOS DEL ESTADO</h2>
  <div id="info-derecha">
    <div id="resumen">Cargando…</div>
    <div id="ultima-act"></div>
  </div>
</div>

<div id="leyenda">
  <strong>Temperatura del agua</strong>
  <span>11&nbsp;°C</span><div id="grad"></div><span>29&nbsp;°C</span>
  <span class="chip-pred">TRAMO FUTURO = PREDICCIÓN DEL MODELO</span>
</div>

<div id="mapa"></div>

<div id="barra">
  <div id="barra-fila1">
    <button id="btn-play" title="Reproducir">▶</button>
    <div id="slider-zona">
      <input type="range" id="slider" min="0" max="1" value="0" step="1">
      <div id="etiquetas">
        <span id="eti-inicio"></span>
        <span id="eti-futuro">⟶ predicción 12 meses</span>
      </div>
    </div>
    <div id="mes-actual"><span id="mes-txt">—</span><span class="sub" id="mes-sub"></span></div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function () {
  var URL_DATOS = 'boyas_mapa.json?v=' + Date.now();
  var MESES_ES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  var datos = null, mapa = null, marcadores = {}, idx = 0, total = 0, nHist = 0;
  var reproduciendo = false, timer = null, popupAbierto = null;

  // ---- escala de color 11..29 °C
  var PARADAS = [
    [11, [33, 89, 193]], [14, [30, 155, 224]], [17, [39, 193, 167]],
    [20, [168, 207, 63]], [23, [232, 179, 37]], [26, [224, 102, 31]],
    [29, [204, 34, 0]]
  ];
  function color(t) {
    if (t == null) return '#3a4a5a';
    if (t <= PARADAS[0][0]) return rgb(PARADAS[0][1]);
    for (var i = 1; i < PARADAS.length; i++) {
      if (t <= PARADAS[i][0]) {
        var a = PARADAS[i-1], b = PARADAS[i];
        var f = (t - a[0]) / (b[0] - a[0]);
        return rgb([0,1,2].map(function (k) { return Math.round(a[1][k] + f * (b[1][k] - a[1][k])); }));
      }
    }
    return rgb(PARADAS[PARADAS.length-1][1]);
  }
  function rgb(c) { return 'rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')'; }

  function nombreMes(ym) {
    var p = ym.split('-');
    return MESES_ES[+p[1] - 1] + ' ' + p[0];
  }

  // ---- valor de una boya en el índice global (histórico o predicción)
  function valorEn(b, i) {
    if (i < nHist) return b.serie[i] != null ? { v: b.serie[i], pred: false } : null;
    var j = i - nHist;
    if (b.prediccion && b.prediccion.central[j] != null) {
      return { v: b.prediccion.central[j], pred: true,
               p10: b.prediccion.p10[j], p90: b.prediccion.p90[j] };
    }
    return null;
  }

  function pintar() {
    var ym = (idx < nHist) ? datos.meses[idx] : datos.meses_futuro[idx - nHist];
    document.getElementById('mes-txt').textContent = nombreMes(ym);
    document.getElementById('mes-sub').textContent = (idx < nHist) ? '' : 'PREDICCIÓN';
    Object.keys(datos.boyas).forEach(function (id) {
      var b = datos.boyas[id], m = marcadores[id];
      var r = valorEn(b, idx);
      m.setStyle({
        fillColor: r ? color(r.v) : '#3a4a5a',
        fillOpacity: r ? 0.92 : 0.35,
        dashArray: r && r.pred ? '3,3' : null,
        color: r && r.pred ? '#ffd9a8' : '#06121c'
      });
      m.setTooltipContent(b.nombre + ': ' + (r ? r.v.toFixed(1) + ' °C' + (r.pred ? ' (pred.)' : '') : 'sin dato'));
    });
    if (popupAbierto) { abrirFicha(popupAbierto, false); }
  }

  // ---- sparkline: últimos 24 meses + 12 de predicción con banda
  function sparkline(cv, b) {
    var ctx = cv.getContext('2d');
    var W = cv.width = cv.clientWidth * 2, H = cv.height = 148;
    ctx.clearRect(0, 0, W, H);
    var hist = [], fechas = [];
    for (var i = Math.max(0, nHist - 24); i < nHist; i++) { hist.push(b.serie[i]); fechas.push(datos.meses[i]); }
    var pred = b.prediccion;
    var vals = hist.slice();
    if (pred) { vals = vals.concat(pred.central, pred.p10, pred.p90); }
    var num = vals.filter(function (x) { return x != null; });
    if (!num.length) return;
    var mn = Math.min.apply(null, num) - 0.5, mx = Math.max.apply(null, num) + 0.5;
    var n = hist.length + (pred ? 12 : 0);
    function X(i) { return 8 + i * (W - 16) / (n - 1); }
    function Y(v) { return H - 12 - (v - mn) * (H - 24) / (mx - mn); }
    // banda de predicción p10-p90
    if (pred) {
      ctx.beginPath();
      var empieza = false;
      for (var j = 0; j < 12; j++) if (pred.p90[j] != null) {
        var x = X(hist.length + j);
        if (!empieza) { ctx.moveTo(x, Y(pred.p90[j])); empieza = true; } else ctx.lineTo(x, Y(pred.p90[j]));
      }
      for (var j = 11; j >= 0; j--) if (pred.p10[j] != null) ctx.lineTo(X(hist.length + j), Y(pred.p10[j]));
      ctx.closePath();
      ctx.fillStyle = 'rgba(201,138,43,0.20)';
      ctx.fill();
    }
    // línea histórica
    ctx.beginPath(); ctx.strokeStyle = '#7ab8e0'; ctx.lineWidth = 2.4;
    var open = false;
    hist.forEach(function (v, i) {
      if (v == null) { open = false; return; }
      var x = X(i), y = Y(v);
      if (!open) { ctx.moveTo(x, y); open = true; } else ctx.lineTo(x, y);
    });
    ctx.stroke();
    // línea de predicción discontinua
    if (pred) {
      ctx.beginPath(); ctx.setLineDash([6, 5]); ctx.strokeStyle = '#e8b325'; ctx.lineWidth = 2.4;
      var last = null;
      for (var i = hist.length - 1; i >= 0; i--) if (hist[i] != null) { last = i; break; }
      if (last != null) ctx.moveTo(X(last), Y(hist[last]));
      for (var j = 0; j < 12; j++) if (pred.central[j] != null) ctx.lineTo(X(hist.length + j), Y(pred.central[j]));
      ctx.stroke(); ctx.setLineDash([]);
    }
    // separador hoy
    ctx.beginPath(); ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = 1;
    ctx.moveTo(X(hist.length - 1), 6); ctx.lineTo(X(hist.length - 1), H - 6); ctx.stroke();
  }

  function abrirFicha(id, centrar) {
    var b = datos.boyas[id];
    popupAbierto = id;
    var r = valorEn(b, idx);
    var s = b.stats || {};
    var h = '<div class="popup-titulo">' + b.nombre + '</div>' +
      '<div class="popup-red">' + b.red + (b.codigo_bd ? ' · boya ' + b.codigo_bd : '') +
      ' · serie desde ' + (s.inicio || '—').slice(0, 4) + '</div>';
    if (r) {
      h += '<div class="popup-temp">' + r.v.toFixed(1) + ' °C</div>';
      h += '<div class="popup-etiq">' + (r.pred ? 'predicción para ' : 'media de ') +
           nombreMes(idx < nHist ? datos.meses[idx] : datos.meses_futuro[idx - nHist]) + '</div>';
      if (r.pred && r.p10 != null) {
        h += '<div class="popup-rango">rango probable (80%): ' + r.p10.toFixed(1) + ' – ' + r.p90.toFixed(1) + ' °C</div>';
      }
    } else {
      h += '<div class="popup-etiq">sin dato para este mes</div>';
    }
    h += '<canvas class="spark" id="spark-' + id + '"></canvas>';
    if (s.record_max) {
      h += '<div class="popup-dato"><span>Récord histórico</span><span class="rec">' +
           s.record_max.valor.toFixed(1) + ' °C · ' + s.record_max.fecha + '</span></div>';
    }
    if (s.record_min) {
      h += '<div class="popup-dato"><span>Mínimo histórico</span><span>' +
           s.record_min.valor.toFixed(1) + ' °C · ' + s.record_min.fecha + '</span></div>';
    }
    if (s.tendencia_decada != null) {
      h += '<div class="popup-dato"><span>Calentamiento</span><span>' +
           (s.tendencia_decada > 0 ? '+' : '') + s.tendencia_decada.toFixed(2) + ' °C/década</span></div>';
    }
    if (s.anio_mas_calido) {
      h += '<div class="popup-dato"><span>Año más cálido</span><span>' +
           s.anio_mas_calido.anio + ' (' + s.anio_mas_calido.media.toFixed(1) + ' °C)</span></div>';
    }
    if (s.anomalia_reciente != null) {
      h += '<div class="popup-dato"><span>Anomalía últimas semanas</span><span>' +
           (s.anomalia_reciente > 0 ? '+' : '') + s.anomalia_reciente.toFixed(1) + ' °C vs normal</span></div>';
    }
    if (s.record_dias25) {
      h += '<div class="popup-dato"><span>Récord días ≥ 25 °C</span><span>' +
           s.record_dias25.dias + ' días (' + s.record_dias25.anio + ')</span></div>';
    }
    if (b.metricas && b.metricas.mae_1m != null) {
      h += '<div class="popup-modelo">Fiabilidad del modelo en esta boya (validación con datos reales): ' +
           'error medio de <b>±' + b.metricas.mae_1m.toFixed(2) + ' °C</b> a 1 mes' +
           (b.metricas.mae_3m != null ? ' y <b>±' + b.metricas.mae_3m.toFixed(2) + ' °C</b> a 3 meses' : '') +
           '.</div>';
    } else if (!b.prediccion) {
      h += '<div class="popup-modelo">Serie aún corta: esta boya muestra solo observaciones, sin predicción.</div>';
    }
    var m = marcadores[id];
    m.bindPopup(h, { maxWidth: 300 });
    m.openPopup();
    setTimeout(function () {
      var cv = document.getElementById('spark-' + id);
      if (cv) sparkline(cv, b);
    }, 60);
  }

  function iniciar(json) {
    datos = json;
    nHist = datos.meses.length;
    total = nHist + datos.meses_futuro.length;
    idx = nHist - 1;                       // arranca en el último mes observado

    mapa = L.map('mapa', { zoomControl: true, scrollWheelZoom: false })
            .setView([37.7, -4.5], 5);
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}',
      { attribution: 'Esri · Puertos del Estado vía Copernicus Marine / EMODnet', maxZoom: 10 }).addTo(mapa);
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}',
      { maxZoom: 10 }).addTo(mapa);

    Object.keys(datos.boyas).forEach(function (id) {
      var b = datos.boyas[id];
      var m = L.circleMarker([b.lat, b.lon], {
        radius: 9, weight: 2, color: '#06121c', fillColor: '#3a4a5a', fillOpacity: .9
      }).addTo(mapa);
      m.bindTooltip('', { className: 'temp-tip', direction: 'top', offset: [0, -8] });
      m.on('click', function () { abrirFicha(id, true); });
      m.on('popupclose', function () { if (popupAbierto === id) popupAbierto = null; });
      marcadores[id] = m;
    });

    var slider = document.getElementById('slider');
    slider.max = total - 1;
    slider.value = idx;
    slider.style.setProperty('--pct-hist', (nHist / total * 100).toFixed(1) + '%');
    slider.addEventListener('input', function () { idx = +this.value; pintar(); });

    document.getElementById('eti-inicio').textContent = nombreMes(datos.meses[0]);
    document.getElementById('ultima-act').textContent = 'Actualizado: ' + (datos.generado || '');

    // resumen: media del último mes observado
    var suma = 0, nn = 0;
    Object.keys(datos.boyas).forEach(function (id) {
      var v = datos.boyas[id].serie[nHist - 1];
      if (v != null) { suma += v; nn++; }
    });
    document.getElementById('resumen').textContent =
      nn + ' boyas · media ' + (nn ? (suma / nn).toFixed(1) : '—') + ' °C en ' + nombreMes(datos.meses[nHist - 1]);

    var btn = document.getElementById('btn-play');
    btn.addEventListener('click', function () {
      reproduciendo = !reproduciendo;
      btn.textContent = reproduciendo ? '❚❚' : '▶';
      if (reproduciendo) {
        if (idx >= total - 1) idx = 0;
        timer = setInterval(function () {
          idx++;
          if (idx >= total) { idx = total - 1; reproduciendo = false; btn.textContent = '▶'; clearInterval(timer); }
          slider.value = idx; pintar();
        }, 260);
      } else { clearInterval(timer); }
    });

    pintar();
  }

  fetch(URL_DATOS)
    .then(function (r) { return r.json(); })
    .then(iniciar)
    .catch(function (e) {
      document.getElementById('resumen').textContent = 'Error cargando datos';
      console.error(e);
    });
})();
</script>
</body>
</html>
